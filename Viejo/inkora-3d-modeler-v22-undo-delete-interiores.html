<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INKORA · Keychain 3D Modeler v21</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap');
:root {
  --bg:       #080809;
  --surface:  #0f0f12;
  --surface2: #16161b;
  --surface3: #1c1c23;
  --border:   #252530;
  --border2:  #1e1e28;
  --accent:   #b8f04a;
  --accent2:  #d4ff70;
  --accent-dim: rgba(184,240,74,0.12);
  --text:     #dddde8;
  --text-dim: #6a6a7a;
  --text-faint: #3a3a48;
  --danger:   #ff4f4f;
  --panel-w:  296px;
  --header-h: 48px;
  --tabs-h:   34px;
  --r:        5px;
  --r2:       8px;
  --mono:     'IBM Plex Mono','Courier New',monospace;
  --display:  'Syne',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px}
#app{display:grid;grid-template-rows:var(--header-h) var(--tabs-h) 1fr;grid-template-columns:1fr var(--panel-w);height:100vh}

/* ── Header ── */
#header{
  grid-column:1/-1;
  display:flex;align-items:center;gap:10px;
  padding:0 14px;
  background:var(--surface);
  border-bottom:1px solid var(--border2);
  z-index:10;
  position:relative;
}
#header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,var(--accent),transparent 60%);
  opacity:.18;
}
.logo{
  font-family:var(--display);font-weight:800;font-size:13px;
  letter-spacing:.08em;color:var(--accent);text-transform:uppercase;
  display:flex;align-items:center;gap:7px;flex-shrink:0;
}
.logo span{
  color:var(--text-faint);font-weight:600;font-size:9px;
  font-family:var(--mono);letter-spacing:.12em;
}
.sep{width:1px;height:20px;background:var(--border);flex-shrink:0;opacity:.6}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;
  border-radius:var(--r);
  border:1px solid var(--border);
  background:transparent;
  color:var(--text-dim);
  font-family:var(--mono);font-size:11px;
  cursor:pointer;
  transition:border-color .15s,color .15s,background .15s,box-shadow .15s;
  white-space:nowrap;user-select:none;
  letter-spacing:.02em;
}
.btn:hover{
  border-color:var(--accent);color:var(--accent);
  background:var(--accent-dim);
}
.btn.primary{
  background:var(--accent);color:#080809;
  border-color:var(--accent);font-weight:600;
  box-shadow:0 0 12px rgba(184,240,74,.2);
}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2);box-shadow:0 0 18px rgba(184,240,74,.3);}
.btn.primary:disabled{
  background:var(--surface3);color:var(--text-faint);
  border-color:var(--border);box-shadow:none;
}
.btn:disabled{opacity:.3;pointer-events:none}
.btn.danger{border-color:rgba(255,79,79,.4);color:var(--danger);background:transparent}
.btn.danger:hover{background:rgba(255,79,79,.08);border-color:var(--danger)}

/* ── Undo / Redo ── */
.history-group{
  display:flex;align-items:center;gap:1px;
  background:var(--bg);
  border:1px solid var(--border2);
  border-radius:var(--r);padding:2px;overflow:hidden;
}
.btn-hist{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:26px;border-radius:3px;border:none;
  background:transparent;color:var(--text-faint);font-size:13px;
  cursor:pointer;transition:background .1s,color .1s;user-select:none;flex-shrink:0;
}
.btn-hist:hover:not(:disabled){background:var(--surface3);color:var(--accent)}
.btn-hist:disabled{opacity:.25;cursor:default}
#history-label{
  font-size:9px;color:var(--text-faint);font-family:var(--mono);
  padding:0 5px;white-space:nowrap;min-width:46px;text-align:center;
  letter-spacing:.04em;
}

/* ── Viewport ──
   FIX CURSOR: el canvas no tiene cursor CSS — lo maneja JS via canvas.style.cursor
   para poder cambiar entre default/pointer/grab/grabbing dinámicamente. */
#vp-wrap{position:relative;overflow:hidden;background:var(--bg)}
#viewport{width:100%;height:100%;display:block;}

/* ── Drop overlay ── */
#drop-overlay{
  position:absolute;inset:0;
  background:rgba(184,240,74,.04);
  border:1px dashed rgba(184,240,74,.4);
  display:none;align-items:center;justify-content:center;
  font-family:var(--display);color:var(--accent);font-size:13px;
  letter-spacing:.12em;z-index:50;pointer-events:none;
  text-transform:uppercase;
}
#drop-overlay.active{display:flex}

/* ── HUD ── */
#hud{
  position:absolute;bottom:12px;left:14px;
  display:flex;gap:16px;
  font-size:9px;color:var(--text-faint);font-family:var(--mono);
  pointer-events:none;letter-spacing:.08em;text-transform:uppercase;
}
#hud b{color:var(--text-dim);font-weight:500}
#mode-badge{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  background:rgba(15,15,18,.85);
  border:1px solid var(--border);border-radius:20px;
  padding:4px 14px;font-size:10px;color:var(--text-faint);
  pointer-events:none;transition:border-color .2s,color .2s,background .2s;
  letter-spacing:.06em;backdrop-filter:blur(8px);
  font-family:var(--mono);
}
#mode-badge.selecting{
  border-color:rgba(184,240,74,.4);color:var(--accent);
  background:rgba(184,240,74,.06);
}
#sel-hint{
  position:absolute;top:42px;left:50%;transform:translateX(-50%);
  font-size:10px;color:var(--text-faint);pointer-events:none;
  font-family:var(--mono);white-space:nowrap;letter-spacing:.04em;
}

/* ── Panel ── */
#panel{
  background:var(--surface);
  border-left:1px solid var(--border2);
  display:flex;flex-direction:column;overflow:hidden;
}
.section{border-bottom:1px solid var(--border2);padding:11px 14px}
.section-title{
  font-family:var(--mono);font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-faint);margin-bottom:9px;
  display:flex;align-items:center;justify-content:space-between;
}
.section-badge{
  background:var(--accent);color:#080809;font-size:8px;
  padding:1px 6px;border-radius:10px;font-weight:600;letter-spacing:.04em;
}
.irow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.irow label{flex:1;color:var(--text-dim);font-size:11px;letter-spacing:.02em}
.inum{
  width:64px;padding:4px 8px;
  background:var(--bg);border:1px solid var(--border2);
  border-radius:var(--r);color:var(--text);
  font-family:var(--mono);font-size:11px;text-align:right;
  transition:border-color .12s;
}
.inum:focus{outline:none;border-color:var(--accent)}
.inum:disabled{opacity:0.35;cursor:not-allowed;}

/* ── Modo extrusión (solo visible con selección 3D) ── */
#extrude-mode-row{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--border2);}
#extrude-mode-row.vis{display:block;}
.extrude-mode-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;}
.extrude-mode-btns{display:flex;gap:4px;}
.extrude-mode-btn{
  flex:1;padding:4px 0;text-align:center;
  border:1px solid var(--border2);background:transparent;
  color:var(--text-faint);border-radius:var(--r);
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;
  cursor:pointer;transition:all .12s;
}
.extrude-mode-btn:hover{border-color:var(--border);color:var(--text-dim);}
.extrude-mode-btn.active{
  border-color:rgba(184,240,74,.4);color:var(--accent);
  background:rgba(184,240,74,.06);
}

/* ── Piece list ── */
#pieces-wrap{flex:1;overflow-y:auto;padding:4px 0;position:relative}
#pieces-wrap::-webkit-scrollbar{width:3px}
#pieces-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
/* .piece-item defined in presets/per-piece depth section below */
.piece-item:hover{background:var(--surface2)}
.piece-item.sel-2d{border-left-color:rgba(120,100,255,.8);background:rgba(120,100,255,.05)}
/* Hover desde viewport resalta la fila en el panel */
.piece-item.vp-hover{background:var(--surface3);border-left-color:rgba(100,100,160,.5)}
.piece-item.sel-2d.vp-hover{border-left-color:rgba(140,120,255,.9)}
.p-swatch{width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.1);flex-shrink:0;transition:transform .1s,box-shadow .1s;}
.piece-item:hover .p-swatch{box-shadow:0 0 0 1px rgba(255,255,255,.18);}
.p-name{flex:1;font-size:11px;color:var(--text)}
.p-tag{
  font-size:8px;font-family:var(--mono);
  padding:1px 5px;border-radius:3px;
  background:var(--surface3);color:var(--text-faint);
  border:1px solid var(--border2);letter-spacing:.06em;
}
.p-tag.is-3d{background:rgba(184,240,74,.08);color:var(--accent);border-color:rgba(184,240,74,.25)}

/* ── Color row ── */
/* ── Empty state ── */
#empty-state{
  padding:32px 16px;text-align:center;
  color:var(--text-faint);font-size:11px;line-height:1.9;
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  letter-spacing:.04em;
}
.empty-icon{font-size:22px;opacity:.2;margin-bottom:10px}

/* ── Toast ── */
#toast{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%) translateY(14px);
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:var(--r2);
  padding:8px 16px;font-size:11px;color:var(--text-dim);
  opacity:0;transition:opacity .18s,transform .18s;
  pointer-events:none;z-index:200;
  max-width:360px;text-align:center;
  letter-spacing:.03em;
  backdrop-filter:blur(12px);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(184,240,74,.4);color:var(--accent)}
#toast.err{border-color:rgba(255,79,79,.4);color:var(--danger)}

/* ── Select-all row ── */
.sel-all-row{
  display:flex;align-items:center;gap:7px;
  padding:5px 14px 4px;
  border-bottom:1px solid var(--border2);
}
.sel-all-row button{font-size:10px;padding:2px 8px}
.sel-count{font-size:10px;color:var(--text-faint);margin-left:auto;letter-spacing:.04em}

/* ── Piece item ── */
.piece-item{
  display:flex;align-items:center;gap:8px;
  padding:6px 14px;cursor:pointer;
  border-left:2px solid transparent;
  transition:background .1s,border-color .1s;
  user-select:none;
}
.p-row1{display:flex;align-items:center;gap:8px;width:100%}

/* ── Piece dimensions display (piezas 3D) ── */
.p-dims{
  font-size:8px;color:var(--text-faint);font-family:var(--mono);
  white-space:nowrap;letter-spacing:.04em;flex-shrink:0;opacity:.8;
}

/* ── Rename inline (doble click en p-name) ── */
.p-name-input{
  flex:1;background:var(--bg);
  border:1px solid rgba(184,240,74,.4);border-radius:3px;
  color:var(--text);font-family:var(--mono);font-size:11px;
  padding:1px 5px;outline:none;min-width:0;
}

/* ── Shortcuts dropdown ── */
#shortcuts-wrap{position:relative}
#btn-shortcuts{gap:5px;font-family:var(--mono);font-size:11px;letter-spacing:.04em}
#shortcuts-panel{
  position:absolute;top:calc(100% + 7px);right:0;width:330px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r2);
  box-shadow:0 12px 40px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.03);
  z-index:300;display:none;overflow:hidden;
}
#shortcuts-panel.open{display:block}
.sc-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 13px;border-bottom:1px solid var(--border2);
}
.sc-header-title{
  font-family:var(--mono);font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);
}
.sc-edit-btn{
  font-size:9px;padding:2px 8px;border-radius:4px;
  border:1px solid var(--border2);background:transparent;
  color:var(--text-faint);cursor:pointer;font-family:var(--mono);
  transition:all .12s;letter-spacing:.04em;
}
.sc-edit-btn:hover,.sc-edit-btn.active{border-color:rgba(184,240,74,.4);color:var(--accent)}
.sc-list{max-height:360px;overflow-y:auto;padding:5px 0}
.sc-list::-webkit-scrollbar{width:3px}
.sc-list::-webkit-scrollbar-thumb{background:var(--border2)}
.sc-group{padding:3px 0}
.sc-group-label{
  font-family:var(--mono);font-size:8px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--text-faint);
  padding:6px 13px 2px;opacity:.5;
}
.sc-row{display:flex;align-items:center;gap:10px;padding:5px 13px;transition:background .1s}
.sc-row:hover{background:var(--surface2)}
.sc-desc{flex:1;font-size:11px;color:var(--text-dim)}
.sc-key{display:inline-flex;align-items:center;gap:3px;flex-shrink:0}
kbd{
  display:inline-block;padding:2px 6px;
  border-radius:4px;border:1px solid var(--border2);
  background:var(--surface3);font-family:var(--mono);font-size:9px;
  color:var(--text-faint);min-width:20px;text-align:center;line-height:1.6;
}
kbd.mod{background:rgba(184,240,74,.07);color:rgba(184,240,74,.7);border-color:rgba(184,240,74,.2)}
/* Edit mode */
.sc-row.editing .sc-key{display:none}
.sc-key-input{
  display:none;padding:3px 8px;
  background:var(--bg);border:1px solid rgba(184,240,74,.4);
  border-radius:4px;color:var(--accent);font-family:var(--mono);
  font-size:10px;width:120px;text-align:center;outline:none;cursor:pointer;
}
.sc-row.editing .sc-key-input{display:block}
.sc-key-input.recording{border-color:rgba(255,79,79,.5);color:var(--danger);animation:blink .7s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.sc-footer{
  padding:8px 13px;border-top:1px solid var(--border2);
  display:flex;gap:6px;justify-content:flex-end;
}
.sc-footer button{font-size:10px;padding:4px 10px}

/* ── Multi-selection ── */
.piece-item.sel-3d{border-left-color:var(--accent);background:rgba(184,240,74,.07)}
.piece-item.sel-3d.vp-hover{border-left-color:var(--accent2);background:rgba(184,240,74,.12)}

/* ── Marquee selection rectangle ── */
#marquee{
  position:absolute;
  border:1px solid rgba(184,240,74,.7);
  background:rgba(184,240,74,.06);
  pointer-events:none;
  display:none;
  z-index:40;
}

/* ── Groups ── */
.group-item{
  display:flex;align-items:center;gap:7px;
  padding:5px 14px 5px 10px;
  cursor:pointer;user-select:none;
  border-left:2px solid var(--border);
  transition:background .1s,border-color .1s;
  background:var(--surface2);
  position:sticky;top:0;z-index:2;
}
.group-item:hover{background:var(--surface3);border-left-color:var(--text-faint)}
.group-item.sel-group{border-left-color:var(--accent);background:rgba(184,240,74,.08)}
.group-arrow{
  font-size:9px;color:var(--text-faint);
  transition:transform .15s;flex-shrink:0;width:10px;text-align:center;
}
.group-arrow.open{transform:rotate(90deg)}
.group-name{
  flex:1;font-size:11px;color:var(--text-dim);font-family:var(--mono);
  letter-spacing:.03em;
}
.group-count{font-size:9px;color:var(--text-faint);letter-spacing:.04em}
.group-children{display:none}
.group-children.open{display:block}
.piece-item.in-group{padding-left:24px;border-left-width:1px}

/* ── Rename input for groups ── */
.group-name-input{
  flex:1;background:var(--bg);
  border:1px solid rgba(184,240,74,.4);border-radius:3px;
  color:var(--text);font-family:var(--mono);font-size:11px;
  padding:1px 5px;outline:none;min-width:0;
}


/* ── Project tabs / recent projects ── */
#project-tabs-row{
  grid-column:1/-1;
  display:flex;align-items:center;gap:7px;
  padding:4px 10px;
  background:var(--bg);
  border-bottom:1px solid var(--border2);
  overflow:hidden;
  z-index:9;
}
#project-tabs{display:flex;align-items:center;gap:5px;overflow-x:auto;overflow-y:hidden;flex:1;height:100%;}
#project-tabs::-webkit-scrollbar{height:3px}
#project-tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.project-tab{
  height:24px;max-width:220px;min-width:86px;
  display:flex;align-items:center;gap:6px;
  padding:0 6px 0 10px;
  border:1px solid var(--border2);
  border-radius:var(--r);
  background:var(--surface);
  color:var(--text-dim);
  font-family:var(--mono);font-size:10px;
  cursor:pointer;user-select:none;white-space:nowrap;
  transition:border-color .12s,background .12s,color .12s;
}
.project-tab:hover{border-color:var(--border);background:var(--surface2);color:var(--text)}
.project-tab.active{border-color:rgba(184,240,74,.45);background:rgba(184,240,74,.08);color:var(--accent)}
.project-tab-title{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.project-tab-close{
  width:15px;height:15px;display:flex;align-items:center;justify-content:center;
  border-radius:3px;color:var(--text-faint);font-size:12px;line-height:1;flex-shrink:0;
}
.project-tab-close:hover{background:rgba(255,79,79,.12);color:var(--danger)}
#btn-new-project{height:24px;padding:3px 9px;font-size:10px;flex-shrink:0;}
#recent-wrap{position:relative;}
#recent-panel{
  position:absolute;top:calc(100% + 7px);left:0;width:360px;max-width:calc(100vw - 24px);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);
  box-shadow:0 12px 40px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.03);
  z-index:350;display:none;overflow:hidden;
}
#recent-panel.open{display:block}
.recent-header{padding:9px 12px;border-bottom:1px solid var(--border2);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);}
.recent-list{max-height:320px;overflow-y:auto;padding:4px 0;}
.recent-list::-webkit-scrollbar{width:4px}.recent-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.recent-empty{padding:18px 12px;color:var(--text-faint);font-size:11px;text-align:center;line-height:1.7;}
.recent-item{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;border-left:2px solid transparent;transition:background .1s,border-color .1s;}
.recent-item:hover{background:var(--surface2);border-left-color:rgba(184,240,74,.35)}
.recent-main{min-width:0;flex:1;}
.recent-name{font-size:11px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.recent-meta{font-size:9px;color:var(--text-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.recent-remove{width:18px;height:18px;border:none;background:transparent;color:var(--text-faint);cursor:pointer;border-radius:3px;font-size:13px;line-height:1;}
.recent-remove:hover{background:rgba(255,79,79,.12);color:var(--danger)}

html.light{--bg:#f0f0f0;--surface:#ffffff;--surface2:#e8e8ec;--surface3:#dddde8;--border:#ccccda;--border2:#d5d5e0;--text:#1a1a2e;--text-dim:#3a3a5a;--text-faint:#8888a0;}
</style>
</head>
<body>
<div id="app">

  <header id="header">
    <div class="logo">INKORA <span>/ 3D</span></div>
    <div class="sep"></div>
    <button class="btn" id="btn-import">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 9h8M6 2v5.5M3.5 5L6 7.5 8.5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Importar DXF
    </button>
    <button class="btn" id="btn-open-project" title="Abrir proyecto INKORA 3D">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 9.5h8V4.2H6.2L5.1 3H2v6.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      Abrir proyecto

<div id="color-popover" style="position:fixed;display:none;z-index:250;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);touch-action:none;">

  <canvas id="color-hue" width="180" height="14" style="display:block;width:180px;height:14px;cursor:crosshair;border-radius:4px;border:1px solid var(--border2);margin-top:8px;"></canvas>
  <div id="color-preview" style="height:16px;border-radius:4px;border:1px solid var(--border2);margin-top:8px;background:#c8c8d0;"></div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════
   UTILS
   ══════════════════════════════════════════════════════ */
const Utils = (() => {
  let _t;
  function toast(msg, type='', ms=3200) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.className = 'show ' + type;
    clearTimeout(_t); _t = setTimeout(() => el.className='', ms);
  }
  function parseDecimal(v, fallback = 0) {
    if (typeof v === 'number') return Number.isFinite(v) ? v : fallback;
    const n = parseFloat(String(v ?? '').trim().replace(',', '.'));
    return Number.isFinite(n) ? n : fallback;
  }
  function clamp(n, min, max) {
    return Math.min(max, Math.max(min, n));
  }
  function hsl2hex(hsl) {
    const d = document.createElement('div');
    d.style.color = hsl; document.body.appendChild(d);
    const c = getComputedStyle(d).color; document.body.removeChild(d);
    const [r,g,b] = c.match(/\d+/g).map(Number);
    return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }
  function palette(n) {
    return Array.from({length:n},(_,i)=>
      hsl2hex(`hsl(${(i*137.508)%360},${55+(i%3)*15}%,${58+(i%2)*10}%)`));
  }
  function isVisibleContour(c) {
    if (!c || c._deleted) return false;
    if (c._isFakeContour && !c.piece) return false;
    if (c.extruded && c.piece) return true;
    if (c.extruded && c.piece === null) return false;
    return true;
  }
  function isPanelContour(c, idx = -1) {
    if (!isVisibleContour(c)) return false;
    if (c._panelHidden) return false;
    if (c.extruded && c.piece && c.piece.contourIdx !== idx) return false;
    return true;
  }
  return { toast, palette, isVisibleContour, isPanelContour, parseDecimal, clamp };
})();


/* ══════════════════════════════════════════════════════
   MÓDULO 1 — PARSER DXF
   Entrada : File   |   Salida : { shape, offX, offY, depth, parentIdx }[]

   Entidades soportadas:
     LINE, LWPOLYLINE (con bulge → arcos), POLYLINE/VERTEX,
     CIRCLE, ARC, ELLIPSE, SPLINE (cúbico B-spline NURBS)
   Bloques:
     BLOCK/ENDBLK parseados; INSERT expandido con transform 2D
     (translate + rotate + scale). INSERT anidado no soportado.

   EXTENSIÓN: soporte SVG, AI, PDF vectorial; INSERT anidado;
   XREF; HATCH como contorno cerrado.
   ══════════════════════════════════════════════════════ */
const DXFParser = (() => {
  /* ── Tokenizer ─────────────────────────────────────────────────────────
     Lee el DXF línea a línea y devuelve un array plano de {code, val}.
     Maneja \r\n, \r y \n. Ignora líneas vacías de separación.
  ─────────────────────────────────────────────────────────────────────── */
  function tokenize(text) {
    const lines = text.replace(/\r\n|\r/g, '\n').split('\n');
    const tokens = [];
    for (let i = 0; i + 1 < lines.length; i += 2) {
      const code = parseInt(lines[i].trim(), 10);
      if (isNaN(code)) { i -= 1; continue; } // resync si hay línea extra
      tokens.push({ code, val: lines[i + 1].trim() });
    }
    return tokens;
  }

  /* ── Entity reader ─────────────────────────────────────────────────────
     Convierte el array de tokens en una lista de entidades agrupadas.
     Cada entidad es { type, r } donde r es un mapa código→valor
     (o código→[valores] cuando el mismo código aparece varias veces).
  ─────────────────────────────────────────────────────────────────────── */
  function readEntities(tokens) {
    const result = [];
    let i = 0;
    while (i < tokens.length) {
      if (tokens[i].code === 0) {
        const type = tokens[i].val; i++;
        if (type === 'ENDSEC' || type === 'EOF') break;
        const r = {};
        while (i < tokens.length && tokens[i].code !== 0) {
          const { code, val } = tokens[i++];
          if (r[code] !== undefined) {
            if (!Array.isArray(r[code])) r[code] = [r[code]];
            r[code].push(val);
          } else { r[code] = val; }
        }
        result.push({ type, r });
      } else { i++; }
    }
    return result;
  }

  /* ── Section reader ────────────────────────────────────────────────────
     Extrae el contenido de una sección DXF por nombre.
     Retorna el array de entidades de esa sección, o [] si no existe.
  ─────────────────────────────────────────────────────────────────────── */
  function readSection(tokens, sectionName) {
    let i = 0;
    while (i < tokens.length) {
      if (tokens[i].code === 0 && tokens[i].val === 'SECTION') {
        i++;
        if (i < tokens.length && tokens[i].code === 2 && tokens[i].val === sectionName) {
          i++;
          return readEntities(tokens.slice(i));
        }
      }
      i++;
    }
    return [];
  }

  function toArr(v) { return v == null ? [] : Array.isArray(v) ? v : [v]; }
  function pf(v)    { return parseFloat(v) || 0; }
  const ACI = {
    1: '#ff0000', 2: '#ffff00', 3: '#00ff00', 4: '#00ffff',
    5: '#0000ff', 6: '#ff00ff', 7: '#ffffff', 8: '#808080', 9: '#c0c0c0',
    10: '#ff0000', 30: '#ff7f00', 50: '#ffff00', 70: '#7fff00',
    90: '#00ff00', 110: '#00ff7f', 130: '#00ffff', 150: '#007fff',
    170: '#0000ff', 190: '#7f00ff', 210: '#ff00ff', 230: '#ff007f',
    250: '#333333', 251: '#505050', 252: '#696969', 253: '#828282',
    254: '#bebebe', 255: '#ffffff',
  };
  function normalizeHex(hex) {
    const s = String(hex || '').replace(/^#/, '').trim();
    return /^[0-9a-f]{6}$/i.test(s) ? `#${s.toLowerCase()}` : null;
  }
  function trueColorToHex(v) {
    const n = parseInt(Array.isArray(v) ? v[0] : v, 10);
    if (!Number.isFinite(n)) return null;
    return '#' + (n & 0xffffff).toString(16).padStart(6, '0');
  }
  function aciToHex(v) {
    const n = Math.abs(parseInt(Array.isArray(v) ? v[0] : v, 10));
    if (!Number.isFinite(n) || n === 0 || n === 256) return null;
    if (ACI[n]) return ACI[n];
    // Fallback para índices ACI intermedios que Corel/AutoCAD usan con
    // frecuencia. No es una tabla ACI perfecta, pero conserva familias de color
    // en vez de caer al color por defecto cuando el índice no está en el mapa.
    if (n >= 10 && n <= 249) {
      const hue = ((n - 10) / 240) * 360;
      const band = n % 10;
      const sat = band <= 1 ? 0.95 : band <= 3 ? 0.8 : band <= 5 ? 0.65 : band <= 7 ? 0.5 : 0.35;
      const lum = band % 2 === 0 ? 0.52 : 0.68;
      const c = document.createElement('div');
      c.style.color = `hsl(${hue},${sat * 100}%,${lum * 100}%)`;
      document.body.appendChild(c);
      const rgb = getComputedStyle(c).color.match(/\d+/g).map(Number);
      document.body.removeChild(c);
      return '#' + rgb.slice(0,3).map(x => x.toString(16).padStart(2,'0')).join('');
    }
    return null;
  }
  function entityMeta(r = {}, layerColors = new Map()) {
    const layer = r[8] || '0';
    const directTrue = trueColorToHex(r[420]);
    const directAci  = aciToHex(r[62]);
    const layerColor = layerColors.get(layer) || null;
    const color = directTrue || directAci || layerColor || '#dedcff';
    const colorSource = directTrue ? 'entity-truecolor' : directAci ? 'entity-aci' : layerColor ? 'layer' : 'default';
    return {
      layer,
      color,
      colorSource,
      hasEntityColor: !!(directTrue || directAci),
      hasExplicitColor: !!(directTrue || directAci || layerColor),
    };
  }
  function setShapeMeta(shape, meta = {}) {
    shape.userData = Object.assign({}, shape.userData, meta);
    return shape;
  }
  function metaKey(meta = {}) {
    return `${meta.layer || '0'}|${normalizeHex(meta.color) || '#dedcff'}`;
  }

  /* ── BLOCK table ───────────────────────────────────────────────────────
     Parsea la sección BLOCKS y retorna un Map nombre→[entidades].
     Usado por INSERT para expandir referencias a bloques.
     EXTENSIÓN: soportar INSERT anidado (bloques que referencian otros bloques).
  ─────────────────────────────────────────────────────────────────────── */
  function parseBlocks(tokens) {
    const map = new Map(); // nombre → [entities] con _baseX/_baseY adjuntos
    let i = 0;
    // Localizar sección BLOCKS
    while (i < tokens.length &&
           !(tokens[i].code === 0 && tokens[i].val === 'SECTION' &&
             tokens[i+1]?.code === 2 && tokens[i+1]?.val === 'BLOCKS')) i++;
    if (i >= tokens.length) return map;
    i += 2;
    let currentName = null, currentEnts = [], currentBaseX = 0, currentBaseY = 0;
    while (i < tokens.length) {
      const { code, val } = tokens[i];
      if (code === 0 && val === 'ENDSEC') break;
      if (code === 0 && val === 'BLOCK') {
        currentName = null;
        currentEnts = [];
        currentBaseX = 0;
        currentBaseY = 0;
        i++;
        // leer encabezado del BLOCK hasta la primera entidad no-cabecera.
        // El punto base (10/20) debe descontarse al expandir INSERT.
        while (i < tokens.length && tokens[i].code !== 0) {
          if (tokens[i].code === 2) currentName = tokens[i].val;
          if (tokens[i].code === 10) currentBaseX = pf(tokens[i].val);
          if (tokens[i].code === 20) currentBaseY = pf(tokens[i].val);
          i++;
        }
        currentEnts._baseX = currentBaseX;
        currentEnts._baseY = currentBaseY;
        continue;
      }
      if (code === 0 && val === 'ENDBLK') {
        if (currentName) {
          currentEnts._baseX = currentBaseX;
          currentEnts._baseY = currentBaseY;
          map.set(currentName, currentEnts);
        }
        currentName = null; currentEnts = []; currentBaseX = 0; currentBaseY = 0; i++;
        while (i < tokens.length && tokens[i].code !== 0) i++;
        continue;
      }
      if (code === 0 && currentName) {
        // entidad dentro del bloque
        const type = val; i++;
        const r = {};
        while (i < tokens.length && tokens[i].code !== 0) {
          const { code: c, val: v } = tokens[i++];
          if (r[c] !== undefined) {
            if (!Array.isArray(r[c])) r[c] = [r[c]];
            r[c].push(v);
          } else { r[c] = v; }
        }
        currentEnts.push({ type, r });
        continue;
      }
      i++;
    }
    return map;
  }

  function parseLayers(tokens) {
    const map = new Map();
    let i = 0;
    while (i < tokens.length) {
      if (tokens[i].code === 0 && tokens[i].val === 'TABLE' &&
          tokens[i + 1]?.code === 2 && tokens[i + 1]?.val === 'LAYER') {
        i += 2;
        while (i < tokens.length) {
          if (tokens[i].code === 0 && tokens[i].val === 'ENDTAB') return map;
          if (tokens[i].code === 0 && tokens[i].val === 'LAYER') {
            let name = null, color = null;
            i++;
            while (i < tokens.length && tokens[i].code !== 0) {
              if (tokens[i].code === 2) name = tokens[i].val;
              if (tokens[i].code === 62) color = aciToHex(tokens[i].val);
              if (tokens[i].code === 420) color = trueColorToHex(tokens[i].val);
              i++;
            }
            if (name && color) map.set(name, color);
            continue;
          }
          i++;
        }
      }
      i++;
    }
    return map;
  }

  /* ── Bulge → arc segments ──────────────────────────────────────────────
     En LWPOLYLINE, el código 42 es el "bulge" del segmento que empieza
     en ese vértice. bulge = tan(θ/4) donde θ es el ángulo incluido del arco.
     bulge > 0 → arco CCW, < 0 → CW, 0 → línea recta.
     EXTENSIÓN: tolerancia angular configurable.
  ─────────────────────────────────────────────────────────────────────── */
  function bulgeToArcSegs(x1, y1, x2, y2, bulge) {
    if (Math.abs(bulge) < 1e-10) return [[x1, y1], [x2, y2]];
    const dx = x2 - x1, dy = y2 - y1;
    const chord = Math.hypot(dx, dy);
    if (chord < 1e-10) return [[x1, y1]];

    // Conversión estándar: bulge = tan(theta/4).
    // theta conserva el signo: positivo = arco CCW, negativo = CW.
    const theta = 4 * Math.atan(bulge);
    const radius = chord / (2 * Math.sin(Math.abs(theta) / 2));
    const midX = (x1 + x2) / 2;
    const midY = (y1 + y2) / 2;
    const ux = dx / chord, uy = dy / chord;
    const nx = -uy, ny = ux;
    const centerOffset = (chord / 2) / Math.tan(Math.abs(theta) / 2);
    const side = bulge > 0 ? 1 : -1;
    const cx = midX + nx * centerOffset * side;
    const cy = midY + ny * centerOffset * side;

    const startAng = Math.atan2(y1 - cy, x1 - cx);
    const steps = Math.max(6, Math.ceil(Math.abs(theta) / (Math.PI / 36))); // ≥6, ~5° por paso
    const pts = [];
    for (let k = 0; k <= steps; k++) {
      const t = k / steps;
      const th = startAng + theta * t;
      pts.push([cx + Math.cos(th) * radius, cy + Math.sin(th) * radius]);
    }
    return pts;
  }

  /* ── Cubic B-spline evaluation ─────────────────────────────────────────
     Evalúa un B-spline NURBS cúbico (grado 3) usando el algoritmo de
     De Boor, que es el método estándar y numéricamente estable.
     Entrada: control points [{x,y}], knot vector, t ∈ [0,1] → punto {x,y}

     Si no se provee knot vector (algunos DXFs lo omiten), se genera uno
     uniforme estándar de extremo cerrado.

     EXTENSIÓN: soporte para curvas racionales (NURBS con pesos),
     grados arbitrarios, curvas 3D.
  ─────────────────────────────────────────────────────────────────────── */
  function evalBSpline(cps, knots, weights, degree, t) {
    const n = cps.length - 1;
    const deg = Math.max(1, Math.min(degree || 3, n));
    // Escalar t al rango real del knot vector
    const tMin = knots[deg], tMax = knots[n + 1];
    const u = t >= 1 ? tMax : tMin + t * (tMax - tMin);

    // Encontrar knot span (índice k tal que knots[k] ≤ u < knots[k+1])
    let k = deg;
    for (let j = deg; j <= n; j++) {
      if ((u >= knots[j] && u < knots[j + 1]) || (t >= 1 && j === n)) { k = j; break; }
    }

    // De Boor racional: usa coordenadas homogéneas si hay pesos.
    const d = [];
    for (let j = 0; j <= deg; j++) {
      const idx = k - deg + j;
      const w = Number.isFinite(weights[idx]) ? weights[idx] : 1;
      d.push({ x: (cps[idx]?.x || 0) * w, y: (cps[idx]?.y || 0) * w, w });
    }
    for (let r = 1; r <= deg; r++) {
      for (let j = deg; j >= r; j--) {
        const left = knots[k - deg + j], right = knots[k + j - r + 1];
        const alpha = (right === left) ? 0 : (u - left) / (right - left);
        d[j] = {
          x: (1 - alpha) * d[j - 1].x + alpha * d[j].x,
          y: (1 - alpha) * d[j - 1].y + alpha * d[j].y,
          w: (1 - alpha) * d[j - 1].w + alpha * d[j].w,
        };
      }
    }
    const w = Math.abs(d[deg].w) > 1e-12 ? d[deg].w : 1;
    return { x: d[deg].x / w, y: d[deg].y / w };
  }

  function splineToSegs(r) {
    const xs = toArr(r[10]).map(pf), ys = toArr(r[20]).map(pf);
    if (xs.length < 2) return [];
    const cps = xs.map((x, i) => ({ x, y: ys[i] || 0 }));
    const n = cps.length - 1;
    const deg = Math.max(1, Math.min(parseInt(r[71] || '3', 10) || 3, n));
    const weights = toArr(r[41]).map(pf);
    while (weights.length < cps.length) weights.push(1);

    // Knot vector: código 40 (puede ser array o ausente)
    let rawKnots = toArr(r[40]).map(pf);
    if (rawKnots.length < n + deg + 2) {
      // Generar knot vector uniforme de extremo cerrado (clamped)
      rawKnots = [];
      const m = n + deg + 1;
      for (let i = 0; i <= m; i++) {
        if (i <= deg)          rawKnots.push(0);
        else if (i >= m - deg) rawKnots.push(1);
        else                   rawKnots.push((i - deg) / (m - 2 * deg));
      }
    }

    const isClosed = (parseInt(r[70] || '0', 10) & 1) === 1;
    const steps = Math.max(32, cps.length * Math.max(8, deg * 3));
    const pts = [];
    for (let k = 0; k <= steps; k++) {
      const t = isClosed ? (k % steps) / steps : k / steps;
      pts.push(evalBSpline(cps, rawKnots, weights, deg, Math.min(t, 1)));
    }
    return pts; // [{x,y}] — se convierte a segs en buildShapes
  }

  /* ── ELLIPSE → arc segments ────────────────────────────────────────────
     El código DXF para ELLIPSE:
       10,20 = centro; 11,21 = endpoint del eje mayor relativo al centro;
       40    = ratio eje menor / eje mayor; 41,42 = ángulo inicio/fin (rad)
     EXTENSIÓN: ellipses 3D (eje Z, normal vector).
  ─────────────────────────────────────────────────────────────────────── */
  function ellipseToSegs(r) {
    const cx = pf(r[10]), cy = pf(r[20]);
    const ex = pf(r[11]), ey = pf(r[21]);
    const ratio   = pf(r[40]) || 1;
    const startA  = pf(r[41]);           // rad
    let   endA    = pf(r[42]) || Math.PI * 2;
    const majorR  = Math.hypot(ex, ey);
    const minorR  = majorR * ratio;
    const tilt    = Math.atan2(ey, ex);  // rotación del eje mayor

    if (endA <= startA) endA += Math.PI * 2;
    const span  = endA - startA;
    const steps = Math.max(32, Math.ceil(span / (Math.PI / 36)));
    const pts   = [];
    for (let k = 0; k <= steps; k++) {
      const ang = startA + (span * k / steps);
      const lx  = Math.cos(ang) * majorR;
      const ly  = Math.sin(ang) * minorR;
      pts.push([
        cx + lx * Math.cos(tilt) - ly * Math.sin(tilt),
        cy + lx * Math.sin(tilt) + ly * Math.cos(tilt),
      ]);
    }
    return pts;
  }

  /* ── buildShapes ───────────────────────────────────────────────────────
     Convierte una lista de entidades DXF en THREE.Shape[].
     Estrategia de dos pasadas:
       1. Entidades que son contornos cerrados por sí solas (CIRCLE, ELLIPSE
          completa, LWPOLYLINE cerrada) → shapes directas.
       2. Segmentos (LINE, ARC parcial, SPLINE, LWPOLYLINE abierta) →
          se encadenan por proximidad para formar contornos cerrados.

     blockMap opcional: usado cuando se procesan entidades expandidas de INSERT.
     EXTENSIÓN: HATCH como contorno, TEXT outline, soporte 3D.
  ─────────────────────────────────────────────────────────────────────── */
  function buildShapes(entities, blockMap, layerColors = new Map()) {
    const segs = [], shapes = [];
    let _activePoly = null; // referencia al POLYLINE activo para VERTEX/SEQEND

    for (const e of entities) {
      const r = e.r;
      const meta = entityMeta(r, layerColors);

      // ── LINE ──────────────────────────────────────────────────────────
      if (e.type === 'LINE') {
        segs.push({ p1: [pf(r[10]), pf(r[20])], p2: [pf(r[11]), pf(r[21])], meta });
      }

      // ── LWPOLYLINE (con bulge) ─────────────────────────────────────────
      else if (e.type === 'LWPOLYLINE') {
        const xs = toArr(r[10]).map(pf), ys = toArr(r[20]).map(pf);
        if (xs.length < 2) continue;
        const bulges = toArr(r[42]).map(pf);
        const closed = (parseInt(r[70] || '0', 10) & 1) === 1;
        const rawPts = xs.map((x, k) => [x, ys[k] || 0]);

        // Expandir cada segmento aplicando bulge si existe
        const expanded = []; // [[x,y], ...]
        const count = closed ? rawPts.length : rawPts.length - 1;
        for (let k = 0; k < count; k++) {
          const p1 = rawPts[k], p2 = rawPts[(k + 1) % rawPts.length];
          const b  = bulges[k] || 0;
          const arc = bulgeToArcSegs(p1[0], p1[1], p2[0], p2[1], b);
          // Evitar duplicar el punto de unión entre segmentos
          if (expanded.length === 0) expanded.push(arc[0]);
          for (let j = 1; j < arc.length; j++) expanded.push(arc[j]);
        }

        if (closed && expanded.length >= 3) {
          const sh = new THREE.Shape();
          sh.moveTo(expanded[0][0], expanded[0][1]);
          for (let k = 1; k < expanded.length; k++) sh.lineTo(expanded[k][0], expanded[k][1]);
          sh.closePath();
          shapes.push(setShapeMeta(sh, meta));
        } else {
          for (let k = 0; k < expanded.length - 1; k++)
            segs.push({ p1: expanded[k], p2: expanded[k + 1], meta });
        }
      }

      // ── POLYLINE / VERTEX (formato antiguo R12) ───────────────────────
      // En DXF R12, POLYLINE es seguido de múltiples VERTEX y SEQEND.
      // Acumulamos los VERTEX hasta SEQEND y luego los procesamos igual
      // que LWPOLYLINE. El flag de cierre viene en el código 70 del POLYLINE.
      else if (e.type === 'POLYLINE') {
        e._polylineClosed = (parseInt(r[70] || '0', 10) & 1) === 1;
        e._polylineVerts  = [];
        e._polylineBulges = [];
        e._polylineMeta   = meta;
        _activePoly = e; // referencia directa para VERTEX/SEQEND
      }
      else if (e.type === 'VERTEX') {
        // El POLYLINE activo se rastrea directamente — sin búsqueda O(n)
        if (_activePoly) {
          _activePoly._polylineVerts.push([pf(r[10]), pf(r[20])]);
          _activePoly._polylineBulges.push(pf(r[42] || 0));
        }
      }
      else if (e.type === 'SEQEND') {
        // Cerrar el POLYLINE activo
        const parentPoly = _activePoly;
        _activePoly = null;
        if (parentPoly && parentPoly._polylineVerts.length >= 2) {
          const pts    = parentPoly._polylineVerts;
          const bulges = parentPoly._polylineBulges || [];
          const closed = parentPoly._polylineClosed;
          const polyMeta = parentPoly._polylineMeta || meta;
          const expanded = [];
          const count = closed ? pts.length : pts.length - 1;
          for (let k = 0; k < count; k++) {
            const p1 = pts[k], p2 = pts[(k + 1) % pts.length];
            const arc = bulgeToArcSegs(p1[0], p1[1], p2[0], p2[1], bulges[k] || 0);
            if (expanded.length === 0) expanded.push(arc[0]);
            for (let j = 1; j < arc.length; j++) expanded.push(arc[j]);
          }
          if (closed && expanded.length >= 3) {
            const sh = new THREE.Shape();
            sh.moveTo(expanded[0][0], expanded[0][1]);
            for (let k = 1; k < expanded.length; k++) sh.lineTo(expanded[k][0], expanded[k][1]);
            sh.closePath();
            shapes.push(setShapeMeta(sh, polyMeta));
          } else {
            for (let k = 0; k < expanded.length - 1; k++)
              segs.push({ p1: expanded[k], p2: expanded[k + 1], meta: polyMeta });
          }
          // parentPoly consumed — _activePoly already set to null above
        }
      }

      // ── CIRCLE ────────────────────────────────────────────────────────
      else if (e.type === 'CIRCLE') {
        const s = new THREE.Shape();
        s.absarc(pf(r[10]), pf(r[20]), pf(r[40]), 0, Math.PI * 2, false);
        shapes.push(setShapeMeta(s, meta));
      }

      // ── ARC ───────────────────────────────────────────────────────────
      else if (e.type === 'ARC') {
        const startDeg = pf(r[50]), endDeg = pf(r[51]);
        const span = ((endDeg - startDeg) + 360) % 360;
        if (span >= 359.9) {
          // Arco casi completo → círculo
          const s = new THREE.Shape();
          s.absarc(pf(r[10]), pf(r[20]), pf(r[40]), 0, Math.PI * 2, false);
          shapes.push(setShapeMeta(s, meta));
        } else {
          const cx = pf(r[10]), cy = pf(r[20]), rad = pf(r[40]);
          const a0 = startDeg * Math.PI / 180;
          const a1 = (startDeg + span) * Math.PI / 180;
          const steps = Math.max(8, Math.ceil(span / 5));
          const pts = [];
          for (let k = 0; k <= steps; k++) {
            const a = a0 + (a1 - a0) * (k / steps);
            pts.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]);
          }
          for (let k = 0; k < pts.length - 1; k++)
            segs.push({ p1: pts[k], p2: pts[k + 1], meta });
        }
      }

      // ── ELLIPSE ───────────────────────────────────────────────────────
      else if (e.type === 'ELLIPSE') {
        const pts = ellipseToSegs(r);
        const startA = pf(r[41]), endA = pf(r[42]) || Math.PI * 2;
        const isFull = (endA - startA) >= Math.PI * 2 - 0.01;
        if (isFull && pts.length >= 3) {
          const sh = new THREE.Shape();
          sh.moveTo(pts[0][0], pts[0][1]);
          for (let k = 1; k < pts.length; k++) sh.lineTo(pts[k][0], pts[k][1]);
          sh.closePath();
          shapes.push(setShapeMeta(sh, meta));
        } else {
          for (let k = 0; k < pts.length - 1; k++)
            segs.push({ p1: pts[k], p2: pts[k + 1], meta });
        }
      }

      // ── SPLINE (B-spline cúbico real) ─────────────────────────────────
      else if (e.type === 'SPLINE') {
        const isClosed = (parseInt(r[70] || '0', 10) & 1) === 1;
        const pts = splineToSegs(r); // [{x,y}]
        if (pts.length < 2) continue;
        if (isClosed && pts.length >= 3) {
          const sh = new THREE.Shape();
          sh.moveTo(pts[0].x, pts[0].y);
          for (let k = 1; k < pts.length; k++) sh.lineTo(pts[k].x, pts[k].y);
          sh.closePath();
          shapes.push(setShapeMeta(sh, meta));
        } else {
          for (let k = 0; k < pts.length - 1; k++)
            segs.push({ p1: [pts[k].x, pts[k].y], p2: [pts[k + 1].x, pts[k + 1].y], meta });
        }
      }

      // ── INSERT (referencia a bloque) ───────────────────────────────────
      // Expande el bloque aplicando translate (10,20), rotate (50°) y scale (41,42).
      // Limitación: INSERT anidado no soportado en esta versión.
      // EXTENSIÓN: INSERT anidado, transformaciones 3D, atributos (ATTRIB).
      else if (e.type === 'INSERT' && blockMap) {
        const blockName = r[2];
        const blockEnts = blockMap.get(blockName);
        if (!blockEnts || !blockEnts.length) continue;

        const tx   = pf(r[10]), ty = pf(r[20]);
        const rot  = (pf(r[50]) * Math.PI) / 180; // grados → rad
        const sx   = pf(r[41]) || 1, sy = pf(r[42]) || 1;
        const baseX = pf(blockEnts._baseX || 0), baseY = pf(blockEnts._baseY || 0);
        const cosR = Math.cos(rot), sinR = Math.sin(rot);

        // Transformar cada entidad del bloque al espacio del INSERT.
        // Se transforman:
        //   - Coordenadas X/Y de origen/destino (grupos 10/20, 11/21, 12/22)
        //   - Radio (grupo 40) → escalar por sx (asumiendo escala uniforme)
        //   - Eje mayor de ELLIPSE (grupo 11/21) → ya cubierto arriba
        //   - Ángulo de rotación ARC (grupos 50/51) → sumar rot (en grados)
        // EXTENSIÓN: escala no-uniforme en ELLIPSE, transformaciones 3D.
        const transformed = blockEnts.map(be => {
          const tr = Object.assign({}, be.r);

          // Escala no uniforme en INSERT: un círculo/arco deja de ser circular.
          // Lo discretizamos a una LWPOLYLINE transformada para conservar la forma real.
          if ((be.type === 'CIRCLE' || be.type === 'ARC') && Math.abs(Math.abs(sx) - Math.abs(sy)) > 1e-9) {
            const cx0 = pf(be.r[10]) - baseX;
            const cy0 = pf(be.r[20]) - baseY;
            const rad = pf(be.r[40]);
            let a0 = 0, a1 = Math.PI * 2, closed = true;
            if (be.type === 'ARC') {
              const startDeg = pf(be.r[50]);
              const endDeg = pf(be.r[51]);
              const span = ((endDeg - startDeg) + 360) % 360;
              a0 = startDeg * Math.PI / 180;
              a1 = (startDeg + span) * Math.PI / 180;
              closed = span >= 359.9;
            }
            const span = Math.abs(a1 - a0);
            const steps = Math.max(24, Math.ceil(span / (Math.PI / 72)));
            const outX = [], outY = [];
            for (let k = 0; k <= steps; k++) {
              const a = a0 + (a1 - a0) * (k / steps);
              const lx = (cx0 + Math.cos(a) * rad) * sx;
              const ly = (cy0 + Math.sin(a) * rad) * sy;
              outX.push(String(lx * cosR - ly * sinR + tx));
              outY.push(String(lx * sinR + ly * cosR + ty));
            }
            tr[10] = outX;
            tr[20] = outY;
            tr[70] = closed ? '1' : '0';
            return { type: 'LWPOLYLINE', r: tr };
          }

          function transformPair(gc, gc2, translate = true) {
            if (tr[gc] === undefined) return;
            const xs = toArr(tr[gc]);
            const ys = toArr(tr[gc2]);
            const len = Math.max(xs.length, ys.length);
            const outX = [], outY = [];
            for (let i = 0; i < len; i++) {
              const localX = pf(xs[i]) - (translate ? baseX : 0);
              const localY = pf(ys[i]) - (translate ? baseY : 0);
              const lx = localX * sx;
              const ly = localY * sy;
              outX.push(String(lx * cosR - ly * sinR + (translate ? tx : 0)));
              outY.push(String(lx * sinR + ly * cosR + (translate ? ty : 0)));
            }
            const isArray = Array.isArray(tr[gc]) || Array.isArray(tr[gc2]);
            tr[gc]  = isArray ? outX : outX[0];
            tr[gc2] = isArray ? outY : outY[0];
          }

          transformPair(10, 20, true);
          transformPair(11, 21, be.type !== 'ELLIPSE');
          transformPair(12, 22, true);

          // Escalar radio (CIRCLE, ARC) — grupo 40
          // Si sx ≠ sy (escala no-uniforme) un círculo se volvería elipse,
          // lo cual no soportamos; usamos sx como aproximación.
          if (tr[40] !== undefined &&
              (be.type === 'CIRCLE' || be.type === 'ARC')) {
            tr[40] = String(pf(tr[40]) * Math.abs(sx));
          }

          // Rotar ángulos de inicio/fin de ARC (grupos 50/51, en grados)
          if (be.type === 'ARC') {
            const rotDeg = pf(r[50]); // rotación del INSERT en grados
            if (tr[50] !== undefined) tr[50] = String(pf(tr[50]) + rotDeg);
            if (tr[51] !== undefined) tr[51] = String(pf(tr[51]) + rotDeg);
          }

          return { type: be.type, r: tr };
        });

        // Extraer shapes/segs de las entidades transformadas (sin blockMap para evitar recursión)
        const subShapes = buildShapes(transformed, null, layerColors);
        shapes.push(...subShapes);
        // Los segs de sub-entidades ya fueron consumidos dentro de buildShapes()
      }
    } // fin for entities

    /* ── Encadenamiento de segmentos con hashmap espacial ─────────────────
       El algoritmo anterior era O(n²): por cada extremo de cadena, iteraba
       todos los segmentos buscando el siguiente vecino.
       Con DXFs grandes (grabados, logos con cientos de LINEs) eso es lento.

       Nuevo algoritmo O(n):
         1. Calcular tolerancia adaptativa (igual que antes).
         2. Construir un hashmap: cada extremo de segmento se discretiza a
            una celda de tamaño TOL. Cada celda guarda los índices de segs
            que tienen un extremo ahí.
         3. Al extender una cadena, en vez de iterar todos los segs,
            sólo consultamos la celda del extremo actual y sus 8 vecinos
            (para manejar puntos en el borde de celda).

       EXTENSIÓN: tolerancia configurable por el usuario.
    ─────────────────────────────────────────────────────────────────────── */
    const validSegs = segs.filter(s => s.p2 !== null && !s._vertex);

    if (validSegs.length === 0) return shapes;

    // Calcular tolerancia adaptativa
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    validSegs.forEach(s => {
      [s.p1, s.p2].forEach(([x, y]) => {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      });
    });
    const diag = Math.hypot(maxX - minX, maxY - minY) || 1;
    const TOL  = Math.max(0.001, diag * 0.0005);
    const CELL = TOL;    // celda del hashmap = 1 tolerancia

    function cellKey(x, y) {
      return `${Math.round(x / CELL)},${Math.round(y / CELL)}`;
    }

    // Construir hashmap: cellKey → [{segIdx, isP2}]
    // isP2=false → p1 de ese seg; isP2=true → p2
    const endMap = new Map();
    function addEnd(pt, segIdx, isP2) {
      const k = cellKey(pt[0], pt[1]);
      if (!endMap.has(k)) endMap.set(k, []);
      endMap.get(k).push({ segIdx, isP2 });
    }
    validSegs.forEach((s, i) => { addEnd(s.p1, i, false); addEnd(s.p2, i, true); });

    function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }

    // Buscar el segmento no-usado más cercano a `pt` usando el hashmap
    function findNext(pt, used, chainMeta) {
      const cx = Math.round(pt[0] / CELL), cy = Math.round(pt[1] / CELL);
      let best = null, bestDist = TOL;
      for (let dx = -2; dx <= 2; dx++) {
        for (let dy = -2; dy <= 2; dy++) {
          const k = `${cx + dx},${cy + dy}`;
          const bucket = endMap.get(k);
          if (!bucket) continue;
          for (const { segIdx, isP2 } of bucket) {
            if (used[segIdx]) continue;
            if (metaKey(validSegs[segIdx].meta) !== metaKey(chainMeta)) continue;
            const ep   = isP2 ? validSegs[segIdx].p2 : validSegs[segIdx].p1;
            const d    = dist(pt, ep);
            if (d < bestDist) { bestDist = d; best = { segIdx, isP2 }; }
          }
        }
      }
      return best;
    }

    const used = new Uint8Array(validSegs.length);
    for (let s = 0; s < validSegs.length; s++) {
      if (used[s]) continue;
      used[s] = 1;
      const chainMeta = validSegs[s].meta || {};
      const chain = [validSegs[s].p1, validSegs[s].p2];

      let found = true;
      while (found) {
        found = false;
        const tail = chain[chain.length - 1];
        const next = findNext(tail, used, chainMeta);
        if (next) {
          used[next.segIdx] = 1;
          // Si encontró p2, el segmento va en dirección normal → agregar p1 no
          // (ya está en la cadena por la condición de vecindad). El punto nuevo
          // es el OTRO extremo del segmento encontrado.
          const seg = validSegs[next.segIdx];
          chain.push(next.isP2 ? seg.p1 : seg.p2);
          found = true;
        }
      }

      if (chain.length >= 3 && dist(chain[0], chain[chain.length - 1]) < TOL * 4) {
        chain.pop();
        const sh = new THREE.Shape();
        sh.moveTo(chain[0][0], chain[0][1]);
        for (let k = 1; k < chain.length; k++) sh.lineTo(chain[k][0], chain[k][1]);
        sh.closePath();
        shapes.push(setShapeMeta(sh, chainMeta));
      }
    }
    return shapes;
  }


  function shapeBounds(shape) {
    const pts=shape.getPoints(64);
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    pts.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});
    return {minX,maxX,minY,maxY};
  }

  function normalizedPointKey(points) {
    if (!points.length) return '';
    const q = points.map(p => `${Math.round(p.x * 1000)},${Math.round(p.y * 1000)}`);
    if (q.length > 1 && q[0] === q[q.length - 1]) q.pop();
    let best = null;
    const variants = [q, [...q].reverse()];
    variants.forEach(arr => {
      for (let i = 0; i < arr.length; i++) {
        const rotated = arr.slice(i).concat(arr.slice(0, i)).join('|');
        if (best === null || rotated < best) best = rotated;
      }
    });
    return best || '';
  }

  function dedupeShapes(shapes) {
    const seen = new Map();
    const out = [];
    shapes.forEach(sh => {
      const key = `${metaKey(sh.userData || {})}|${normalizedPointKey(sh.getPoints(96))}`;
      if (!key) return;
      if (!seen.has(key)) {
        seen.set(key, sh);
        out.push(sh);
        return;
      }
      const kept = seen.get(key);
      if ((!kept.userData?.color || kept.userData.color === '#dedcff') && sh.userData?.color) {
        kept.userData.color = sh.userData.color;
        kept.userData.layer = sh.userData.layer || kept.userData.layer;
      }
    });
    return out;
  }

  /* ── computeHierarchy ────────────────────────────────────────────────────
     Analiza la relación padre/hijo entre todos los shapes usando ray-casting.
     NO modifica los shapes ni elimina ninguno — todos siguen siendo
     seleccionables individualmente en la UI.

     Retorna un array paralelo a `shapes` donde cada entrada tiene:
       { parentIdx, depth, area, pts, centroid }

     Esto se usa en GeoModule.extrudeWithHoles() para saber qué contornos
     son interiores de otros al momento de extruir.

     EXTENSIÓN: tolerancia configurable, winding order, huecos anidados.
  ──────────────────────────────────────────────────────────────────────── */
  function pointInPolygon(px, py, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i].x, yi = pts[i].y;
      const xj = pts[j].x, yj = pts[j].y;
      if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
        inside = !inside;
      }
    }
    return inside;
  }

  function representativePointForShape(shape, fallbackPts) {
    // Para formas cóncavas, el promedio de vértices puede caer fuera del polígono.
    // Usamos el centroide del triángulo más grande de ShapeGeometry como punto seguro.
    try {
      const geo = new THREE.ShapeGeometry(shape);
      const pos = geo.attributes.position;
      const idx = geo.index;
      let bestArea = -1, best = null;
      const triCount = idx ? idx.count / 3 : pos.count / 3;
      for (let t = 0; t < triCount; t++) {
        const ia = idx ? idx.getX(t * 3)     : t * 3;
        const ib = idx ? idx.getX(t * 3 + 1) : t * 3 + 1;
        const ic = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;
        const ax = pos.getX(ia), ay = pos.getY(ia);
        const bx = pos.getX(ib), by = pos.getY(ib);
        const cx = pos.getX(ic), cy = pos.getY(ic);
        const area = Math.abs((bx - ax) * (cy - ay) - (by - ay) * (cx - ax));
        if (area > bestArea) {
          bestArea = area;
          best = { x: (ax + bx + cx) / 3, y: (ay + by + cy) / 3 };
        }
      }
      geo.dispose();
      if (best) return best;
    } catch (_) {}
    let cx = 0, cy = 0;
    fallbackPts.forEach(p => { cx += p.x; cy += p.y; });
    return { x: cx / fallbackPts.length, y: cy / fallbackPts.length };
  }

  function computeHierarchy(shapes) {
    // Pre-calcular pts, área y punto representativo una sola vez por shape para eficiencia.
    const items = shapes.map(sh => {
      const pts = sh.getPoints(128); // resolución alta: mejor precisión en pointInPolygon
      let area = 0;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        area += (pts[j].x + pts[i].x) * (pts[j].y - pts[i].y);
      }
      area = Math.abs(area) / 2;
      return {
        area,
        pts,
        probe: representativePointForShape(sh, pts),
        parentIdx: -1,
      };
    });

    // Para cada shape, encontrar el contenedor más pequeño (padre directo).
    // Ordenar por área descendente para que los candidatos a padre siempre
    // tengan mayor área que el hijo (evita la condición items[j].area <= items[i].area).
    const order = items.map((_, i) => i).sort((a, b) => items[b].area - items[a].area);

    for (let ii = 0; ii < order.length; ii++) {
      const i = order[ii];
      const { probe } = items[i];
      let bestParent = -1, bestArea = Infinity;

      // Solo iterar shapes con área mayor (los primeros en order)
      for (let jj = 0; jj < ii; jj++) {
        const j = order[jj];
        if (items[j].area <= items[i].area) continue; // ya no debería ocurrir con el sort
        if (pointInPolygon(probe.x, probe.y, items[j].pts)) {
          if (items[j].area < bestArea) { bestArea = items[j].area; bestParent = j; }
        }
      }
      items[i].parentIdx = bestParent;
    }

    // Calcular profundidad: par = exterior, impar = hueco
    // Usar memoización para evitar recalcular la cadena de padres
    const depthCache = new Array(items.length).fill(-1);
    function depth(idx) {
      if (depthCache[idx] !== -1) return depthCache[idx];
      let d = 0, cur = items[idx].parentIdx;
      // Protección contra ciclos (no debería ocurrir, pero DXFs malformados existen)
      const seen = new Set([idx]);
      while (cur !== -1 && !seen.has(cur)) { d++; seen.add(cur); cur = items[cur].parentIdx; }
      depthCache[idx] = d;
      return d;
    }
    items.forEach((it, i) => { it.depth = depth(i); });

    return items;
  }

  async function loadFile(file) {
    /* Leer el archivo con encoding latin1 (cubre Windows-1252, usado por
       AutoCAD antiguo). FileReader.readAsText con 'latin1' mapea cada byte
       a su codepoint Unicode equivalente, preservando caracteres especiales
       en nombres de capa y bloque.
       EXTENSIÓN: detectar BOM UTF-8 y conmutar encoding automáticamente.     */
    const text = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload  = e => res(e.target.result);
      r.onerror = () => rej(new Error('No se pudo leer el archivo'));
      r.readAsText(file, 'latin1');
    });

    // Ceder al browser para que el toast "Leyendo DXF…" alcance a pintar
    // antes de que las operaciones síncronas bloqueen el hilo principal.
    await new Promise(ok => setTimeout(ok, 0));

    const tokens   = tokenize(text);
    const layerColors = parseLayers(tokens);
    const blockMap = parseBlocks(tokens);
    const entities = readSection(tokens, 'ENTITIES');
    const shapes   = dedupeShapes(buildShapes(entities, blockMap, layerColors));

    if (!shapes.length) return [];

    // Segunda cesión: computeHierarchy con muchos shapes puede tomar >16ms
    await new Promise(ok => setTimeout(ok, 0));

    const hierarchy = computeHierarchy(shapes);
    let gMinX = Infinity, gMaxX = -Infinity, gMinY = Infinity, gMaxY = -Infinity;
    shapes.forEach(sh => {
      const b = shapeBounds(sh);
      gMinX = Math.min(gMinX, b.minX); gMaxX = Math.max(gMaxX, b.maxX);
      gMinY = Math.min(gMinY, b.minY); gMaxY = Math.max(gMaxY, b.maxY);
    });
    const offX = (gMinX + gMaxX) / 2, offY = (gMinY + gMaxY) / 2;
    return shapes.map((sh, i) => ({
      shape: sh,
      offX, offY,
      depth:     hierarchy[i].depth,      // 0=exterior, 1=hueco, 2=isla…
      parentIdx: hierarchy[i].parentIdx,  // índice del shape contenedor
      layer:     sh.userData?.layer || '0',
      color:     normalizeHex(sh.userData?.color) || '#dedcff',
      colorSource: sh.userData?.colorSource || 'default',
      hasEntityColor: !!sh.userData?.hasEntityColor,
      hasExplicitColor: !!sh.userData?.hasExplicitColor,
    }));
  }
  return {loadFile};
})();

/* ── Winding order helpers (scope global) ──────────────────────────────────────────
   Three.js ExtrudeGeometry: shape exterior CCW, holes CW.
   Se usan las curves ORIGINALES para evitar puntos colineales extra
   que degradan el triangulador en letras de lados rectos.
───────────────────────────────────────────────────────────────────────────── */
function _signedAreaPts(pts) {
  let a = 0;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    a += (pts[j].x + pts[i].x) * (pts[j].y - pts[i].y);
  }
  return a / 2;
}
function isShapeCCW(srcShape) {
  return _signedAreaPts(srcShape.getPoints(32)) > 0;
}
function copyCurves(src, dst, reverse) {
  const curves = src.curves;
  if (!curves || curves.length === 0) {
    const pts = src.getPoints(64);
    if (reverse) pts.reverse();
    dst.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) dst.lineTo(pts[i].x, pts[i].y);
    dst.autoClose = true;
    return;
  }
  if (!reverse) {
    const startPt = curves[0].getPoint(0);
    dst.moveTo(startPt.x, startPt.y);
    curves.forEach(curve => dst.curves.push(curve));
  } else {
    const reversed = [...curves].reverse();
    const startPt = reversed[0].getPoint(1);
    dst.moveTo(startPt.x, startPt.y);
    reversed.forEach(curve => {
      const steps = curve.isLineCurve ? 1 : 16;
      for (let k = 1; k <= steps; k++) {
        const pt = curve.getPoint(1 - k / steps);
        dst.lineTo(pt.x, pt.y);
      }
    });
  }
  dst.autoClose = true;
}
function makeShapeCCW(srcShape) {
  const s = new THREE.Shape();
  copyCurves(srcShape, s, !isShapeCCW(srcShape));
  return s;
}
function makeHoleCW(srcShape) {
  const p = new THREE.Path();
  copyCurves(srcShape, p, isShapeCCW(srcShape));
  return p;
}


/* ══════════════════════════════════════════════════════
   MÓDULO 2 — VIEWPORT 3D
   Escena, cámara, luces, orbit controls, raycasting.

   CAMBIOS EN ESTA VERSIÓN:
   - FIX CURSOR: canvas sin cursor CSS; JS lo gestiona completamente
     (default → pointer al hover seleccionable, grabbing al orbitar).
   - FIX HOVER: mousemove dispara highlight visual y resalta fila en panel.
   - FIX RAYCASTING SUPERPUESTO: pickBest() ordena hits 2D por área de
     bounding box — la forma más pequeña gana, no la más cercana.
     Esto permite seleccionar letras que están encima del fondo del llavero.

   EXTENSIÓN: modos de visualización, gizmos, multi-viewport.
   ══════════════════════════════════════════════════════ */
const Viewport = (() => {
  let scene, camera, renderer, orb, raycaster, mouse;
  let _onClickMesh=null, _onHoverMesh=null;
  let group2D, group3D;
  let _hoveredMesh=null; // mesh actualmente bajo el cursor

  function init() {
    const canvas=document.getElementById('viewport');

    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x080809);
    scene.fog=new THREE.FogExp2(0x080809,0.0015);

    group2D=new THREE.Group(); group3D=new THREE.Group();
    scene.add(group2D,group3D);
    scene.add(new THREE.GridHelper(300,60,0x18181f,0x13131a));

    camera=new THREE.PerspectiveCamera(45,1,1,5000);
    camera.position.set(0,80,140);

    renderer=new THREE.WebGLRenderer({canvas, antialias:true, logarithmicDepthBuffer:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.shadowMap.enabled=true;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.outputEncoding=THREE.sRGBEncoding;
    // Color real: ACES comprime/suaviza los colores y los vuelve pastel.
    // NoToneMapping mantiene la saturación visual mucho más cercana al HEX elegido.
    renderer.toneMapping=THREE.NoToneMapping;
    renderer.toneMappingExposure=1.0;
    resize();

    scene.add(new THREE.AmbientLight(0xffffff,0.45));
    const sun=new THREE.DirectionalLight(0xfff8f0,1.2);
    sun.position.set(60,100,60); sun.castShadow=true;
    sun.shadow.mapSize.set(2048,2048); scene.add(sun);
    const fill=new THREE.DirectionalLight(0xb0c8ff,0.45);
    fill.position.set(-60,20,-40); scene.add(fill);
    const rim=new THREE.PointLight(0xb8f04a,0.25,400);
    rim.position.set(0,100,-80); scene.add(rim);

    orb=buildOrbit(camera,canvas);
    raycaster=new THREE.Raycaster();
    // Selector más fino: antes era 1.25 mm y hacía que las líneas
    // invisibles de picking alcanzaran contornos vecinos al hacer zoom.
    raycaster.params.Line.threshold = 0.16;
    mouse=new THREE.Vector2();

    // Cursor inicial: flecha
    canvas.style.cursor='default';

    // ── mousemove: hover highlight + cursor ──
    canvas.addEventListener('mousemove', e => {
      // No procesar hover mientras se orbita/panea
      if (orb.rotating||orb.panning) return;

      const rect=canvas.getBoundingClientRect();
      mouse.set(
        ((e.clientX-rect.left)/rect.width)*2-1,
       -((e.clientY-rect.top)/rect.height)*2+1
      );
      raycaster.setFromCamera(mouse,camera);
      const hit=pickBest(raycaster);

      // Solo actualizar si cambió el mesh bajo el cursor
      const newMesh=hit?.mesh||null;
      if (newMesh!==_hoveredMesh) {
        if (_hoveredMesh) setHoverVisual(_hoveredMesh,false);
        _hoveredMesh=newMesh;
        if (_hoveredMesh) setHoverVisual(_hoveredMesh,true);
        _onHoverMesh&&_onHoverMesh(hit||null);
      }

      // FIX CURSOR: pointer si hay algo clickeable, default si no
      canvas.style.cursor=hit?'pointer':'default';
    });

    canvas.addEventListener('mouseleave',()=>{
      if (_hoveredMesh){setHoverVisual(_hoveredMesh,false);_hoveredMesh=null;}
      canvas.style.cursor='default';
      _onHoverMesh&&_onHoverMesh(null);
    });

    // ── click: selección (igual que antes, usa pickBest) ──
    canvas.addEventListener('click',e=>{
      if (window.__inkoraSuppressNextClick) { window.__inkoraSuppressNextClick = false; return; }
      if (orb.dragged) { orb.dragged = false; return; }
      const rect=canvas.getBoundingClientRect();
      mouse.set(
        ((e.clientX-rect.left)/rect.width)*2-1,
       -((e.clientY-rect.top)/rect.height)*2+1
      );
      raycaster.setFromCamera(mouse,camera);
      _onClickMesh&&_onClickMesh(pickBest(raycaster), e);
    });

    window.addEventListener('resize',resize);
    (function loop(){
      requestAnimationFrame(loop);
      orb.update();
      // Procesar animación de cámara (focusAll suave)
      if (_focusAnim) {
        const elapsed = performance.now() - _focusAnim.startTime;
        const raw     = Math.min(elapsed / _focusAnim.duration, 1);
        // ease-out cubic: 1-(1-t)³
        const t       = 1 - Math.pow(1 - raw, 3);
        camera.position.lerpVectors(_focusAnim.startPos, _focusAnim.targetPos, t);
        orb.target.lerpVectors(_focusAnim.startTarget, _focusAnim.center, t);
        camera.lookAt(orb.target);
        orb.recomputeSpherical();
        if (raw >= 1) _focusAnim = null;
      }
      renderer.render(scene, camera);
    })();
  }

  function _pickShapePoints(idx, segs = 96) {
    const c = (typeof State !== 'undefined' && State.contours) ? State.contours[idx] : null;
    if (!c?.shape) return [];
    const pts = c.shape.getPoints(segs);
    if (pts.length > 1 && pts[0].distanceToSquared(pts[pts.length - 1]) < 1e-12) pts.pop();
    return pts;
  }

  function _pointInPickPolygon(pt, pts) {
    if (!pt || !pts || pts.length < 3) return false;
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i].x, yi = pts[i].y;
      const xj = pts[j].x, yj = pts[j].y;
      if (((yi > pt.y) !== (yj > pt.y)) &&
          (pt.x < (xj - xi) * (pt.y - yi) / ((yj - yi) || 1e-12) + xi)) {
        inside = !inside;
      }
    }
    return inside;
  }

  function _pointSegmentDistSq2D(p, a, b) {
    const vx = b.x - a.x, vy = b.y - a.y;
    const wx = p.x - a.x, wy = p.y - a.y;
    const len2 = vx * vx + vy * vy || 1e-12;
    const t = Math.max(0, Math.min(1, (wx * vx + wy * vy) / len2));
    const x = a.x + vx * t;
    const y = a.y + vy * t;
    const dx = p.x - x, dy = p.y - y;
    return dx * dx + dy * dy;
  }

  function _minDistSqToPickPolyline(pt, pts) {
    if (!pt || !pts || pts.length < 2) return Infinity;
    let best = Infinity;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i];
      const b = pts[(i + 1) % pts.length];
      best = Math.min(best, _pointSegmentDistSq2D(pt, a, b));
    }
    return best;
  }

  function _isValidContourPickHit(hit) {
    const target = hit?.object;
    const idx = target?.userData?._pickContourIdx;
    const mesh = target?.userData?._pickMesh || target?.parent;
    if (idx == null || !mesh || !hit?.point) return false;
    const pts = _pickShapePoints(idx, 128);
    if (pts.length < 3) return true;
    const local = mesh.worldToLocal(hit.point.clone());
    const pt = new THREE.Vector2(local.x, local.y);

    if (target.userData?._visualPickLine || target.isLine) {
      const box = new THREE.Box2().setFromPoints(pts);
      const diag = Math.max(box.getSize(new THREE.Vector2()).length(), 1);
      const tol = Math.min(0.22, Math.max(0.025, diag * 0.0015));
      return _minDistSqToPickPolyline(pt, pts) <= tol * tol;
    }

    // Área invisible de tapa: filtra triángulos de ShapeGeometry que puedan
    // quedar fuera del contorno real en DXF complejos/autointersectados.
    return _pointInPickPolygon(pt, pts);
  }

  /* ── pickBest: lógica de selección unificada ──────────────────────────
     Para meshes 3D extruidos: el más cercano gana (distancia estándar).
     Para meshes 2D superpuestos: el de MENOR ÁREA DE BOUNDING BOX gana.

     ¿Por qué área y no distancia?
     Todos los flatMeshes 2D están al mismo Y (0.05), entonces la distancia
     de intersección es prácticamente idéntica para todos. Three.js devuelve
     el primero en el array, que suele ser el fondo (más grande).
     Ordenando por área, la letra encima del fondo siempre gana porque
     su bounding box es más chico que el del contorno exterior.
     ────────────────────────────────────────────────────────────────────── */
  function pickBest(rc) {
    const pickTargets=[];
    group3D.traverse(o=>{
      if((o.isLine || o.isMesh) && o.userData?._pickContourIdx != null) pickTargets.push(o);
    });
    const hitsPickTargets=rc.intersectObjects(pickTargets, false).filter(_isValidContourPickHit);
    const all3D=[];
    group3D.traverse(o=>{if(o.isMesh && o.userData?._pickContourIdx == null)all3D.push(o);});
    const hits3D=rc.intersectObjects(all3D);

    if (hitsPickTargets.length) {
      hitsPickTargets.sort((a, b) => {
        const aa = a.object.userData._pickArea ?? 0;
        const ba = b.object.userData._pickArea ?? 0;
        if (Math.abs(a.distance - b.distance) > 0.6) return a.distance - b.distance;
        return aa === ba ? a.distance - b.distance : aa - ba;
      });
      const targetHit = hitsPickTargets[0];
      const target = targetHit.object;
      return {
        mesh: target.userData._pickMesh || target.parent,
        line: target.isLine ? target : null,
        is3D: true,
        contourIdx: target.userData._pickContourIdx,
        capFace: target.userData._pickFace || 'top',
        point: targetHit.point,
      };
    }

    // 3D tiene prioridad absoluta
    if (hits3D.length) return {mesh:hits3D[0].object,is3D:true,point:hits3D[0].point};

    // 2D: recolectar todos los hits y ordenar por área ascendente
    const all2D=[];
    group2D.traverse(o=>{if(o.isMesh)all2D.push(o);});
    const hits2D=rc.intersectObjects(all2D);
    if (!hits2D.length) return null;

    const withArea=hits2D.map(h=>{
      const box=new THREE.Box3().setFromObject(h.object);
      const sz=box.getSize(new THREE.Vector3());
      // Los flatMeshes están rotados -90° en X, así que la "planta" es X×Z
      return {mesh:h.object, area:sz.x*sz.z};
    });
    withArea.sort((a,b)=>a.area-b.area);
    return {mesh:withArea[0].mesh,is3D:false};
  }

  /* ── setHoverVisual: oscurece piezas claras, aclara piezas oscuras ── */
  function setHoverVisual(mesh, on) {
    const is3D = !!group3D.getObjectById(mesh.id);
    if (is3D) {
      if (!mesh.material) return;
      // No pisar el highlight de selección
      if (on && mesh.userData._selected) return;
      if (on) {
        _applyHighlight(mesh, 'hover');
      } else {
        if (mesh.userData._selected) {
          _applyHighlight(mesh, 'select'); // restaurar highlight de selección
        } else {
          _clearHighlight(mesh);
        }
        delete mesh.userData._hovered;
      }
      mesh.userData._hovered = on || undefined;
    } else {
      if (mesh.material) {
        if (on) {
          // Hover 2D: guardar color y opacidad originales, aplicar highlight adaptativo
          if (mesh.userData._hoverOrigColor == null) {
            mesh.userData._hoverOrigColor = mesh.material.color.getHex();
            mesh.userData._hoverOrigOpacity = mesh.material.opacity;
            mesh.userData._hoverOrigColorWrite = mesh.material.colorWrite;
          }
          const origHex = mesh.userData._hoverOrigColor;
          const r2 = ((origHex >> 16) & 0xff) / 255;
          const g2 = ((origHex >>  8) & 0xff) / 255;
          const b2 = ( origHex        & 0xff) / 255;
          const lum2 = 0.299*r2 + 0.587*g2 + 0.114*b2;
          mesh.material.color.setHex(origHex);
          if (lum2 > 0.45) {
            mesh.material.color.multiplyScalar(0.65); // claro → oscurecer
          } else {
            mesh.material.color.addScalar(0.20);      // oscuro → aclarar
          }
          mesh.material.colorWrite = true;
          mesh.material.opacity = Math.min(0.92, mesh.userData._hoverOrigOpacity + 0.18);
        } else {
          if (mesh.userData._hoverOrigColor != null) {
            mesh.material.color.setHex(mesh.userData._hoverOrigColor);
            delete mesh.userData._hoverOrigColor;
          }
          if (mesh.userData._hoverOrigOpacity !== undefined) {
            mesh.material.opacity = mesh.userData._hoverOrigOpacity;
            delete mesh.userData._hoverOrigOpacity;
          }
          if (mesh.userData._hoverOrigColorWrite !== undefined) {
            mesh.material.colorWrite = mesh.userData._hoverOrigColorWrite;
            delete mesh.userData._hoverOrigColorWrite;
          }
        }
      }
    }
  }

  function resize(){
    const w=document.getElementById('vp-wrap').clientWidth;
    const h=document.getElementById('vp-wrap').clientHeight;
    renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
  }

  function add2D(m){group2D.add(m);}
  function add3D(m){group3D.add(m);}
  function remove3D(m){group3D.remove(m);disposeMesh(m);}
  function clear2D(){clearGroup(group2D);}
  function clearAll(){_hoveredMesh=null;clearGroup(group2D);clearGroup(group3D);}
  function clearGroup(g){
    while(g.children.length){const m=g.children[0];g.remove(m);disposeMesh(m);}
  }
  function disposeMesh(m){
    m.geometry?.dispose();
    if(Array.isArray(m.material))m.material.forEach(x=>x.dispose());
    else m.material?.dispose();
    m.children?.forEach(child => {
      child.geometry?.dispose();
      child.material?.dispose();
    });
  }
  // Aplica highlight adaptativo (hover=suave, select=fuerte) según luminancia del color base
  function _applyHighlight(mesh, mode) {
    // Guardar color original ANTES de cualquier modificación (solo la primera vez)
    if (mesh.userData._highlightOrigColor == null) {
      mesh.userData._highlightOrigColor = mesh.material.color.getHex();
    }
    // Restaurar color base para calcular luminancia correctamente
    const origHex = mesh.userData._highlightOrigColor;
    const r = ((origHex >> 16) & 0xff) / 255;
    const g = ((origHex >>  8) & 0xff) / 255;
    const b = ( origHex        & 0xff) / 255;
    const lum = 0.299*r + 0.587*g + 0.114*b;

    if (lum > 0.45) {
      // Color claro → resalte oscuro: oscurecer el color base
      mesh.material.emissive?.set(0x000000);
      mesh.material.emissiveIntensity = 0;
      mesh.material.color.setHex(origHex);
      mesh.material.color.multiplyScalar(mode === 'select' ? 0.50 : 0.68);
    } else {
      // Color oscuro → resalte claro: emissive blanco
      mesh.material.color.setHex(origHex);
      mesh.material.emissive?.set(0xffffff);
      mesh.material.emissiveIntensity = mode === 'select' ? 0.42 : 0.22;
    }
  }
  function _clearHighlight(mesh) {
    if (mesh.userData._highlightOrigColor != null) {
      mesh.material.color.setHex(mesh.userData._highlightOrigColor);
      delete mesh.userData._highlightOrigColor;
    }
    mesh.material.emissive?.set(0x000000);
    mesh.material.emissiveIntensity = 0;
  }
  function setEmissive(mesh, color, intensity) {
    if (!mesh?.material) return;
    if (intensity > 0) {
      _applyHighlight(mesh, 'select');
      mesh.userData._selected = true;
    } else {
      _clearHighlight(mesh);
      delete mesh.userData._selected;
    }
  }
  function clearEmissive(grp) {
    grp.traverse(o => {
      if (o.isMesh) {
        _clearHighlight(o);
        delete o.userData._selected;
        delete o.userData._hovered;
      }
    });
  }
  /* ── focusAll: encuadra toda la escena con transición suave ───────────
     Anima la cámara y el target del orbit en ~400ms usando lerp por frame.
     Si no hay geometría, no hace nada.
     EXTENSIÓN: focus en selección, interpolación cúbica (ease-in-out).
  ─────────────────────────────────────────────────────────────────────── */
  function focusAll() {
    const box = new THREE.Box3();
    group2D.traverse(o => { if (o.isMesh) box.expandByObject(o); });
    group3D.traverse(o => { if (o.isMesh) box.expandByObject(o); });
    if (box.isEmpty()) return;

    const center  = box.getCenter(new THREE.Vector3());
    const size    = box.getSize(new THREE.Vector3());
    const maxD    = Math.max(size.x, size.y, size.z);
    const targetPos = new THREE.Vector3(
      center.x,
      center.y + maxD * 0.8,
      center.z + maxD * 1.4
    );

    const startPos    = camera.position.clone();
    const startTarget = orb.target.clone();
    const duration    = 400; // ms
    const startTime   = performance.now();

    // Reemplazar cualquier animación en curso
    _focusAnim = { startPos, startTarget, targetPos, center, startTime, duration };
  }
  // Almacena la animación en curso (null si no hay ninguna)
  let _focusAnim = null;

  function onClickMesh(cb){_onClickMesh=cb;}
