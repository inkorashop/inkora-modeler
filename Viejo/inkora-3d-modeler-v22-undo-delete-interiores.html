          if (!toRemove.size) { Utils.toast('Seleccioná un grupo para desagrupar.'); break; }
          State.groups = State.groups.filter(g => !toRemove.has(g.id));
          History.push(State);
          PanelUI.renderList();
          Utils.toast('Desagrupado.', 'ok');
          break;
        }

        case 'import':
          document.getElementById('file-input').click();
          break;

        case 'openProject':
          openProjectWithPicker();
          break;

        case 'saveProject':
          if (State.contours.length) document.getElementById('btn-save-project').click();
          break;

        case 'export':
          if (State.pieces.length) document.getElementById('btn-export').click();
          break;
      }
    }

    /* ── Handler global de teclado ───────────────────── */
    function handleKeydown(e) {
      // Si está grabando, interceptar
      if (_recordingId) { _onKeydownRecording(e); return; }

      // Ctrl+Z / Ctrl+Shift+Z (undo/redo) siempre funcionan, incluso en inputs
      const isUndoRedo = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z';
      if (isUndoRedo) {
        e.preventDefault();
        const sc = resolve(e);
        if (sc) execAction(sc.id);
        return;
      }

      // No interferir en inputs para el resto de atajos
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      // No interferir si el panel de shortcuts está en modo edición y abierto
      if (_editMode && document.getElementById('shortcuts-panel').classList.contains('open')) return;

      let sc = resolve(e);
      // Fallback duro para conservar el atajo historico aunque el keymap guardado
      // quede viejo o incompleto despues de agregar nuevos atajos.
      if (!sc && e.key.toLowerCase() === 'a' && !e.ctrlKey && !e.metaKey && !e.shiftKey && !e.altKey) {
        sc = { id: 'selAll' };
      }
      if (!sc) return;
      // Teclas de flecha y otras que el browser usa por defecto → prevenir
      const preventKeys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab','Escape','f','a','e','d','c','o','h','i','g','r','s','1','2'];
      if (preventKeys.includes(e.key) || e.ctrlKey || e.metaKey) e.preventDefault();
      execAction(sc.id);
    }

  /* ── Depth typing: escribir número directo en el viewport ─────────────
     Al presionar dígitos (0-9), punto o backspace sin estar en un input,
     se acumula el valor y se muestra en el HUD del viewport.
     Enter confirma y actualiza el input ex-depth.
     Escape cancela.
  ────────────────────────────────────────────────────────────────────── */
  (() => {
    const depthHud    = document.getElementById('depth-hud');
    const depthHudVal = document.getElementById('depth-hud-val');
    const depthInput  = document.getElementById('ex-depth');
    let buffer = '';
    let hudTimer = null;

    function isTypingInInput() {
      const t = document.activeElement?.tagName;
      return t === 'INPUT' || t === 'TEXTAREA';
    }

    function showHud(val) {
      depthHudVal.textContent = val || '…';
      depthHud.style.display = 'block';
      clearTimeout(hudTimer);
    }

    function hideHud() {
      depthHud.style.display = 'none';
      buffer = '';
    }

    function commit() {
      const v = Utils.parseDecimal(buffer, NaN);
      if (!isNaN(v) && v !== 0) {
        depthInput.value = Math.min(100, Math.max(-100, v));
        depthInput.dispatchEvent(new Event('change'));
      }
      hideHud();
    }

    document.addEventListener('keydown', e => {
      // No interferir si el foco está en un input
      if (isTypingInInput()) return;
      // No interferir con Ctrl/Meta shortcuts
      if (e.ctrlKey || e.metaKey) return;

      const key = e.key;

      if (/^[0-9]$/.test(key) || ((key === '.' || key === ',') && !buffer.includes('.') && !buffer.includes(',')) || (key === '-' && buffer.length === 0)) {
        e.preventDefault();
        buffer += key;
        showHud(buffer);
        return;
      }

      if (key === 'Backspace' && buffer.length > 0) {
        e.preventDefault();
        buffer = buffer.slice(0, -1);
        showHud(buffer || '…');
        if (!buffer) hideHud();
        return;
      }

      if (key === 'Enter' && buffer.length > 0) {
        e.preventDefault();
        commit();
        return;
      }

      if (key === 'Escape' && buffer.length > 0) {
        e.preventDefault();
        hideHud();
        return;
      }
    });
  })();

  /* ── Marquee (rubber-band) selection ──────────────────────────────────
     Activa al mantener click izquierdo y arrastrar sin Ctrl/Shift.
     Selecciona contornos cuyo bounding box 2D en pantalla quede
     100% dentro del rectángulo trazado.
  ────────────────────────────────────────────────────────────────────── */
  (() => {
    const marqueeEl = document.getElementById('marquee');
    let mActive = false;
    let mStartX = 0, mStartY = 0;
    let mDragging = false;
    const MIN_DRAG = 6; // px mínimos para activar el marquee

    const canvas = document.getElementById('viewport');

    canvas.addEventListener('mousedown', e => {
      // Solo botón izquierdo, sin modificadores, sin gizmo activo
      if (e.button !== 0) return;
      if (e.ctrlKey || e.metaKey || e.shiftKey) return;
      if (!State.contours.length) return;
      const rect = canvas.getBoundingClientRect();
      mStartX = e.clientX - rect.left;
      mStartY = e.clientY - rect.top;
      mActive = true;
      mDragging = false;
    });

    window.addEventListener('mousemove', e => {
      if (!mActive) return;
      const rect = canvas.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      const dx = cx - mStartX, dy = cy - mStartY;

      if (!mDragging && (Math.abs(dx) > MIN_DRAG || Math.abs(dy) > MIN_DRAG)) {
        mDragging = true;
        marqueeEl.style.display = 'block';
      }

      if (mDragging) {
        const x = Math.min(cx, mStartX);
        const y = Math.min(cy, mStartY);
        const w = Math.abs(dx);
        const h = Math.abs(dy);
        marqueeEl.style.left   = x + 'px';
        marqueeEl.style.top    = y + 'px';
        marqueeEl.style.width  = w + 'px';
        marqueeEl.style.height = h + 'px';
      }
    });

    window.addEventListener('mouseup', e => {
      if (!mActive) { mActive = false; return; }
      mActive = false;
      if (!mDragging) { marqueeEl.style.display = 'none'; return; }
      window.__inkoraSuppressNextClick = true;
      marqueeEl.style.display = 'none';
      mDragging = false;

      // Rectángulo de selección en coordenadas del viewport
      const rect = canvas.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      const selX1 = Math.min(cx, mStartX);
      const selY1 = Math.min(cy, mStartY);
      const selX2 = Math.max(cx, mStartX);
      const selY2 = Math.max(cy, mStartY);

      if (selX2 - selX1 < MIN_DRAG || selY2 - selY1 < MIN_DRAG) return;
      const INSIDE_EPS = 2;

      const camera  = Viewport.getCamera();
      const vpW = rect.width;
      const vpH = rect.height;

      // Proyectar un punto 3D a coordenadas de pantalla (px relativas al canvas)
      function projectToScreen(v3) {
        const v = v3.clone().project(camera);
        return {
          x: ( v.x + 1) / 2 * vpW,
          y: (-v.y + 1) / 2 * vpH,
        };
      }

      function bboxFromWorldPoints(points) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        points.forEach(v => {
          const s = projectToScreen(v);
          if (s.x < minX) minX = s.x;
          if (s.y < minY) minY = s.y;
          if (s.x > maxX) maxX = s.x;
          if (s.y > maxY) maxY = s.y;
        });
        return { minX, minY, maxX, maxY };
      }

      function meshScreenBox(mesh) {
        if (!mesh) return null;
        const box3 = getRealMeshBox(mesh);
        if (box3.isEmpty()) return null;
        return bboxFromWorldPoints([
          new THREE.Vector3(box3.min.x, box3.min.y, box3.min.z),
          new THREE.Vector3(box3.max.x, box3.min.y, box3.min.z),
          new THREE.Vector3(box3.min.x, box3.max.y, box3.min.z),
          new THREE.Vector3(box3.max.x, box3.max.y, box3.min.z),
          new THREE.Vector3(box3.min.x, box3.min.y, box3.max.z),
          new THREE.Vector3(box3.max.x, box3.min.y, box3.max.z),
          new THREE.Vector3(box3.min.x, box3.max.y, box3.max.z),
          new THREE.Vector3(box3.max.x, box3.max.y, box3.max.z),
        ]);
      }

      function contourScreenBox(c, idx, face = 'top') {
        if (!c) return null;
        if (!c.extruded) return meshScreenBox(c.flatMesh);
        if (c.piece?._mergedSourceIdxs?.includes(idx)) {
          c.piece.mesh.updateMatrixWorld(true);
          const z = getPieceLocalCapZ(c.piece, face);
          const pts = c.shape.getPoints(96).map(p =>
            c.piece.mesh.localToWorld(new THREE.Vector3(p.x, p.y, z))
          );
          return bboxFromWorldPoints(pts);
        }
        return meshScreenBox(c.piece?.mesh);
      }

      // Para cada contorno no absorbido, calcular su bounding box en pantalla
      // y verificar que esté 100% dentro del rectángulo de selección.
      const toSelect = [];
      State.contours.forEach((c, idx) => {
        if (!Utils.isVisibleContour(c)) return;
        if (!c.extruded && isLikelyVoidHole(c, idx)) return;
        const face = viewFaceForContour(c);
        const box = contourScreenBox(c, idx, face);
        if (!box) return;

        /*
        // Calcular bbox 3D del mesh
        const box3 = new THREE.Box3().setFromObject(mesh);
        // Los 8 vértices de la bbox
        const corners = [
          new THREE.Vector3(box3.min.x, box3.min.y, box3.min.z),
          new THREE.Vector3(box3.max.x, box3.min.y, box3.min.z),
          new THREE.Vector3(box3.min.x, box3.max.y, box3.min.z),
          new THREE.Vector3(box3.max.x, box3.max.y, box3.min.z),
          new THREE.Vector3(box3.min.x, box3.min.y, box3.max.z),
          new THREE.Vector3(box3.max.x, box3.min.y, box3.max.z),
          new THREE.Vector3(box3.min.x, box3.max.y, box3.max.z),
          new THREE.Vector3(box3.max.x, box3.max.y, box3.max.z),
        ];

        // Proyectar todos los vértices a pantalla
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        corners.forEach(v => {
          const s = projectToScreen(v);
          if (s.x < minX) minX = s.x;
          if (s.y < minY) minY = s.y;
          if (s.x > maxX) maxX = s.x;
          if (s.y > maxY) maxY = s.y;
        });
        */

        // El contorno se selecciona SOLO si su bbox en pantalla está 100% dentro
        if (box.minX >= selX1 - INSIDE_EPS && box.maxX <= selX2 + INSIDE_EPS &&
            box.minY >= selY1 - INSIDE_EPS && box.maxY <= selY2 + INSIDE_EPS) {
          toSelect.push({ idx, face });
        }
      });

      if (!toSelect.length) return;

      // Aplicar selección (reemplaza la selección actual)
      PanelUI.clearAllSelection();
      toSelect.forEach(({ idx, face }) => {
        const c = State.contours[idx];
        State.selectedIdxs.add(idx);
        State.selectedFaces.set(idx, face);
        if (!c.extruded) c.sel2D = true;
      });
      PanelUI._syncPieceSelection();
      PanelUI.refreshContourVisuals();
      PanelUI.renderList();
      PanelUI.updateModeBadge();
      PanelUI.updateColorPanel();
    });
  })();
  vpWrap.addEventListener('dragover',e=>{e.preventDefault();overlay.classList.add('active');});
  vpWrap.addEventListener('dragleave',e=>{if(!vpWrap.contains(e.relatedTarget))overlay.classList.remove('active');});
  vpWrap.addEventListener('drop',async e=>{

  document.getElementById('btn-extrude').addEventListener('click',()=>{
    // Extruir contornos 2D seleccionados
    const selected=State.contours.filter((c, idx)=>Utils.isVisibleContour(c)&&c.sel2D&&!c.extruded&&!isLikelyVoidHole(c, idx));

    // Extruir sobre piezas 3D seleccionadas (nueva pieza encima)
    const selected3D = [];
    State.selectedIdxs.forEach(idx => {
      const c = State.contours[idx];
      if (c && c.extruded && c.piece) selected3D.push({ c, idx });
    });

    if(!selected.length && !selected3D.length) return;
    const extDepth=Utils.parseDecimal(document.getElementById('ex-depth').value, 3);
    if (!Number.isFinite(extDepth) || Math.abs(extDepth) < 0.0001) {
      Utils.toast('La profundidad no puede ser 0.', 'err');
      return;
    }
    const bevel=Math.max(0, Utils.parseDecimal(document.getElementById('ex-bevel').value, 0));
    const bseg=parseInt(document.getElementById('ex-bseg').value,10)||3;
    const extrudeColor = '#c8c8d0';

    // Los interiores se absorben como huecos SOLO si no están seleccionados.
    // Si el usuario selecciona un interior, se extruye como pieza independiente
    // y conserva su propio color/material.
    // Un contorno es "candidato a hueco" de otro si:
    //   1. Su parentIdx === índice del padre en State.contours
    //   2. Su depth === padre.depth + 1  (impar = hueco, par = isla)
    //   3. No está ya extruido
    //   4. NO está en la lista de seleccionados (si lo está, el usuario quiere extruirlo como pieza)
    const absorbed = new Set(); // contornos absorbidos como holes (no generan pieza propia)
    const selectedSet = new Set(selected); // lookup O(1)

    // absorbChildren: procesa la jerarquía completa de un shape padre.
    //
    // Three.js ExtrudeGeometry soporta holes en un THREE.Shape, pero no anidamiento
    // de islas dentro de holes. Para manejar islas (sólidos dentro de huecos),
    // se generan THREE.Shape adicionales que se acumulan en `extraShapes` y luego
    // se pasan como array a ExtrudeGeometry junto con el shape principal.
    //
    // Jerarquía respecto al shape que se extruye:
    //   depth relativo +1 → hole (vacío dentro del sólido)
    //   depth relativo +2 → isla (sólido dentro del hole) → nuevo THREE.Shape
    //   depth relativo +3 → sub-hole de esa isla → hole del nuevo shape
    //   ... y así recursivamente
    //
    // extraShapes: array acumulador de THREE.Shape de islas internas.
    function absorbChildren(parentIdx, parentDepth, compositeShape, extraShapes, holeIdxs = []) {
      State.contours.forEach((candidate, cidx) => {
        if (candidate.extruded) return;
        if (absorbed.has(candidate)) return;
        if (candidate.parentIdx !== parentIdx) return;
        if (candidate.depth !== parentDepth + 1) return;
        // Si el usuario seleccionó este contorno, se extruirá como pieza independiente
        if (State.selectedIdxs.has(cidx)) return;
        // Solo absorber como hueco cuando es literalmente vacío.
        // Si hay otra capa/material detrás, no se perfora el sólido.
        if (!isLikelyVoidHole(candidate, cidx)) return;

        // Hueco directo → agregar como hole del shape padre (debe ser CW)
        const holePath = makeHoleCW(candidate.shape);
        compositeShape.holes.push(holePath);
        holeIdxs.push(cidx);
        absorbed.add(candidate);
        candidate.extruded = true;
        candidate.sel2D = false;
        candidate.piece = null;

        // Islas dentro de este hole (depth + 2 relativo al raíz):
        // cada isla es un sólido, se convierte en un THREE.Shape separado (CCW).
        State.contours.forEach((island, iidx) => {
          if (island.extruded) return;
          if (absorbed.has(island)) return;
          if (island.parentIdx !== cidx) return;
          if (island.depth !== candidate.depth + 1) return;
          if (State.selectedIdxs.has(iidx)) return;

          const islandShape = makeShapeCCW(island.shape);
          absorbed.add(island);
          island.extruded = true;
          island.sel2D = false;
          island.piece = null;

          // Sub-huecos de la isla → holes del islandShape + posibles islas anidadas
          absorbChildren(iidx, island.depth, islandShape, extraShapes, holeIdxs);
          extraShapes.push(islandShape);
        });
      });
    }

    const merged2D = State.extrudeMode === 'merged' && selected.length > 1;
    const mergedItems = [];

    selected.forEach((c, i) => {
      if (absorbed.has(c)) return;

      const cIdx = State.contours.indexOf(c);
      const color = c.color || extrudeColor;

      const compositeShape = makeShapeCCW(c.shape);
      const extraShapes = []; // islas internas (sólidos dentro de huecos)
      const holeIdxs = [];
      absorbChildren(cIdx, c.depth, compositeShape, extraShapes, holeIdxs);

      // Agregar interiores seleccionados como holes del exterior para evitar solapamiento
      State.contours.forEach((candidate, cidx) => {
        if (candidate === c) return;
        if (candidate.extruded) return;
        if (candidate.parentIdx !== cIdx) return;
        if (candidate.depth !== c.depth + 1) return;
        // Solo si también está seleccionado — se extruirá como pieza propia
        if (!selectedSet.has(candidate)) return;
        const holePath = makeHoleCW(candidate.shape);
        compositeShape.holes.push(holePath);
      });

      if (merged2D) {
        State.contours.forEach((candidate, cidx) => {
          if (candidate === c) return;
          if (!selectedSet.has(candidate)) return;
          if (candidate.parentIdx !== cIdx) return;
          if (candidate.depth !== c.depth + 1) return;
          holeIdxs.push(cidx);
        });
        mergedItems.push({ c, cIdx, color, compositeShape, extraShapes, holeIdxs });
        return;
      }

      const mesh = GeoModule.extrude(compositeShape, c.offX, c.offY, {depth: (c.depthOverride ?? extDepth), bevel, bevelSeg:bseg, color, extraShapes});
      addMergedContourPickLines(mesh, [{ c, cIdx, pickShape: compositeShape }], (c.depthOverride ?? extDepth));
      Viewport.add3D(mesh);
      const name = `Pieza ${String(State.pieces.length+1).padStart(2,'0')}`;
      // Guardar qué contornos fueron agregados como holes de esta pieza
      State.contours.forEach((candidate, cidx) => {
        if (candidate === c) return;
        if (!selectedSet.has(candidate)) return;
        if (candidate.parentIdx !== cIdx) return;
        if (candidate.depth !== c.depth + 1) return;
        holeIdxs.push(cidx);
      });
      const piece = {
        mesh, name, color, contourIdx: cIdx,
        _depth: (c.depthOverride ?? extDepth), _bevel:bevel, _bevelSeg:bseg,
        _baseX: mesh.position.x, _baseY: mesh.position.y, _baseZ: mesh.position.z,
        tx:0, ty:0, tz:0, rotY:0, scale:1,
        _holeIdxs: Array.from(new Set(holeIdxs)),
      };
      State.pieces.push(piece);
      c.extruded=true; c.sel2D=false; c.piece=piece;
      if(c.flatMesh) c.flatMesh.visible=false;
      if(c.outlineMesh) c.outlineMesh.visible=false;
    });

    if (merged2D && mergedItems.length) {
      // En modo "Objeto unido", todos los contornos seleccionados se generan
      // como UNA sola pieza y toman un único color. Los colores individuales
      // solo se conservan cuando se usa "Objetos separados".
      const clusters = clusterMergedItems(mergedItems);

      clusters.forEach(cluster => {
        const primary = cluster[0];
        const extraShapes = [...primary.extraShapes];
        cluster.slice(1).forEach(item => {
          extraShapes.push(item.compositeShape, ...item.extraShapes);
        });

        const mergedCluster = cluster.length > 1;
        const mesh = GeoModule.extrude(primary.compositeShape, primary.c.offX, primary.c.offY, {
          depth: (primary.c.depthOverride ?? extDepth),
          bevel,
          bevelSeg:bseg,
          color: primary.color,
          extraShapes,
          addOutlines: !mergedCluster,
        });
        if (mergedCluster) addMergedContourPickLines(mesh, cluster, (primary.c.depthOverride ?? extDepth));
        Viewport.add3D(mesh);

        const name = `Pieza ${String(State.pieces.length+1).padStart(2,'0')}`;
        const piece = {
          mesh, name, color: primary.color, contourIdx: primary.cIdx,
          _depth: (primary.c.depthOverride ?? extDepth), _bevel:bevel, _bevelSeg:bseg,
          _baseX: mesh.position.x, _baseY: mesh.position.y, _baseZ: mesh.position.z,
          tx:0, ty:0, tz:0, rotY:0, scale:1,
          _holeIdxs: Array.from(new Set(cluster.flatMap(item => item.holeIdxs))),
          _mergedSourceIdxs: mergedCluster ? cluster.map(item => item.cIdx) : [],
        };
        State.pieces.push(piece);
        cluster.forEach((item, idx) => {
          item.c.extruded=true; item.c.sel2D=false; item.c.piece=piece; item.c._panelHidden = mergedCluster && idx !== 0;
          if(item.c.flatMesh) item.c.flatMesh.visible=false;
          if(item.c.outlineMesh) item.c.outlineMesh.visible=false;
        });
      });
    }


    // absorbChildrenForce: igual que absorbChildren pero ignora el flag `extruded`
    // en los hijos. Se usa al extruir sobre una pieza 3D ya existente, cuyos
    // contornos hijo fueron marcados como extruded durante la primera extrusión.
    function absorbChildrenForce(parentIdx, parentDepth, compositeShape, extraShapes, holeIdxs = []) {
      State.contours.forEach((candidate, cidx) => {
        if (absorbed.has(candidate)) return;
        if (candidate.parentIdx !== parentIdx) return;
        if (candidate.depth !== parentDepth + 1) return;
        if (State.selectedIdxs.has(cidx)) return;
        if (!isLikelyVoidHole(candidate, cidx, { ignoreExtruded: true })) return;

        const holePath = makeHoleCW(candidate.shape);
        compositeShape.holes.push(holePath);
        holeIdxs.push(cidx);
        absorbed.add(candidate);

        State.contours.forEach((island, iidx) => {
          if (absorbed.has(island)) return;
          if (island.parentIdx !== cidx) return;
          if (island.depth !== candidate.depth + 1) return;
          if (State.selectedIdxs.has(iidx)) return;

          const islandShape = makeShapeCCW(island.shape);
          absorbed.add(island);
          absorbChildrenForce(iidx, island.depth, islandShape, extraShapes, holeIdxs);
          extraShapes.push(islandShape);
        });
      });
    }

    function build3DExtrusionItem(c, idx) {
      const compositeShape = makeShapeCCW(c.shape);
      const extraShapes = [];
      const holeIdxs = [];

      // Absorber huecos hijos (holes) del contorno usando la variante Force,
      // ya que los contornos hijo ya fueron marcados extruded=true en la primera
      // extrusión 2D. absorbChildrenForce ignora ese flag y reconstruye los holes
      // a partir de la geometría original del shape, garantizando que letras/formas
      // con huecos interiores se extruyan correctamente también en capas superiores.
      absorbChildrenForce(idx, c.depth, compositeShape, extraShapes, holeIdxs);
      return {
        c, idx, compositeShape, extraShapes, holeIdxs,
        face: State.selectedFaces.get(idx) || viewFaceForContour(c),
      };
    }

    function anchorYForFace(piece, face) {
      const box = getPieceRealBox(piece);
      if (box.isEmpty()) return piece?.mesh?.position?.y || 0;
      return face === 'bottom' ? box.min.y : box.max.y;
    }

    function directedDepthForFace(face) {
      const d = Math.abs(extDepth) || 0.1;
      const faceSign = face === 'bottom' ? -1 : 1;
      const inputSign = extDepth < 0 ? -1 : 1;
      return d * faceSign * inputSign;
    }

    function makeFakeContourFrom3D(item, piece, hidden) {
      return {
        shape: item.c.shape, offX: item.c.offX, offY: item.c.offY,
        depth: item.c.depth, parentIdx: -1,
        layer: item.c.layer || '0', color: item.c.color || piece.color || extrudeColor,
        colorSource: item.c.colorSource || 'default',
        hasEntityColor: !!item.c.hasEntityColor,
        hasExplicitColor: !!item.c.hasExplicitColor,
        flatMesh: null, outlineMesh: null,
        sel2D: false, extruded: true, piece,
        depthOverride: null,
        _isFakeContour: true,
        _panelHidden: !!hidden,
      };
    }

    let created3DCount = 0;
    const selected3DItems = selected3D.map(({ c, idx }) => build3DExtrusionItem(c, idx));

    // Extruir sobre piezas 3D seleccionadas
    if (State.extrudeMode === 'merged' && selected3DItems.length > 1) {
      const groups3D = new Map();
      selected3DItems.forEach(item => {
        const key = `${State.pieces.indexOf(item.c.piece)}|${item.face}`;
        if (!groups3D.has(key)) groups3D.set(key, []);
        groups3D.get(key).push(item);
      });

      groups3D.forEach(items => {
        const primary = items[0];
        const srcPiece = primary.c.piece;
        const face = primary.face;
        const depth = directedDepthForFace(face);
        const anchorY = anchorYForFace(srcPiece, face);
        const color = primary.c.color || srcPiece.color || extrudeColor;
        const extraShapes = [...primary.extraShapes];
        items.slice(1).forEach(item => {
          extraShapes.push(item.compositeShape, ...item.extraShapes);
        });

        const mesh = GeoModule.extrude(primary.compositeShape, primary.c.offX, primary.c.offY, {
          depth, bevel, bevelSeg: bseg, color, extraShapes,
          addOutlines: false
        });
        mesh.position.y += anchorY;

        const name = `Pieza ${String(State.pieces.length+1).padStart(2,'0')}`;
        const firstContourIdx = State.contours.length;
        const newIdxs = items.map((_, i) => firstContourIdx + i);
        const piece = {
          mesh, name, color,
          contourIdx: firstContourIdx,
          _sourceContourIdx: primary.idx,
          _depth: depth, _bevel: bevel, _bevelSeg: bseg,
          _baseX: mesh.position.x, _baseY: mesh.position.y, _baseZ: mesh.position.z,
          tx:0, ty:0, tz:0, rotY:0, scale:1,
          _holeIdxs: Array.from(new Set(items.flatMap(item => item.holeIdxs || []))),
          _mergedSourceIdxs: newIdxs,
        };
        addMergedContourPickLines(mesh, items.map((item, i) => ({ c: item.c, cIdx: newIdxs[i], pickShape: item.compositeShape })), depth);
        Viewport.add3D(mesh);
        State.pieces.push(piece);
        items.forEach((item, i) => {
          State.contours.push(makeFakeContourFrom3D(item, piece, i !== 0));
        });
        created3DCount++;
      });
    } else {
      selected3DItems.forEach(item => {
        const { c, idx, compositeShape, extraShapes, face } = item;
        const srcPiece = c.piece;
        const depth = directedDepthForFace(face);
        const anchorY = anchorYForFace(srcPiece, face);

      // Pasar baseY=0 explícitamente para que GeoModule no aplique offset de depth negativo
      const mesh = GeoModule.extrude(compositeShape, c.offX, c.offY, {
        depth, bevel, bevelSeg: bseg, color: c.color || srcPiece.color || extrudeColor, extraShapes
      });

      // La geometría extruida empieza en Z=0 local (= Y=0 world tras rotation.x=-90°).
      // Ajustamos position.y para que la base del nuevo mesh coincida exactamente
      // con el tope de la pieza existente. El EPS anti-zfight ya está en la geometría.
      // GeoModule pone position.y = meshBaseY (0 para depth>0).
      // Solo necesitamos sumar topY a esa posición base.
      mesh.position.y += anchorY;

      Viewport.add3D(mesh);
      const name = `Pieza ${String(State.pieces.length+1).padStart(2,'0')}`;
      const newContourIdx = State.contours.length;
      addMergedContourPickLines(mesh, [{ c, cIdx: newContourIdx, pickShape: compositeShape }], depth);
      const piece = {
        mesh, name, color: c.color || srcPiece.color || extrudeColor,
        contourIdx: newContourIdx,
        _sourceContourIdx: idx,
        _depth: depth, _bevel: bevel, _bevelSeg: bseg,
        _baseX: mesh.position.x, _baseY: mesh.position.y, _baseZ: mesh.position.z,
        tx:0, ty:0, tz:0, rotY:0, scale:1,
        _holeIdxs: Array.from(new Set(item.holeIdxs || [])),
      };
      State.pieces.push(piece);
      // Crear contorno para la nueva pieza (ficticio: sin flatMesh/outlineMesh)
      // depthOverride: null asegura que restoreSnapshot lo trate correctamente
        State.contours.push(makeFakeContourFrom3D(item, piece, false));
        created3DCount++;
      });
    }

    PanelUI.clearAllSelection();
    PanelUI.refreshContourVisuals();PanelUI.renderList();PanelUI.updateModeBadge();PanelUI.updateButtons();
    PanelUI.updateColorPanel();
    History.push(State);
    const pieceCount2D = merged2D && mergedItems.length ? 1 : selected.length;
    const piece3DCount = created3DCount;
    const totalNew = pieceCount2D + piece3DCount;
    const holeCount  = absorbed.size;
    const depths = State.pieces.slice(-totalNew).map(p => p._depth);
    const allSame = depths.length > 0 && depths.every(d => d === depths[0]);
    const depthLabel = allSame ? `${depths[0]}mm` : 'profundidades mixtas';
    const msg = holeCount > 0
      ? `${totalNew} pieza(s) extruida(s) a ${depthLabel} (${holeCount} hueco(s) aplicado(s)).`
      : `${totalNew} pieza(s) extruida(s) a ${depthLabel}.`;
    Utils.toast(msg, 'ok');
  });

  document.getElementById('btn-sel-all').addEventListener('click',()=>{PanelUI.selectAll();PanelUI.updateModeBadge();});
  document.getElementById('btn-sel-none').addEventListener('click',()=>{PanelUI.selectNone();PanelUI.updateModeBadge();});

  document.getElementById('btn-clear').addEventListener('click',()=>{
    PanelUI.clearAllSelection();
    Viewport.clearAll();State.reset();
    GeoModule.resetCounter();
    PanelUI.renderList();PanelUI.updateModeBadge();PanelUI.updateButtons();
    PanelUI.updateColorPanel();
    document.getElementById('mode-badge').textContent='Sin geometría';
    document.getElementById('mode-badge').className='';
    // Snapshot del estado vacío DESPUÉS de limpiar
    History.push(State);
    ProjectTabs.syncActiveFromState();
    Utils.toast('Escena limpiada.');
  });

  document.getElementById('btn-export').addEventListener('click',async()=>{
    if(!State.pieces.length)return;
    Utils.toast('Generando 3MF…','',60000);
    try {
      await Exporter.exportMeshes(State.pieces, State.filename||'inkora-model');
      Utils.toast('Archivo exportado correctamente.','ok');
    } catch(err){Utils.toast('Error al exportar: '+err.message,'err');console.error(err);}
  });

  // Habilitar/deshabilitar segmentos según bisel
  (() => {
    const pop = document.getElementById('color-popover');
    const square = document.getElementById('color-square');
    const hue = document.getElementById('color-hue');
    const preview = document.getElementById('color-preview');
    const sctx = square.getContext('2d');
    const hctx = hue.getContext('2d');
    let h = 0, s = 0, v = 0.78;
    let active = null;
    let originalColors = null;
    let dirty = false;

    function hsvToHex(hh, ss, vv) {
      const c = vv * ss;
      const x = c * (1 - Math.abs(((hh / 60) % 2) - 1));
      const m = vv - c;
      let r = 0, g = 0, b = 0;
      if (hh < 60) [r,g,b] = [c,x,0];
      else if (hh < 120) [r,g,b] = [x,c,0];
      else if (hh < 180) [r,g,b] = [0,c,x];
      else if (hh < 240) [r,g,b] = [0,x,c];
      else if (hh < 300) [r,g,b] = [x,0,c];
      else [r,g,b] = [c,0,x];
      return '#' + [r,g,b].map(n => Math.round((n + m) * 255).toString(16).padStart(2, '0')).join('');
    }

    function hexToHsv(hex) {
      const raw = (hex || '#c8c8d0').replace('#', '');
      const rr = parseInt(raw.slice(0,2),16) / 255;
      const gg = parseInt(raw.slice(2,4),16) / 255;
      const bb = parseInt(raw.slice(4,6),16) / 255;
      const max = Math.max(rr,gg,bb), min = Math.min(rr,gg,bb), d = max - min;
      let hh = 0;
      if (d) {
        if (max === rr) hh = 60 * (((gg - bb) / d) % 6);
        else if (max === gg) hh = 60 * ((bb - rr) / d + 2);
        else hh = 60 * ((rr - gg) / d + 4);
      }
      if (hh < 0) hh += 360;
      return { h: hh, s: max ? d / max : 0, v: max };
    }

    function currentHex() { return hsvToHex(h, s, v); }

    function drawHue() {
      const grad = hctx.createLinearGradient(0, 0, hue.width, 0);
      for (let i = 0; i <= 6; i++) grad.addColorStop(i / 6, `hsl(${i * 60},100%,50%)`);
      hctx.fillStyle = grad;
      hctx.fillRect(0, 0, hue.width, hue.height);
      const x = h / 360 * hue.width;
      hctx.strokeStyle = '#fff';
      hctx.lineWidth = 2;
      hctx.strokeRect(Math.max(0, x - 2), 0, 4, hue.height);
    }

    function drawSquare() {
      sctx.fillStyle = `hsl(${h},100%,50%)`;
      sctx.fillRect(0, 0, square.width, square.height);
      const white = sctx.createLinearGradient(0, 0, square.width, 0);
      white.addColorStop(0, '#fff');
      white.addColorStop(1, 'rgba(255,255,255,0)');
      sctx.fillStyle = white;
      sctx.fillRect(0, 0, square.width, square.height);
      const black = sctx.createLinearGradient(0, 0, 0, square.height);
      black.addColorStop(0, 'rgba(0,0,0,0)');
      black.addColorStop(1, '#000');
      sctx.fillStyle = black;
      sctx.fillRect(0, 0, square.width, square.height);
      const x = s * square.width, y = (1 - v) * square.height;
      sctx.strokeStyle = '#fff';
      sctx.lineWidth = 2;
      sctx.beginPath();
      sctx.arc(x, y, 5, 0, Math.PI * 2);
      sctx.stroke();
    }

    function redraw() {
      drawSquare();
      drawHue();
      preview.style.background = currentHex();
    }

    function applyLive() {
      const hex = currentHex();
      pop.dataset.color = hex;
      preview.style.background = hex;
      PanelUI.applyColorToSelection(hex, false);
      dirty = true;
    }
    function closePicker(commit = true) {
      if (pop.style.display === 'none') return;
      if (!dirty && commit) {
        originalColors = null;
        active = null;
        State.colorTargetIdxs = null;
        pop.style.display = 'none';
        return;
      }
      if (!commit && originalColors) {
        originalColors.forEach(({ idx, color }) => {
          const c = State.contours[idx];
          if (!c || !c.piece) return;
          c.piece.color = color;
          c.piece.mesh.material.color.set(color);
        });
        PanelUI.refreshContourVisuals();
        PanelUI.renderList();
      } else if (commit && PanelUI.applyColorToSelection(currentHex(), true)) {
        PanelUI.refreshContourVisuals();
      }
      originalColors = null;
      active = null;
      dirty = false;
      State.colorTargetIdxs = null;
      pop.style.display = 'none';
    }
    function pickFromSquare(e) {
      const r = square.getBoundingClientRect();
      s = Utils.clamp((e.clientX - r.left) / r.width, 0, 1);
      v = 1 - Utils.clamp((e.clientY - r.top) / r.height, 0, 1);
      redraw();
      applyLive();
    }

    function pickFromHue(e) {
      const r = hue.getBoundingClientRect();
      h = Utils.clamp((e.clientX - r.left) / r.width, 0, 1) * 360;
      // La barra inferior solo cambia la gama/tono visible. No confirma ni
      // aplica color a la pieza hasta que el usuario elige un punto del cuadro.
      redraw();
    }

    function startPick(kind, e) {
      e.preventDefault();
      e.stopPropagation();
      active = kind;
      if (kind === 'square') pickFromSquare(e);
      else pickFromHue(e);
    }

    square.addEventListener('pointerdown', e => startPick('square', e));
    hue.addEventListener('pointerdown', e => startPick('hue', e));
    window.addEventListener('pointermove', e => {
      if (!active) return;
      if (active === 'square') pickFromSquare(e);
      else pickFromHue(e);
    });
    window.addEventListener('pointerup', () => {
      if (!active) return;
      if (active === 'square') closePicker(true);
      else active = null;
    });
    document.addEventListener('mousedown', e => {
      if (pop.style.display === 'none') return;
      if (!pop.contains(e.target)) closePicker(dirty);
    });
    window.addEventListener('inkora-open-color-popover', () => {
      originalColors = [...State.selectedIdxs]
        .map(idx => ({ idx, c: State.contours[idx] }))
        .filter(({ c }) => c && c.extruded && c.piece)
        .map(({ idx, c }) => ({ idx, color: c.piece.color || '#c8c8d0' }));
      if (State.colorTargetIdxs) {
        originalColors = [...State.colorTargetIdxs]
          .map(idx => ({ idx, c: State.contours[idx] }))
          .filter(({ c }) => c && c.extruded && c.piece)
          .map(({ idx, c }) => ({ idx, color: c.piece.color || '#c8c8d0' }));
      }
      const hsv = hexToHsv(pop.dataset.color || '#c8c8d0');
      h = hsv.h; s = hsv.s; v = hsv.v;
      active = null;
      dirty = false;
      redraw();
    });
    document.addEventListener('keydown', e => {
      if (pop.style.display !== 'none' && e.key === 'Escape') {
        e.preventDefault();
        closePicker(false);
      }
    });
  })();

  // Controles del modo de extrusion.
  document.querySelectorAll('.extrude-mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setExtrudeMode(btn.dataset.mode || 'separate');
    });
  });

  // Normalizar inputs decimales: acepta "," y ".".
  ['ex-depth','ex-bevel'].forEach(id => {
    const input = document.getElementById(id);
    input.addEventListener('blur', () => {
      const min = Utils.parseDecimal(input.dataset.min, -Infinity);
      const max = Utils.parseDecimal(input.dataset.max, Infinity);
      const fallback = id === 'ex-depth' ? 3 : 0;
      const v = Utils.clamp(Utils.parseDecimal(input.value, fallback), min, max);
      input.value = String(v).replace('.', ',');
      input.dispatchEvent(new Event('input'));
    });
  });

  (function(){
    const bevelInput = document.getElementById('ex-bevel');
    const bsegInput  = document.getElementById('ex-bseg');
    bevelInput.addEventListener('input', function(){
      bsegInput.disabled = Utils.parseDecimal(this.value, 0) === 0;
    });
  })();

})();
</script>
</body>
</html>
