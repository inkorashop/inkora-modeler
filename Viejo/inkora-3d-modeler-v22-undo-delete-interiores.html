    document.getElementById('h-sel').textContent=State.contours.filter((c,i)=>Utils.isVisibleContour(c)&&c.sel2D&&!c.extruded&&!isLikelyVoidHole(c,i)).length;
    document.getElementById('h-3d').textContent=State.pieces.length;
  }
  function updateButtons(){
    const has2D = State.contours.some((c,i) => c.sel2D && !c.extruded && !isLikelyVoidHole(c,i));
    const has3D = [...State.selectedIdxs].some(idx => { const c = State.contours[idx]; return c && c.extruded && c.piece; });
    document.getElementById('btn-extrude').disabled = !has2D && !has3D;
    document.getElementById('btn-export').disabled=!State.pieces.length;
    const saveProjectBtn = document.getElementById('btn-save-project');
    if (saveProjectBtn) saveProjectBtn.disabled = !State.contours.length;
    document.getElementById('btn-clear').disabled=!State.contours.length;
  }
  function updateModeBadge(){
    const badge=document.getElementById('mode-badge');
    const hint=document.getElementById('sel-hint');
    const n2D=State.contours.filter((c,i)=>Utils.isVisibleContour(c)&&c.sel2D&&!c.extruded&&!isLikelyVoidHole(c,i)).length;
    const nTotal=State.selectedIdxs.size;
    if(!State.contours.some(Utils.isVisibleContour)){badge.textContent='Sin geometría';badge.className='';hint.textContent='';return;}
    if(n2D>0){badge.textContent=`${n2D} contorno(s) seleccionado(s)`;badge.className='selecting';hint.textContent='Ajustá la profundidad en el panel y presioná Extruir';}
    else if(nTotal>0){badge.textContent=`${nTotal} pieza(s) seleccionada(s)`;badge.className='selecting';hint.textContent='';}
    else{badge.textContent='Click en silueta o lista para seleccionar';badge.className='';hint.textContent='';}
  }
  function updateColorPanel(){ /* sección eliminada — color se cambia inline en cada item */ }

  /* ── highlightRow ──────────────────────────────────────────────────────
     Se llama en cada mousemove sobre el viewport — debe ser rápida.
     En vez de querySelectorAll (busca en todo el DOM), usa dataset.idx
     para localizar directamente la fila del contorno activo.
     Guarda el índice anterior para quitar la clase solo de esa fila.
  ─────────────────────────────────────────────────────────────────────── */
  let _lastHoverIdx = -1;
  function highlightRow(hit){
    let idx = -1;
    if (hit) {
      if (hit.is3D) {
        const pIdx = State.pieces.findIndex(p => p.mesh === hit.mesh);
        if (pIdx !== -1) idx = State.contours.findIndex(c => c.piece === State.pieces[pIdx]);
      } else {
        idx = State.contours.findIndex(c => c.flatMesh === hit.mesh || c.outlineMesh === hit.mesh);
      }
    }
    if (idx === _lastHoverIdx) return; // sin cambio → no tocar el DOM

    // Quitar hover del anterior
    if (_lastHoverIdx !== -1) {
      const prev = document.querySelector(`.piece-item[data-idx="${_lastHoverIdx}"]`);
      if (prev) prev.classList.remove('vp-hover');
    }
    // Poner hover en el nuevo
    if (idx !== -1) {
      const next = document.querySelector(`.piece-item[data-idx="${idx}"]`);
      if (next) next.classList.add('vp-hover');
    }
    _lastHoverIdx = idx;
  }

  function scrollToItem(idx) {
    if (idx == null || idx < 0) return;
    const el = document.querySelector(`.piece-item[data-idx="${idx}"]`);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function selectedColorTargets() {
    const source = State.colorTargetIdxs || State.selectedIdxs;
    return [...source]
      .map(i => ({ idx: i, c: State.contours[i] }))
      .filter(({ c }) => c && c.extruded && c.piece);
  }

  function applyColorToSelection(hex, pushHistory = false) {
    const targets = selectedColorTargets();
    if (!targets.length) return false;
    targets.forEach(({ c }) => {
      c.piece.color = hex;
      c.piece.mesh.material.color.set(hex);
      c.piece.mesh.userData._highlightOrigColor = new THREE.Color(hex).getHex();
      c.piece.mesh.material.emissive?.set(0x000000);
      c.piece.mesh.material.emissiveIntensity = 0;
      if (pushHistory && c.piece.mesh.userData._selected) Viewport._applyHighlightPublic(c.piece.mesh, 'select');
    });
    renderList();
    if (pushHistory) {
      State.colorTargetIdxs = null;
      History.push(State);
    }
    return true;
  }

  function openColorPopoverAt(x, y) {
    State.colorTargetIdxs = null;
    const targets = selectedColorTargets();
    if (!targets.length) {
      Utils.toast('Seleccioná una pieza 3D para cambiar color.', 'err');
      return;
    }
    const pop = document.getElementById('color-popover');
    pop.dataset.color = targets[0].c.piece.color || '#c8c8d0';
    pop.style.display = 'block';
    const pad = 8;
    const w = pop.offsetWidth || 200;
    const h = pop.offsetHeight || 172;
    pop.style.left = `${Math.min(window.innerWidth - w - pad, Math.max(pad, x))}px`;
    pop.style.top = `${Math.min(window.innerHeight - h - pad, Math.max(pad, y))}px`;
    window.dispatchEvent(new CustomEvent('inkora-open-color-popover'));
  }

  function openColorPopoverFor(idx, x, y) {
    const targets = new Set([idx]);
    State.selectedIdxs.forEach(si => {
      const sc = State.contours[si];
      if (sc && sc.extruded && sc.piece) targets.add(si);
    });
    State.colorTargetIdxs = targets;
    const c = State.contours[idx];
    const pop = document.getElementById('color-popover');
    pop.dataset.color = c?.piece?.color || '#c8c8d0';
    pop.style.display = 'block';
    const pad = 8;
    const w = pop.offsetWidth || 200;
    const h = pop.offsetHeight || 172;
    pop.style.left = `${Math.min(window.innerWidth - w - pad, Math.max(pad, x))}px`;
    pop.style.top = `${Math.min(window.innerHeight - h - pad, Math.max(pad, y))}px`;
    window.dispatchEvent(new CustomEvent('inkora-open-color-popover'));
  }

  return {
    renderList, refreshContourVisuals, toggleSel, selectAll, selectNone,
    updateButtons, updateModeBadge, updateColorPanel, updateHUD, highlightRow,
    selectOne: _selectOne,
    clearAllSelection: _clearAllSelection,
    _syncPieceSelection,
    scrollToItem,
    applyColorToSelection, openColorPopoverAt, openColorPopoverFor,
  };
})();


/* ══════════════════════════════════════════════════════
   CONTROLADOR PRINCIPAL
   EXTENSIÓN: sistema de comandos, shortcuts, undo/redo.
   ══════════════════════════════════════════════════════ */
(function App(){
  Viewport.init();
  TransformModule.init(Viewport.getScene(), Viewport.getCamera(), document.getElementById('viewport'), Viewport.getRenderer());
  const _lastMouse = { x: Math.round(window.innerWidth / 2), y: Math.round(window.innerHeight / 2) };
  document.addEventListener('mousemove', e => {
    _lastMouse.x = e.clientX;
    _lastMouse.y = e.clientY;
  });

  function pointInPolygon(pt, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i].x, yi = poly[i].y;
      const xj = poly[j].x, yj = poly[j].y;
      const hit = ((yi > pt.y) !== (yj > pt.y)) &&
        (pt.x < (xj - xi) * (pt.y - yi) / ((yj - yi) || 1e-9) + xi);
      if (hit) inside = !inside;
    }
    return inside;
  }

  function contourArea(c) {
    const box = new THREE.Box2().setFromPoints(c.shape.getPoints(48));
    const size = box.getSize(new THREE.Vector2());
    return size.x * size.y;
  }

  function _ptSegDist2(p, a, b) {
    const vx = b.x - a.x, vy = b.y - a.y;
    const wx = p.x - a.x, wy = p.y - a.y;
    const len2 = vx * vx + vy * vy || 1e-12;
    const t = Math.max(0, Math.min(1, (wx * vx + wy * vy) / len2));
    const x = a.x + vx * t, y = a.y + vy * t;
    const dx = p.x - x, dy = p.y - y;
    return dx * dx + dy * dy;
  }

  function _shapePts(c, segs = 48) {
    const pts = c.shape.getPoints(segs);
    if (pts.length > 1 && pts[0].distanceToSquared(pts[pts.length - 1]) < 1e-12) pts.pop();
    return pts;
  }

  function contoursAreAdjacent(ca, cb) {
    if (!ca || !cb) return false;
    const aBox = new THREE.Box2().setFromPoints(ca.shape.getPoints(24));
    const bBox = new THREE.Box2().setFromPoints(cb.shape.getPoints(24));
    const aSize = aBox.getSize(new THREE.Vector2());
    const bSize = bBox.getSize(new THREE.Vector2());
    const diag = Math.max(aSize.length(), bSize.length(), 1);
    const tol = Math.max(0.03, diag * 0.002); // mm aprox.; permite bordes compartidos sin unir interiores separados
    if (aBox.max.x < bBox.min.x - tol || bBox.max.x < aBox.min.x - tol ||
        aBox.max.y < bBox.min.y - tol || bBox.max.y < aBox.min.y - tol) return false;

    const ap = _shapePts(ca, 48);
    const bp = _shapePts(cb, 48);
    if (ap.length < 2 || bp.length < 2) return false;
    const tol2 = tol * tol;
    for (let i = 0; i < ap.length; i++) {
      const p = ap[i];
      for (let j = 0; j < bp.length; j++) {
        const b0 = bp[j], b1 = bp[(j + 1) % bp.length];
        if (_ptSegDist2(p, b0, b1) <= tol2) return true;
      }
    }
    for (let i = 0; i < bp.length; i++) {
      const p = bp[i];
      for (let j = 0; j < ap.length; j++) {
        const a0 = ap[j], a1 = ap[(j + 1) % ap.length];
        if (_ptSegDist2(p, a0, a1) <= tol2) return true;
      }
    }
    return false;
  }

  function clusterMergedItems(items) {
    // Modo "Objeto unido": el usuario espera UNA sola pieza/objeto final,
    // aunque los contornos tengan colores distintos o no estén físicamente adyacentes.
    // Por eso no se separa por color ni por contacto de borde: todos los contornos
    // seleccionados se exportan como un único mesh y toman el color del primer contorno.
    //
    // Nota: contoursAreAdjacent() se conserva porque puede servir para futuras reglas
    // de unión inteligente, pero ya no decide la salida del modo unido.
    return items.length ? [items] : [];
  }

  function viewFaceForContour(c) {
    if (!c || !c.extruded || !c.piece?.mesh) return 'top';
    const camera = Viewport.getCamera?.();
    if (!camera) return 'top';
    c.piece.mesh.updateMatrixWorld(true);
    const box = getPieceRealBox(c.piece);
    if (box.isEmpty()) return 'top';
    const centerY = (box.min.y + box.max.y) / 2;
    const camPos = new THREE.Vector3();
    camera.getWorldPosition(camPos);
    return camPos.y < centerY ? 'bottom' : 'top';
  }

  function faceFromHit(hit, c) {
    if (hit?.capFace) return hit.capFace;
    if (!hit?.point || !c?.piece?.mesh) return viewFaceForContour(c);
    const piece = c.piece;
    const local = piece.mesh.worldToLocal(hit.point.clone());
    const absDepth = Math.abs(piece._depth || 0.1);
    return Math.abs(local.z) < Math.abs(local.z - absDepth) ? 'bottom' : 'top';
  }

  function selectModelExtremeFace(kind = 'front') {
    const targets = [];
    let extremeY = kind === 'back' ? Infinity : -Infinity;

    State.pieces.forEach(piece => {
      if (!piece?.mesh || piece.mesh.visible === false) return;
      const box = getPieceRealBox(piece);
      if (box.isEmpty()) return;
      const y = kind === 'back' ? box.min.y : box.max.y;
      if (kind === 'back') extremeY = Math.min(extremeY, y);
      else extremeY = Math.max(extremeY, y);
    });

    if (!Number.isFinite(extremeY)) {
      Utils.toast('No hay piezas 3D para seleccionar esa cara.', 'err');
      return;
    }

    const tol = 0.035; // mm: preciso, pero tolerante a redondeos de Three.js
    State.contours.forEach((c, idx) => {
      if (!c || c._deleted || !c.extruded || !c.piece || c.piece.mesh.visible === false) return;
      const box = getPieceRealBox(c.piece);
      if (box.isEmpty()) return;
      const face = kind === 'back' ? 'bottom' : 'top';
      const y = face === 'bottom' ? box.min.y : box.max.y;
      if (Math.abs(y - extremeY) <= tol) targets.push({ idx, face });
    });

    if (!targets.length) {
      Utils.toast('No se encontraron contornos en esa cara.', 'err');
      return;
    }

    PanelUI.clearAllSelection();
    targets.forEach(({ idx, face }) => {
      const c = State.contours[idx];
      State.selectedIdxs.add(idx);
      State.selectedFaces.set(idx, face);
      if (c && !c.extruded) c.sel2D = true;
    });
    PanelUI._syncPieceSelection && PanelUI._syncPieceSelection();
    PanelUI.refreshContourVisuals();
    PanelUI.renderList();
    PanelUI.updateModeBadge();
    PanelUI.updateColorPanel();
    Utils.toast(`${targets.length} contorno${targets.length !== 1 ? 's' : ''} seleccionado${targets.length !== 1 ? 's' : ''} en la cara ${kind === 'back' ? 'trasera' : 'frontal'}.`, 'ok', 2200);
  }

  function pickContourOnMergedPiece(hit) {
    if (hit?.contourIdx != null) return hit.contourIdx;
    const piece = State.pieces.find(p => p.mesh === hit?.mesh);
    if (!piece || !piece._mergedSourceIdxs?.length || !hit.point) return -1;
    const local = piece.mesh.worldToLocal(hit.point.clone());
    const pt = new THREE.Vector2(local.x, local.y);
    const candidates = piece._mergedSourceIdxs
      .map(idx => ({ idx, c: State.contours[idx] }))
      .filter(({ c }) => c && c.piece === piece && pointInPolygon(pt, c.shape.getPoints(96)));
    if (!candidates.length) return -1;
    candidates.sort((a, b) => contourArea(a.c) - contourArea(b.c));
    return candidates[0].idx;
  }

  function resolveSelectableContourIdxFrom3DHit(hit, cIdx) {
    // El raycast puede devolver un helper de selección perteneciente a una sub-forma
    // o a un contorno fuente. Para operaciones destructivas (Delete), la selección
    // debe apuntar al contorno/pieza REAL que se quiere borrar, no al contorno exterior
    // ni a un hole absorbido.
    if (!hit?.is3D) return cIdx;

    const direct = State.contours[cIdx];
    if (direct && Utils.isVisibleContour(direct) && direct.extruded && direct.piece) return cIdx;

    const hitPiece = State.pieces.find(p => p.mesh === hit.mesh);
    if (hitPiece) {
      const linkedVisible = State.contours.findIndex((c, i) => {
        if (!c || c._deleted || c._panelHidden || c.piece !== hitPiece) return false;
        if (i === cIdx) return true;
        if (hitPiece.contourIdx === cIdx) return true;
        if (hitPiece._sourceContourIdx === cIdx) return true;
        if (Array.isArray(hitPiece._mergedSourceIdxs) && hitPiece._mergedSourceIdxs.includes(cIdx)) return true;
        return false;
      });
      if (linkedVisible !== -1) return linkedVisible;

      const firstVisibleForHitPiece = State.contours.findIndex(c =>
        c && !c._deleted && !c._panelHidden && c.piece === hitPiece
      );
      if (firstVisibleForHitPiece !== -1) return firstVisibleForHitPiece;
    }

    const pieceBySource = State.pieces.find(p =>
      p && (
        p.contourIdx === cIdx ||
        p._sourceContourIdx === cIdx ||
        (Array.isArray(p._mergedSourceIdxs) && p._mergedSourceIdxs.includes(cIdx))
      )
    );
    if (pieceBySource) {
      const idx = State.contours.findIndex(c => c && !c._deleted && !c._panelHidden && c.piece === pieceBySource);
      if (idx !== -1) return idx;
      if (State.contours[pieceBySource.contourIdx]) return pieceBySource.contourIdx;
    }

    return cIdx;
  }

  function disposeHelperObject(obj) {
    obj.geometry?.dispose?.();
    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose?.());
    else obj.material?.dispose?.();
  }

  function clearPickHelpers(mesh) {
    const helpers = [];
    mesh.traverse(o => {
      if (o !== mesh && o.userData?._pickHelper) helpers.push(o);
    });
    helpers.forEach(o => {
      o.parent?.remove(o);
      disposeHelperObject(o);
    });
  }

  function addMergedContourPickLines(mesh, items, depth) {
    // IMPORTANTE: estos helpers son SOLO para selección/visualización.
    // No participan en el cálculo físico de la re-extrusión ni en exportación.
    // getRealMeshBox() ignora hijos, por eso estos offsets visuales no pueden
    // generar aire entre una pieza base y una re-extrusión.
    clearPickHelpers(mesh);
    const absDepth = Math.abs(depth) || 0.1;
    const visualEps = 0.006;

    const areaMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0,
      colorWrite: false,
      depthTest: false,
      depthWrite: false,
      side: THREE.DoubleSide,
    });

    const lineMat = new THREE.LineBasicMaterial({
      color: 0x222222,
      transparent: true,
      opacity: 0.96,
      depthTest: true,
      depthWrite: false,
    });

    function shapeArea(shape) {
      const box = new THREE.Box2().setFromPoints(shape.getPoints(48));
      const size = box.getSize(new THREE.Vector2());
      return size.x * size.y;
    }

    function addArea(shape, z, idx, face, area) {
      const g = new THREE.ShapeGeometry(shape);
      g.translate(0, 0, z);
      const areaMesh = new THREE.Mesh(g, areaMat.clone());
      areaMesh.visible = true; // debe estar visible para raycast aunque no escriba color
      areaMesh.renderOrder = 9999;
      areaMesh.userData._pickHelper = true;
      areaMesh.userData._pickContourIdx = idx;
      areaMesh.userData._pickMesh = mesh;
      areaMesh.userData._pickFace = face;
      areaMesh.userData._pickArea = area;
      areaMesh.userData._pickKind = 'cap';
      mesh.add(areaMesh);
    }

    function addLine(points, z, idx, face, area) {
      if (!points.length) return;
      const verts = [];
      points.forEach(p => verts.push(p.x, p.y, z));
      verts.push(points[0].x, points[0].y, z);
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      const line = new THREE.Line(g, lineMat.clone());
      line.renderOrder = 10000;
      line.userData._pickHelper = true;
      line.userData._visualPickLine = true;
      line.userData._pickContourIdx = idx;
      line.userData._pickMesh = mesh;
      line.userData._pickFace = face;
      line.userData._pickArea = area;
      line.userData._pickKind = 'line';
      mesh.add(line);
    }

    items.forEach(item => {
      const shape = item.pickShape || item.compositeShape || item.c.shape;
      if (!shape) return;
      const area = shapeArea(shape);
      const pts = shape.getPoints(128);

      // Áreas invisibles EXACTAS sobre las tapas reales para que el click sea cómodo.
      addArea(shape, absDepth, item.cIdx, 'top', area);
      addArea(shape, 0, item.cIdx, 'bottom', area);

      // Líneas visibles limpias, una por contorno/cara, con offset visual mínimo.
      // Sirven como guía para seleccionar y volver a extruir objetos fusionados.
      addLine(pts, absDepth + visualEps, item.cIdx, 'top', area);
      addLine(pts, -visualEps, item.cIdx, 'bottom', area);
    });
  }

  function setExtrudeMode(mode, notify = false) {
    State.extrudeMode = mode === 'merged' ? 'merged' : 'separate';
    document.querySelectorAll('.extrude-mode-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === State.extrudeMode);
    });
    if (notify) {
      Utils.toast(State.extrudeMode === 'merged' ? 'Extrusión: objeto unido.' : 'Extrusión: objetos separados.', 'ok', 1400);
    }
  }

  /* ── History UI ─────────────────────────────────────── */
  const btnUndo  = document.getElementById('btn-undo');
  const btnRedo  = document.getElementById('btn-redo');
  const histLabel= document.getElementById('history-label');

  function updateHistoryUI() {
    btnUndo.disabled  = !History.canUndo();
    btnRedo.disabled  = !History.canRedo();
    histLabel.textContent = History.label();
  }
  History.onChange(updateHistoryUI);

  /* ── restoreSnapshot ─────────────────────────────────
     Reconstruye la escena completa desde un snapshot.
     Borra todo, luego re-crea flatMesh, outlineMesh y
     meshes 3D extruidos según los datos guardados.
  ──────────────────────────────────────────────────────── */
  function restoreSnapshot(snap) {
    if (!snap) return;
    TransformModule.deselect(); TransformModule.hidePanel();
    Viewport.clearAll();
    State.reset();
    GeoModule.resetCounter();
    State.filename = snap.filename;

    const NEUTRAL_COLOR = '#44445a';
    const pieceByContourIdx = new Map();
    function shapeWithSnapshotHoles(srcIdx, pd = {}) {
      const src = snap.contours[srcIdx];
      const sh = makeShapeCCW(src.shape);

      // v16: restauración robusta de huecos.
      // Antes solo se usaba pieceData.holeIdxs. Si un proyecto venía de una
      // versión anterior, o si un hole no quedó registrado ahí, podía abrirse
      // relleno (ej.: el interior del 0). Ahora también se reconstruyen los
      // huecos directos desde la jerarquía parentIdx/depth del proyecto.
      const holeSet = new Set(pd.holeIdxs || []);
      const usedHoleKeys = new Set();
      function holeKey(pathLike) {
        try {
          return _stripClosingPoint(pathLike.getPoints(64))
            .map(p => `${Math.round(p.x * 1000)},${Math.round(p.y * 1000)}`)
            .join('|');
        } catch (_) { return ''; }
      }
      function addHoleOnce(pathLike) {
        const key = holeKey(pathLike);
        if (key && usedHoleKeys.has(key)) return;
        if (key) usedHoleKeys.add(key);
        try { sh.holes.push(makeHoleCW(pathLike)); } catch (_) {}
      }

      // Preservar holes embebidos en el propio Shape serializado, si existen.
      (src.shape.holes || []).forEach(addHoleOnce);

      snap.contours.forEach((candidate, hIdx) => {
        if (!candidate || hIdx === srcIdx) return;
        if (candidate.parentIdx !== srcIdx) return;
        if (src.depth != null && candidate.depth != null && candidate.depth !== src.depth + 1) return;
        // Si fue absorbido como vacío, pertenece a la pieza, o fue enlazado a
        // esta pieza, debe perforar el shape fuente al reconstruir.
        if (candidate.absorbed || candidate.extruded || candidate.linkedPieceIdx != null || candidate.pieceData || holeSet.has(hIdx)) {
          holeSet.add(hIdx);
        }
      });

      holeSet.forEach(hIdx => {
        const hContour = snap.contours[hIdx];
        if (hContour && hContour.parentIdx === srcIdx) addHoleOnce(hContour.shape);
      });
      return sh;
    }

    function restoredPieceColor(sc, pd) {
      const pieceColor = normalizeProjectHexColor(pd?.color, null);
      const sourceColor = normalizeProjectHexColor(sc?.color, null);
      // Reparación conservadora para proyectos guardados en v15 donde alguna
      // pieza blanca podía volver como negra al reabrir. Si el contorno fuente
      // dice blanco explícito y el pieceData vino negro, se prioriza el blanco.
      if (pieceColor === '#000000' && sourceColor === '#ffffff' && sc?.hasExplicitColor) return sourceColor;
      return pieceColor || sourceColor || '#c8c8d0';
    }

    snap.contours.forEach((sc, i) => {
      // Contornos ficticios (de extrusión 3D sobre 3D): no tienen mesh 2D propio
      if (sc.isFakeContour) {
        const contour = {
          shape: sc.shape, offX: sc.offX, offY: sc.offY,
          depth: sc.depth, parentIdx: sc.parentIdx,
          layer: sc.layer || '0', color: sc.color || '#dedcff',
          colorSource: sc.colorSource || 'default',
          hasEntityColor: !!sc.hasEntityColor,
          hasExplicitColor: !!sc.hasExplicitColor,
          flatMesh: null, outlineMesh: null,
          sel2D: false, extruded: true, piece: null,
          depthOverride: sc.depthOverride ?? null,
          _isFakeContour: true,
          _panelHidden: !!sc.panelHidden,
          _deleted: !!sc.deleted,
        };
        State.contours.push(contour);

        if (sc.pieceData) {
          const pd = sc.pieceData;
          const pieceColor = restoredPieceColor(sc, pd);
          const sourceIdxs = pd.mergedSourceIdxs && pd.mergedSourceIdxs.length ? pd.mergedSourceIdxs : [i];
          const compositeShape = shapeWithSnapshotHoles(sourceIdxs[0], pd);
          const mergedExtraShapes = sourceIdxs.slice(1).map(srcIdx => shapeWithSnapshotHoles(srcIdx, pd));
          const mesh = GeoModule.extrude(compositeShape, sc.offX, sc.offY, {
            depth: pd.depth, bevel: pd.bevel, bevelSeg: pd.bevelSeg, color: pieceColor,
            extraShapes: mergedExtraShapes,
            addOutlines: sourceIdxs.length <= 1,
          });
          restoreExactMeshGeometry(mesh, pd.meshData, pieceColor);
          addMergedContourPickLines(mesh, sourceIdxs.map(srcIdx => ({
            cIdx: srcIdx,
            c: { shape: snap.contours[srcIdx].shape },
            pickShape: shapeWithSnapshotHoles(srcIdx, pd),
          })), pd.depth);
          // Restaurar posición base (encima de la pieza original)
          mesh.position.x = pd.baseX !== undefined ? pd.baseX : mesh.position.x;
          mesh.position.y = pd.baseY !== undefined ? pd.baseY : mesh.position.y;
          mesh.position.z = pd.baseZ !== undefined ? pd.baseZ : mesh.position.z;
          Viewport.add3D(mesh);
          const piece = {
            mesh, name: pd.name, color: pieceColor,
            contourIdx: i,
            _depth: pd.depth, _bevel: pd.bevel, _bevelSeg: pd.bevelSeg,
            _holeIdxs: pd.holeIdxs || [],
            _mergedSourceIdxs: pd.mergedSourceIdxs || [],
            _sourceContourIdx: pd.sourceContourIdx ?? null,
            tx: pd.tx || 0, ty: pd.ty || 0, tz: pd.tz || 0,
            rotY: pd.rotY || 0, scale: pd.scale || 1,
            _baseX: pd.baseX !== undefined ? pd.baseX : mesh.position.x,
            _baseY: pd.baseY !== undefined ? pd.baseY : mesh.position.y,
            _baseZ: pd.baseZ !== undefined ? pd.baseZ : mesh.position.z,
          };
          State.pieces.push(piece);
          pieceByContourIdx.set(i, piece);
          contour.piece = piece;
          TransformModule.restoreTransform(mesh, piece);
          mesh.visible = pd.visible !== false;
        }
        return;
      }

      // Color del flatMesh: si está extruido usamos el color de la pieza guardado,
      // si no, el color neutral estándar (igual que PanelUI.refreshContourVisuals)
      const flatColor = sc.color || (sc.extruded && sc.pieceData ? sc.pieceData.color : NEUTRAL_COLOR);
      const flatMesh    = GeoModule.makeFlat(sc.shape, sc.offX, sc.offY, flatColor);
      const outlineMesh = GeoModule.makeOutline(sc.shape, sc.offX, sc.offY, flatColor);
      Viewport.add2D(flatMesh);
      Viewport.add2D(outlineMesh);

      const contour = {
        shape: sc.shape, offX: sc.offX, offY: sc.offY,
        depth: sc.depth, parentIdx: sc.parentIdx,
        layer: sc.layer || '0', color: sc.color || '#dedcff',
        colorSource: sc.colorSource || 'default',
        hasEntityColor: !!sc.hasEntityColor,
        hasExplicitColor: !!sc.hasExplicitColor,
        flatMesh, outlineMesh,
        sel2D: sc.sel2D, extruded: sc.extruded, piece: null,
        depthOverride: sc.depthOverride ?? null,
        _panelHidden: !!sc.panelHidden,
        _deleted: !!sc.deleted,
      };
      State.contours.push(contour);

      if (sc.extruded && sc.pieceData) {
        const pd = sc.pieceData;
        const pieceColor = restoredPieceColor(sc, pd);
        // Reconstruir compositeShape con los mismos holes que al extruir originalmente
        const sourceIdxs = pd.mergedSourceIdxs && pd.mergedSourceIdxs.length ? pd.mergedSourceIdxs : [i];
        const compositeShape = shapeWithSnapshotHoles(sourceIdxs[0], pd);
        const mergedExtraShapes = sourceIdxs.slice(1).map(srcIdx => shapeWithSnapshotHoles(srcIdx, pd));
        const mesh = GeoModule.extrude(compositeShape, sc.offX, sc.offY, {
          depth: pd.depth, bevel: pd.bevel, bevelSeg: pd.bevelSeg, color: pieceColor,
          extraShapes: mergedExtraShapes,
          addOutlines: sourceIdxs.length <= 1,
        });
        restoreExactMeshGeometry(mesh, pd.meshData, pieceColor);
        addMergedContourPickLines(mesh, sourceIdxs.map(srcIdx => ({
          cIdx: srcIdx,
          c: { shape: snap.contours[srcIdx].shape },
          pickShape: shapeWithSnapshotHoles(srcIdx, pd),
        })), pd.depth);
        Viewport.add3D(mesh);
        const piece = {
          mesh, name: pd.name, color: pieceColor,
          contourIdx: i,
          _depth: pd.depth, _bevel: pd.bevel, _bevelSeg: pd.bevelSeg,
          _holeIdxs: pd.holeIdxs || [],
          _mergedSourceIdxs: pd.mergedSourceIdxs || [],
          _sourceContourIdx: pd.sourceContourIdx ?? null,
          // Restaurar transform guardado en snapshot
          tx: pd.tx || 0, ty: pd.ty || 0, tz: pd.tz || 0,
          rotY: pd.rotY || 0, scale: pd.scale || 1,
          // Posición base restaurada del snapshot (posición sin transform del usuario)
          _baseX: pd.baseX !== undefined ? pd.baseX : mesh.position.x,
          _baseY: pd.baseY !== undefined ? pd.baseY : mesh.position.y,
          _baseZ: pd.baseZ !== undefined ? pd.baseZ : mesh.position.z,
        };
        State.pieces.push(piece);
        pieceByContourIdx.set(i, piece);
        contour.piece = piece;
        // _baseX/_baseZ = posición que asignó GeoModule (antes de cualquier offset del usuario)
        TransformModule.restoreTransform(mesh, piece);
        mesh.visible = pd.visible !== false;
      } else if (sc.absorbed) {
        // Contorno absorbido como hueco de otra pieza: no genera mesh propio.
        contour.extruded = true;
        contour.piece    = null;
      }
    });

    snap.contours.forEach((sc, i) => {
      if (sc.linkedPieceIdx == null) return;
      const contour = State.contours[i];
      const piece = pieceByContourIdx.get(sc.linkedPieceIdx);
      if (!contour || !piece) return;
      contour.extruded = true;
      contour.sel2D = false;
      contour.piece = piece;
      contour._panelHidden = !!sc.panelHidden;
      if (contour.flatMesh) contour.flatMesh.visible = false;
      if (contour.outlineMesh) contour.outlineMesh.visible = false;
    });

    State.selectedPieceIdx = null;
    State.selectedIdxs = new Set();
    State.selectedFaces = new Map();
    State.groups = snap.groups ? snap.groups.map(g => ({ ...g, memberIdxs: [...g.memberIdxs] })) : [];
    State._nextGroupId = snap._nextGroupId || 1;
    if (snap.panel) {
      if (document.getElementById('ex-depth')) document.getElementById('ex-depth').value = snap.panel.depth ?? document.getElementById('ex-depth').value;
      if (document.getElementById('ex-bevel')) document.getElementById('ex-bevel').value = snap.panel.bevel ?? document.getElementById('ex-bevel').value;
      if (document.getElementById('ex-bseg')) document.getElementById('ex-bseg').value = snap.panel.bevelSeg ?? document.getElementById('ex-bseg').value;
    }
    if (snap.extrudeMode) setExtrudeMode(snap.extrudeMode, false);
    // No restaurar cámara desde restoreSnapshot().
    // Motivo: Ctrl+Z / Ctrl+Shift+Z deben deshacer la operación del modelo,
    // no mover la vista del usuario. La vista guardada se sigue usando al abrir
    // proyectos mediante loadSnapshotIntoState().
    PanelUI.refreshContourVisuals();
    PanelUI.renderList();
    PanelUI.updateModeBadge();
    PanelUI.updateButtons();
    PanelUI.updateColorPanel();
  }

  btnUndo.addEventListener('click', () => {
    const snap = History.undo();
    if (snap) { restoreSnapshot(snap); ProjectTabs.syncActiveFromState(); Utils.toast('Deshecho.'); }
  });
  btnRedo.addEventListener('click', () => {
    const snap = History.redo();
    if (snap) { restoreSnapshot(snap); ProjectTabs.syncActiveFromState(); Utils.toast('Rehecho.'); }
  });

  /* ══════════════════════════════════════════════════════
     GUARDAR / ABRIR PROYECTO LOCAL (.inkora3d)
     Guarda el estado lógico completo: contornos, piezas 3D,
     colores, nombres, profundidades, grupos y transformaciones.
     ══════════════════════════════════════════════════════ */
  function _stripClosingPoint(points) {
    const out = points.map(p => ({ x: +p.x, y: +p.y }));
    if (out.length > 1) {
      const a = out[0], b = out[out.length - 1];
      if (Math.abs(a.x - b.x) < 1e-8 && Math.abs(a.y - b.y) < 1e-8) out.pop();
    }
    return out;
  }

  function serializePathLike(pathLike) {
    return _stripClosingPoint(pathLike.getPoints(96));
  }

  function serializeShape(shape) {
    return {
      kind: 'polygon-v1',
      points: serializePathLike(shape),
      holes: (shape.holes || []).map(h => serializePathLike(h)),
    };
  }

  function pathFromPoints(points, asShape = false) {
    const pts = (points || []).filter(p => Number.isFinite(+p.x) && Number.isFinite(+p.y));
    const path = asShape ? new THREE.Shape() : new THREE.Path();
    if (!pts.length) return path;
    path.moveTo(+pts[0].x, +pts[0].y);
    for (let i = 1; i < pts.length; i++) path.lineTo(+pts[i].x, +pts[i].y);
    path.closePath();
    path.autoClose = true;
    return path;
  }

  function deserializeShape(data) {
    if (!data || !Array.isArray(data.points) || data.points.length < 3) {
      throw new Error('El proyecto contiene un contorno inválido.');
    }
    const shape = pathFromPoints(data.points, true);
    (data.holes || []).forEach(holePts => {
      if (Array.isArray(holePts) && holePts.length >= 3) shape.holes.push(pathFromPoints(holePts, false));
    });
    return shape;
  }

  function normalizeProjectHexColor(hex, fallback = null) {
    const raw = String(hex || '').trim();
    const s = raw.startsWith('#') ? raw.slice(1) : raw;
    if (/^[0-9a-f]{6}$/i.test(s)) return `#${s.toLowerCase()}`;
    return fallback;
  }

  function stablePieceColor(piece, contour = null) {
    // Prioridad: color lógico de la pieza. Si por alguna interacción visual el
    // material quedó temporalmente resaltado/oscurecido, no usamos ese color como fuente.
    const logical = normalizeProjectHexColor(piece?.color);
    if (logical) return logical;

    if (piece?.mesh?.userData?._highlightOrigColor != null) {
      return '#' + Number(piece.mesh.userData._highlightOrigColor).toString(16).padStart(6, '0');
    }
    const contourColor = normalizeProjectHexColor(contour?.color);
    if (contourColor) return contourColor;
    if (piece?.mesh?.material?.color) return '#' + piece.mesh.material.color.getHexString();
    return '#c8c8d0';
  }

  function _numArrayFromAttribute(attr) {
    if (!attr || !attr.array) return null;
    return Array.from(attr.array, v => +Number(v).toFixed(6));
  }

  function serializePieceMesh(piece, color = null) {
    // v17: el archivo de proyecto guarda la malla final real de cada pieza.
    // Al abrir, esta geometría es la fuente de verdad: no se reinterpreta el DXF
    // ni se recalculan huecos/colores para reconstruir algo parecido.
    const mesh = piece?.mesh;
    const geo = mesh?.geometry;
    const pos = geo?.attributes?.position;
    if (!mesh || !geo || !pos || !pos.array || pos.count < 3) return null;
    const normal = geo.attributes?.normal ? _numArrayFromAttribute(geo.attributes.normal) : null;
    return {
      kind: 'buffer-geometry-v1',
      position: _numArrayFromAttribute(pos),
      normal,
      index: geo.index ? Array.from(geo.index.array) : null,
      transform: {
        position: mesh.position.toArray().map(v => +Number(v).toFixed(6)),
        rotation: [mesh.rotation.x, mesh.rotation.y, mesh.rotation.z].map(v => +Number(v).toFixed(9)),
        scale: mesh.scale.toArray().map(v => +Number(v).toFixed(6)),
      },
      material: {
        color: normalizeProjectHexColor(color, stablePieceColor(piece)),
      },
      visible: mesh.visible !== false,
    };
  }

  function restoreExactMeshGeometry(mesh, meshData, color = '#c8c8d0') {
    if (!meshData || meshData.kind !== 'buffer-geometry-v1') return false;
    if (!Array.isArray(meshData.position) || meshData.position.length < 9 || meshData.position.length % 3 !== 0) return false;
    try {
      const oldGeo = mesh.geometry;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(meshData.position, 3));
      if (Array.isArray(meshData.index) && meshData.index.length >= 3) geo.setIndex(meshData.index);
      if (Array.isArray(meshData.normal) && meshData.normal.length === meshData.position.length) {
        geo.setAttribute('normal', new THREE.Float32BufferAttribute(meshData.normal, 3));
      } else {
        geo.computeVertexNormals();
      }
      geo.computeBoundingBox();
      geo.computeBoundingSphere();
      mesh.geometry = geo;
      oldGeo?.dispose?.();

      const savedColor = normalizeProjectHexColor(color, normalizeProjectHexColor(meshData.material?.color, '#c8c8d0'));
      if (mesh.material?.color) mesh.material.color.set(savedColor);
      if (mesh.material) {
        mesh.material.emissive?.set(0x000000);
        mesh.material.emissiveIntensity = 0;
        mesh.material.needsUpdate = true;
      }

      const tr = meshData.transform || {};
      if (Array.isArray(tr.rotation) && tr.rotation.length >= 3) {
        mesh.rotation.x = +tr.rotation[0] || mesh.rotation.x;
        mesh.rotation.z = +tr.rotation[2] || 0;
      }
      if (Array.isArray(tr.position) && tr.position.length >= 3) {
        mesh.position.set(+tr.position[0] || 0, +tr.position[1] || 0, +tr.position[2] || 0);
      }
      if (Array.isArray(tr.scale) && tr.scale.length >= 3) {
        mesh.scale.set(+tr.scale[0] || 1, +tr.scale[1] || 1, +tr.scale[2] || 1);
      }
      mesh.visible = meshData.visible !== false;
      return true;
    } catch (err) {
      console.warn('No se pudo restaurar la malla exacta guardada; se usará reconstrucción lógica.', err);
      return false;
    }
  }

  function buildProjectSnapshot() {
    return {
      filename: State.filename,
      groups: State.groups.map(g => ({ ...g, memberIdxs: [...g.memberIdxs] })),
      _nextGroupId: State._nextGroupId,
      extrudeMode: State.extrudeMode,
      panel: {
        depth: document.getElementById('ex-depth')?.value ?? '3',
        bevel: document.getElementById('ex-bevel')?.value ?? '0',
        bevelSeg: document.getElementById('ex-bseg')?.value ?? '3',
      },
      view: Viewport.getViewState ? Viewport.getViewState() : null,
      contours: State.contours.map((c, idx) => ({
        shape: serializeShape(c.shape),
        offX: c.offX,
        offY: c.offY,
        depth: c.depth,
        parentIdx: c.parentIdx,
        layer: c.layer || '0',
        color: normalizeProjectHexColor(c.color, '#dedcff'),
        colorSource: c.colorSource || 'default',
        hasEntityColor: !!c.hasEntityColor,
        hasExplicitColor: !!c.hasExplicitColor,
        sel2D: false,
        extruded: !!c.extruded,
        depthOverride: c.depthOverride ?? null,
        absorbed: c.extruded && c.piece === null && !c._isFakeContour,
        isFakeContour: !!c._isFakeContour,
        panelHidden: !!c._panelHidden,
        deleted: !!c._deleted,
        linkedPieceIdx: c.piece && c.piece.contourIdx !== idx ? c.piece.contourIdx : null,
        pieceData: c.piece && c.piece.contourIdx === idx ? {
          name: c.piece.name,
          color: stablePieceColor(c.piece, c),
          meshData: serializePieceMesh(c.piece, stablePieceColor(c.piece, c)),
          depth: c.piece._depth,
          bevel: c.piece._bevel,
          bevelSeg: c.piece._bevelSeg,
          holeIdxs: c.piece._holeIdxs || [],
          mergedSourceIdxs: c.piece._mergedSourceIdxs || [],
          sourceContourIdx: c.piece._sourceContourIdx ?? null,
          visible: c.piece.mesh ? c.piece.mesh.visible !== false : true,
          tx: c.piece.tx || 0,
          ty: c.piece.ty || 0,
          tz: c.piece.tz || 0,
          rotY: c.piece.rotY || 0,
          scale: c.piece.scale || 1,
          baseX: c.piece._baseX || 0,
          baseY: c.piece._baseY || 0,
          baseZ: c.piece._baseZ || 0,
        } : null,
      })),
    };
  }

  function hydrateProjectSnapshot(rawSnap) {
    if (!rawSnap || !Array.isArray(rawSnap.contours)) throw new Error('Formato de proyecto inválido.');
    const snap = {
      filename: rawSnap.filename || 'inkora-project',
      groups: Array.isArray(rawSnap.groups) ? rawSnap.groups.map(g => ({ ...g, memberIdxs: [...(g.memberIdxs || [])] })) : [],
      _nextGroupId: rawSnap._nextGroupId || 1,
      extrudeMode: rawSnap.extrudeMode || 'separate',
      panel: rawSnap.panel || null,
      view: rawSnap.view || null,
      contours: rawSnap.contours.map(sc => ({ ...sc, shape: deserializeShape(sc.shape) })),
    };
    return snap;
  }

  function sanitizeLocalFileName(name, ext) {
    let clean = String(name || 'inkora-project')
      .replace(/\.[^.]+$/i, '')
      .replace(/[\\/:*?"<>|]+/g, '-')
      .replace(/\s+/g, ' ')
      .trim();
    if (!clean) clean = 'inkora-project';
    return `${clean}${ext}`;
  }

  function projectTitleFromName(name) {
    const base = String(name || 'Sin título').replace(/\.(inkora3d|json|dxf)$/i, '').trim();
    return base || 'Sin título';
  }

  async function verifyFileHandlePermission(handle, mode = 'read') {
    if (!handle || !handle.queryPermission) return true;
    const opts = { mode };
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    if (!handle.requestPermission) return false;
    return (await handle.requestPermission(opts)) === 'granted';
  }

  async function writeBlobToHandle(handle, blob) {
    if (!handle) throw new Error('No hay archivo asociado.');
    const ok = await verifyFileHandlePermission(handle, 'readwrite');
    if (!ok) throw new Error('Permiso denegado para escribir el archivo.');
    const writable = await handle.createWritable();
    await writable.write(blob);
    await writable.close();
  }

  async function saveLocalBlob(blob, suggestedName, ext, mime, description, existingHandle = null) {
    const safeName = sanitizeLocalFileName(suggestedName, ext);

    if (existingHandle) {
      try {
        await writeBlobToHandle(existingHandle, blob);
        return existingHandle;
      } catch (err) {
        console.warn('No se pudo sobrescribir el proyecto asociado, se pedirá nueva ubicación.', err);
      }
    }

    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: safeName,
          types: [{ description, accept: { [mime]: [ext] } }],
        });
        await writeBlobToHandle(handle, blob);
        return handle;
      } catch (err) {
        if (err && err.name === 'AbortError') throw new Error('Guardado cancelado.');
        console.warn('No se pudo usar el selector de guardado, usando descarga normal.', err);
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = safeName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return null;
  }

  async function saveProject() {
    if (!State.contours.length) { Utils.toast('No hay proyecto para guardar.', 'err'); return; }
    const payload = {
      app: 'INKORA 3D Modeler',
      format: 'inkora3d-project',
      formatVersion: 3,
      savedAt: new Date().toISOString(),
      snapshot: buildProjectSnapshot(),
    };
    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json;charset=utf-8' });
    const activeTab = ProjectTabs.getActiveTab();
    const handle = await saveLocalBlob(
      blob,
      State.filename || activeTab?.name || 'inkora-project',
      '.inkora3d',
      'application/json',
      'Proyecto INKORA 3D',
      activeTab?.fileHandle || null
    );

    let recentId = activeTab?.recentId || null;
    if (handle) {
      State.filename = projectTitleFromName(handle.name);
      recentId = await RecentProjects.upsertHandle(handle, handle.name);
      ProjectTabs.attachFileHandle(handle, recentId, State.filename);
    }
    ProjectTabs.syncActiveFromState();
  }

  function loadSnapshotIntoState(snap) {
    History.clear();
    restoreSnapshot(snap);
    State.filename = snap.filename || State.filename || 'inkora-project';
    if (snap.extrudeMode) setExtrudeMode(snap.extrudeMode, false);
    History.push(State);
    if (snap.view && Viewport.setViewState && Viewport.setViewState(snap.view)) {
      // Vista restaurada desde el proyecto.
    } else {
      Viewport.focusAll();
    }
  }

  async function loadProjectFile(file, fileHandle = null) {
    Utils.toast('Abriendo proyecto…', '', 60000);
    const text = await file.text();
    const data = JSON.parse(text);
    const rawSnap = data.snapshot || data;
    const snap = hydrateProjectSnapshot(rawSnap);
    snap.filename = projectTitleFromName(snap.filename || file.name);
    let recentId = null;
    if (fileHandle) recentId = await RecentProjects.upsertHandle(fileHandle, file.name);
    ProjectTabs.openProjectSnapshot(snap, { fileHandle, recentId, name: snap.filename });
    Utils.toast('Proyecto abierto correctamente.', 'ok');
  }

  async function openProjectWithPicker() {
    if (window.showOpenFilePicker) {
      try {
        const [handle] = await window.showOpenFilePicker({
          multiple: false,
          types: [{ description: 'Proyecto INKORA 3D', accept: { 'application/json': ['.inkora3d', '.json'] } }],
        });
        if (!handle) return;
        const file = await handle.getFile();
        await loadProjectFile(file, handle);
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
        console.warn('No se pudo usar el selector avanzado, usando input normal.', err);
      }
    }
    document.getElementById('project-input').click();
  }

  const RecentProjects = (() => {
    const DB_NAME = 'inkora_3d_recent_projects_v1';
    const STORE = 'projects';
    const MAX_ITEMS = 200;
    let dbPromise = null;

    function db() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const database = req.result;
          if (!database.objectStoreNames.contains(STORE)) database.createObjectStore(STORE, { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('No se pudo abrir IndexedDB.'));
      });
      return dbPromise;
    }

    async function listRaw() {
      try {
        const database = await db();
        return await new Promise((resolve, reject) => {
          const req = database.transaction(STORE, 'readonly').objectStore(STORE).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error || new Error('No se pudieron leer recientes.'));
        });
      } catch (err) {
        console.warn('No se pudieron leer recientes.', err);
        return [];
      }
    }

    async function putRaw(rec) {
      try {
        const database = await db();
        await new Promise((resolve, reject) => {
          const req = database.transaction(STORE, 'readwrite').objectStore(STORE).put(rec);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error || new Error('No se pudo guardar reciente.'));
        });
      } catch (err) { console.warn('No se pudo guardar reciente.', err); }
    }

    async function deleteRaw(id) {
      try {
        const database = await db();
        await new Promise((resolve, reject) => {
          const req = database.transaction(STORE, 'readwrite').objectStore(STORE).delete(id);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error || new Error('No se pudo borrar reciente.'));
        });
      } catch (err) { console.warn('No se pudo borrar reciente.', err); }
    }

    async function prune() {
      const all = (await listRaw()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      for (const rec of all.slice(MAX_ITEMS)) await deleteRaw(rec.id);
    }

    async function upsertHandle(handle, name) {
      if (!handle) return null;
      try {
        const all = await listRaw();
        let existing = null;
        for (const rec of all) {
          try {
            if (rec.handle && handle.isSameEntry && await handle.isSameEntry(rec.handle)) { existing = rec; break; }
          } catch (_) {}
        }
        const id = existing?.id || (crypto.randomUUID ? crypto.randomUUID() : `recent-${Date.now()}-${Math.random().toString(16).slice(2)}`);
        const rec = { id, name: name || handle.name || 'Proyecto INKORA 3D', updatedAt: Date.now(), handle };
        await putRaw(rec);
        await prune();
        await render();
        return id;
      } catch (err) {
        console.warn('No se pudo agregar a recientes. El navegador quizás no permite guardar accesos a archivos locales.', err);
        return null;
      }
    }

    async function openRecent(id) {
      const all = await listRaw();
      const rec = all.find(r => r.id === id);
      if (!rec?.handle) throw new Error('El proyecto reciente ya no tiene acceso local guardado.');
      const ok = await verifyFileHandlePermission(rec.handle, 'read');
      if (!ok) throw new Error('Permiso denegado para abrir el proyecto reciente.');
      const file = await rec.handle.getFile();
      rec.updatedAt = Date.now();
      await putRaw(rec);
      await loadProjectFile(file, rec.handle);
      await render();
      closePanel();
    }

    function formatDate(ts) {
      if (!ts) return '';
      try { return new Date(ts).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }); }
      catch (_) { return ''; }
    }

    async function render() {
      const listEl = document.getElementById('recent-list');
      if (!listEl) return;
      const all = (await listRaw()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      listEl.innerHTML = '';
      if (!all.length) {
        listEl.innerHTML = '<div class="recent-empty">Sin proyectos recientes todavía.<br>Cuando abras o guardes un .inkora3d aparecerá acá.</div>';
        return;
      }
      all.forEach(rec => {
        const item = document.createElement('div');
        item.className = 'recent-item';
        item.dataset.id = rec.id;
        const main = document.createElement('div');
        main.className = 'recent-main';
        const name = document.createElement('div');
        name.className = 'recent-name';
        name.textContent = rec.name || 'Proyecto INKORA 3D';
        const meta = document.createElement('div');
        meta.className = 'recent-meta';
        meta.textContent = formatDate(rec.updatedAt) || 'reciente';
        const rm = document.createElement('button');
        rm.className = 'recent-remove';
        rm.title = 'Quitar de recientes';
        rm.textContent = '×';
        main.append(name, meta);
        item.append(main, rm);
        item.addEventListener('click', async e => {
          if (e.target === rm) return;
          try { await openRecent(rec.id); }
          catch (err) { Utils.toast('No se pudo abrir reciente: ' + err.message, 'err'); console.error(err); }
        });
        rm.addEventListener('click', async e => {
          e.stopPropagation();
          await deleteRaw(rec.id);
          await render();
        });
        listEl.appendChild(item);
      });
    }

    function openPanel() { document.getElementById('recent-panel')?.classList.add('open'); render(); }
    function closePanel() { document.getElementById('recent-panel')?.classList.remove('open'); }
    function togglePanel() {
      const p = document.getElementById('recent-panel');
      if (!p) return;
      if (p.classList.contains('open')) closePanel(); else openPanel();
    }

    return { upsertHandle, render, togglePanel, closePanel, openRecent };
  })();

  const ProjectTabs = (() => {
    const tabs = [];
    let activeId = null;
    let seq = 1;

    function newId() { return `project-tab-${seq++}`; }
    function activeTab() { return tabs.find(t => t.id === activeId) || null; }
    function cleanTitle(name) { return projectTitleFromName(name || 'Sin título'); }
    function currentIsBlank() { return !State.contours.length && !State.pieces.length; }

    function captureActive() {
      const tab = activeTab();
      if (!tab) return;
      tab.name = cleanTitle(State.filename || tab.name || 'Sin título');
      tab.snapshot = State.contours.length ? buildProjectSnapshot() : null;
    }

    function render() {
      const wrap = document.getElementById('project-tabs');
      if (!wrap) return;
      wrap.innerHTML = '';
      tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = 'project-tab' + (tab.id === activeId ? ' active' : '');
        el.title = tab.fileHandle?.name || tab.name || 'Sin título';
        const title = document.createElement('span');
        title.className = 'project-tab-title';
        title.textContent = tab.name || 'Sin título';
        const close = document.createElement('span');
        close.className = 'project-tab-close';
        close.textContent = '×';
        close.title = 'Cerrar pestaña';
        el.append(title, close);
        el.addEventListener('click', e => {
          if (e.target === close) return;
          switchTo(tab.id);
        });
        close.addEventListener('click', e => {
          e.stopPropagation();
          closeTab(tab.id);
        });
        wrap.appendChild(el);
      });
    }

    function clearWorkspace(name = 'Sin título') {
      TransformModule.deselect(); TransformModule.hidePanel();
      History.clear();
      PanelUI.clearAllSelection();
      Viewport.clearAll();
      State.reset();
      GeoModule.resetCounter();
      State.filename = cleanTitle(name);
      PanelUI.refreshContourVisuals();
      PanelUI.renderList();
      PanelUI.updateModeBadge();
      PanelUI.updateButtons();
      PanelUI.updateColorPanel();
      History.push(State);
    }

    function loadTab(tab) {
      if (tab.snapshot) {
        const snap = hydrateProjectSnapshot(tab.snapshot);
        loadSnapshotIntoState(snap);
      } else {
        clearWorkspace(tab.name || 'Sin título');
      }
      State.filename = cleanTitle(tab.name || State.filename || 'Sin título');
    }

    function init() {
      if (tabs.length) return;
      const tab = { id: newId(), name: 'Sin título', snapshot: null, fileHandle: null, recentId: null };
      tabs.push(tab);
      activeId = tab.id;
      clearWorkspace(tab.name);
      render();
    }

    function createBlank(name = 'Sin título') {
      captureActive();
      const tab = { id: newId(), name: cleanTitle(name), snapshot: null, fileHandle: null, recentId: null };
      tabs.push(tab);
      activeId = tab.id;
      clearWorkspace(tab.name);
      render();
      Utils.toast('Nueva pestaña de proyecto.', 'ok', 1200);
    }

    function switchTo(id) {
      if (id === activeId) return;
      const tab = tabs.find(t => t.id === id);
      if (!tab) return;
      captureActive();
      activeId = id;
      loadTab(tab);
      render();
    }

    function closeTab(id) {
      if (tabs.length <= 1) {
        const tab = activeTab();
        if (tab) {
          tab.name = 'Sin título'; tab.snapshot = null; tab.fileHandle = null; tab.recentId = null;
          clearWorkspace(tab.name);
          render();
        }
        return;
      }
      const idx = tabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      const wasActive = id === activeId;
      tabs.splice(idx, 1);
      if (wasActive) {
        const next = tabs[Math.min(idx, tabs.length - 1)];
        activeId = next.id;
        loadTab(next);
      }
      render();
    }

    function openProjectSnapshot(snap, meta = {}) {
      captureActive();
      let tab = activeTab();
      const useCurrent = tab && currentIsBlank() && !tab.snapshot;
      if (!useCurrent) {
        tab = { id: newId(), name: cleanTitle(meta.name || snap.filename), snapshot: null, fileHandle: null, recentId: null };
        tabs.push(tab);
      }
      activeId = tab.id;
      tab.name = cleanTitle(meta.name || snap.filename || 'Proyecto INKORA 3D');
      tab.fileHandle = meta.fileHandle || null;
      tab.recentId = meta.recentId || null;
      loadSnapshotIntoState(snap);
      tab.snapshot = buildProjectSnapshot();
      tab.name = cleanTitle(State.filename || tab.name);
      render();
    }

    function syncActiveFromState() {
      const tab = activeTab();
      if (!tab) return;
      tab.name = cleanTitle(State.filename || tab.name || 'Sin título');
      tab.snapshot = State.contours.length ? buildProjectSnapshot() : null;
      render();
    }

    function attachFileHandle(handle, recentId, name = null) {
      const tab = activeTab();
      if (!tab) return;
      tab.fileHandle = handle || tab.fileHandle || null;
      tab.recentId = recentId || tab.recentId || null;
      if (name) tab.name = cleanTitle(name);
      render();
    }

    return { init, createBlank, switchTo, closeTab, openProjectSnapshot, syncActiveFromState, attachFileHandle, getActiveTab: activeTab, captureActive };
  })();

  ProjectTabs.init();
  RecentProjects.render();

  /* ══════════════════════════════════════════════════════
     MÓDULO 8 — ATAJOS DE TECLADO CONFIGURABLES
     Cada atajo tiene: id, group, desc, key, ctrl, shift, alt, action.
     Los atajos se persisten en localStorage.
     La UI de edición permite grabar nuevas combinaciones.

     EXTENSIÓN: atajos por contexto (solo en viewport, solo en panel),
     exportar/importar config como JSON, múltiples keymaps.
     ══════════════════════════════════════════════════════ */
  const KeyboardModule = (() => {
    const LS_KEY = 'inkora_shortcuts_v1';

    /* ── Definición de atajos (valores por defecto) ─── */
    const DEFAULTS = [
      // Navegación
      { id:'focus',       group:'Viewport',   desc:'Encuadrar escena',          key:'f',         ctrl:false, shift:false, alt:false },
      { id:'selAll',      group:'Selección',  desc:'Seleccionar todo',           key:'a',         ctrl:false, shift:false, alt:false },
      { id:'selNone',     group:'Selección',  desc:'Deseleccionar todo',         key:'Escape',    ctrl:false, shift:false, alt:false },
      { id:'selInvert',   group:'Selección',  desc:'Invertir selección',         key:'i',         ctrl:false, shift:false, alt:false },
      { id:'selFrontFace',group:'Selección',  desc:'Seleccionar cara frontal',   key:'1',         ctrl:true,  shift:false, alt:false },
      { id:'selBackFace', group:'Selección',  desc:'Seleccionar cara trasera',   key:'2',         ctrl:true,  shift:false, alt:false },
      // Operaciones
      { id:'extrude',     group:'Operaciones',desc:'Extruir selección',          key:'e',         ctrl:false, shift:false, alt:false },
      { id:'toggleExtrudeMode',group:'Operaciones',desc:'Alternar modo extrusion',key:'o',        ctrl:false, shift:false, alt:false },
      { id:'color',       group:'Operaciones',desc:'Color de seleccion',         key:'c',         ctrl:false, shift:false, alt:false },
      { id:'duplicate',   group:'Operaciones',desc:'Duplicar pieza seleccionada',key:'d',         ctrl:true,  shift:false, alt:false },
      { id:'deletePiece', group:'Operaciones',desc:'Eliminar pieza seleccionada',key:'Delete',    ctrl:false, shift:false, alt:false },
      { id:'toggleVis',   group:'Operaciones',desc:'Ocultar / mostrar pieza',    key:'h',         ctrl:false, shift:false, alt:false },
      { id:'isolate',     group:'Operaciones',desc:'Aislar pieza (solo visible)', key:'i',        ctrl:false, shift:false, alt:true  },
      // Historial
      { id:'undo',        group:'Historial',  desc:'Deshacer',                   key:'z',         ctrl:true,  shift:false, alt:false },
      { id:'redo',        group:'Historial',  desc:'Rehacer',                    key:'z',         ctrl:true,  shift:true,  alt:false },
      // Grupos
      { id:'group',       group:'Grupos',     desc:'Agrupar selección',           key:'g',         ctrl:true,  shift:false, alt:false },
      { id:'ungroup',     group:'Grupos',     desc:'Desagrupar',                  key:'u',         ctrl:true,  shift:false, alt:false },
      // Archivo
      { id:'import',      group:'Archivo',    desc:'Importar DXF',               key:'i',         ctrl:true,  shift:false, alt:false },
      { id:'openProject', group:'Archivo',    desc:'Abrir proyecto',             key:'o',         ctrl:true,  shift:false, alt:false },
      { id:'saveProject', group:'Archivo',    desc:'Guardar proyecto',           key:'s',         ctrl:true,  shift:false, alt:false },
      { id:'export',      group:'Archivo',    desc:'Exportar 3MF',               key:'e',         ctrl:true,  shift:false, alt:false },
    ];

    /* ── Estado ─────────────────────────────────────── */
    let shortcuts = loadFromStorage();
    let _editMode = false;
    let _recordingId = null; // id del atajo que está grabando
    let _hiddenMeshes = new Set(); // para toggle visibility

    function loadFromStorage() {
      try {
        const saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
        if (!saved) return DEFAULTS.map(d => ({ ...d }));
        // Merge: atajos nuevos en DEFAULTS que no estén en saved se añaden
        const merged = DEFAULTS.map(d => {
          const found = saved.find(s => s.id === d.id);
          return found ? { ...d, ...found } : { ...d };
        });
        return merged;
      } catch { return DEFAULTS.map(d => ({ ...d })); }
    }

    function saveToStorage() {
      localStorage.setItem(LS_KEY, JSON.stringify(shortcuts.map(s => ({
        id: s.id, key: s.key, ctrl: s.ctrl, shift: s.shift, alt: s.alt
      }))));
    }

    /* ── Formatear combinación para mostrar ─────────── */
    function fmtKey(sc) {
      const parts = [];
      if (sc.ctrl)  parts.push('Ctrl');
      if (sc.shift) parts.push('Shift');
      if (sc.alt)   parts.push('Alt');
      const k = sc.key === ' ' ? 'Space' : sc.key;
      parts.push(k.length === 1 ? k.toUpperCase() : k);
      return parts;
    }

    /* ── Renderizar la lista de atajos ──────────────── */
    function renderList() {
      const list = document.getElementById('sc-list');
      list.innerHTML = '';
      const groups = [...new Set(shortcuts.map(s => s.group))];
      groups.forEach(grp => {
        const div = document.createElement('div');
        div.className = 'sc-group';
        const lbl = document.createElement('div');
        lbl.className = 'sc-group-label';
        lbl.textContent = grp;
        div.appendChild(lbl);
        shortcuts.filter(s => s.group === grp).forEach(sc => {
          div.appendChild(_buildRow(sc));
        });
        list.appendChild(div);
      });
    }

    function _buildRow(sc) {
      const row = document.createElement('div');
      row.className = 'sc-row';
      row.dataset.id = sc.id;

      const desc = document.createElement('span');
      desc.className = 'sc-desc';
      desc.textContent = sc.desc;

      // Key display
      const keySpan = document.createElement('span');
      keySpan.className = 'sc-key';
      fmtKey(sc).forEach((part, i, arr) => {
        const k = document.createElement('kbd');
        k.textContent = part;
        if (i < arr.length - 1) k.classList.add('mod');
        keySpan.appendChild(k);
        if (i < arr.length - 1) {
          const plus = document.createElement('span');
          plus.textContent = '+'; plus.style.cssText = 'color:var(--text-dim);font-size:10px';
          keySpan.appendChild(plus);
        }
      });

      // Key input (edit mode)
      const input = document.createElement('input');
      input.className = 'sc-key-input';
      input.readOnly = true;
      input.value = fmtKey(sc).join('+');
      input.title = 'Clic para grabar nueva combinación';
      input.addEventListener('click', () => startRecording(sc.id, input));

      row.append(desc, keySpan, input);

      if (_editMode) row.classList.add('editing');
      return row;
    }

    /* ── Grabación de nueva combinación ─────────────── */
    function startRecording(id, input) {
      // Cancelar grabación previa
      if (_recordingId) {
        const prev = document.querySelector(`.sc-row[data-id="${_recordingId}"] .sc-key-input`);
        if (prev) { prev.classList.remove('recording'); prev.value = fmtKey(shortcuts.find(s=>s.id===_recordingId)).join('+'); }
      }
      _recordingId = id;
      input.value = '— presioná tecla —';
      input.classList.add('recording');
    }

    function _onKeydownRecording(e) {
      if (!_recordingId) return;
      // Teclas solas de modificador no cuentan
      if (['Control','Shift','Alt','Meta'].includes(e.key)) return;
      e.preventDefault(); e.stopPropagation();

      const sc = shortcuts.find(s => s.id === _recordingId);
      if (!sc) return;
      const conflict = shortcuts.find(s => s.id !== sc.id &&
        s.key.toLowerCase() === e.key.toLowerCase() &&
        s.ctrl === e.ctrlKey && s.shift === e.shiftKey && s.alt === e.altKey);
      if (conflict) {
        conflict.key = '';
        conflict.ctrl = conflict.shift = conflict.alt = false;
        Utils.toast(`Atajo reasignado; se liberó: ${conflict.desc}`, 'ok', 2200);
      }
      sc.key   = e.key;
      sc.ctrl  = e.ctrlKey;
      sc.shift = e.shiftKey;
      sc.alt   = e.altKey;

      const input = document.querySelector(`.sc-row[data-id="${_recordingId}"] .sc-key-input`);
      if (input) { input.value = fmtKey(sc).join('+'); input.classList.remove('recording'); }
      _recordingId = null;
      saveToStorage();
    }

    /* ── Toggle edit mode ───────────────────────────── */
    function setEditMode(on) {
      _editMode = on;
      if (!on && _recordingId) {
        // Cancelar grabación pendiente
        const prev = document.querySelector(`.sc-row[data-id="${_recordingId}"] .sc-key-input`);
        if (prev) { prev.classList.remove('recording'); prev.value = fmtKey(shortcuts.find(s=>s.id===_recordingId)).join('+'); }
        _recordingId = null;
      }
      renderList();
      document.getElementById('sc-toggle-edit').classList.toggle('active', on);
      document.getElementById('sc-toggle-edit').textContent = on ? 'Vista' : 'Editar';
      document.getElementById('sc-footer').style.display = on ? 'flex' : 'none';
    }

    function resetAll() {
      shortcuts = DEFAULTS.map(d => ({ ...d }));
      saveToStorage();
      renderList();
    }

    /* ── Resolver acción por evento ──────────────────── */
    function resolve(e) {
      return shortcuts.find(sc =>
        sc.key && sc.key.toLowerCase() === e.key.toLowerCase() &&
        sc.ctrl  === e.ctrlKey &&
        sc.shift === e.shiftKey &&
        sc.alt   === e.altKey
      );
    }

    /* ── Acciones ────────────────────────────────────── */
    function execAction(id) {
      switch (id) {
        case 'focus':
          Viewport.focusAll();
          break;

        case 'selAll':
          PanelUI.selectAll(); PanelUI.updateModeBadge();
          break;

        case 'selNone':
          PanelUI.clearAllSelection();
          PanelUI.refreshContourVisuals();
          PanelUI.renderList();
          PanelUI.updateModeBadge();
          PanelUI.updateColorPanel();
          break;

        case 'selInvert':
          State.contours.forEach((c, i) => {
            if (!Utils.isVisibleContour(c)) return;
            if (!c.extruded && isLikelyVoidHole(c, i)) return;
            if (State.selectedIdxs.has(i)) {
              State.selectedIdxs.delete(i);
              State.selectedFaces.delete(i);
              if (!c.extruded) c.sel2D = false;
            } else {
              State.selectedIdxs.add(i);
              State.selectedFaces.set(i, safeSelectionFace(c));
              if (!c.extruded) c.sel2D = true;
            }
          });
          PanelUI._syncPieceSelection && PanelUI._syncPieceSelection();
          PanelUI.refreshContourVisuals(); PanelUI.renderList(); PanelUI.updateModeBadge();
          break;

        case 'selFrontFace':
          selectModelExtremeFace('front');
          break;

        case 'selBackFace':
          selectModelExtremeFace('back');
          break;

        case 'extrude':
          if (State.contours.some(c => c.sel2D && !c.extruded) ||
              [...State.selectedIdxs].some(i => { const c=State.contours[i]; return c&&c.extruded&&c.piece; }))
            document.getElementById('btn-extrude').click();
          break;

        case 'toggleExtrudeMode':
          setExtrudeMode(State.extrudeMode === 'merged' ? 'separate' : 'merged', true);
          break;

        case 'color':
          PanelUI.openColorPopoverAt(_lastMouse.x, _lastMouse.y);
          break;

        case 'duplicate': {
          if (State.selectedPieceIdx === null) break;
          const src = State.pieces[State.selectedPieceIdx];
          const srcC = State.contours.find(c => c.piece === src && !c._deleted);
          if (!srcC) break;

          const sourceIdxs = (src._mergedSourceIdxs && src._mergedSourceIdxs.length)
            ? src._mergedSourceIdxs.filter(i => State.contours[i] && !State.contours[i]._deleted)
            : [State.contours.indexOf(srcC)];
          const firstNewIdx = State.contours.length;
          const newIdxs = sourceIdxs.map((_, i) => firstNewIdx + i);
          const idxMap = new Map(sourceIdxs.map((oldIdx, i) => [oldIdx, newIdxs[i]]));

          const newMesh = src.mesh.clone(false);
          newMesh.geometry = src.mesh.geometry.clone();
          newMesh.material = src.mesh.material.clone();
          newMesh.userData = { ...src.mesh.userData };
          newMesh.material.color.set(src.color || '#c8c8d0');
          newMesh.material.emissive?.set(0x000000);
          newMesh.material.emissiveIntensity = 0;
          src.mesh.children.forEach(child => {
            const childClone = child.clone(false);
            if (child.geometry) childClone.geometry = child.geometry.clone();
            if (child.material) childClone.material = child.material.clone();
            childClone.userData = { ...child.userData };
            if (childClone.userData._pickMesh) childClone.userData._pickMesh = newMesh;
            if (idxMap.has(childClone.userData._pickContourIdx)) {
              childClone.userData._pickContourIdx = idxMap.get(childClone.userData._pickContourIdx);
            }
            newMesh.add(childClone);
          });
          Viewport.add3D(newMesh);

          const newPiece = {
            mesh: newMesh,
            name: src.name + ' (copia)',
            color: src.color,
            contourIdx: firstNewIdx,
            _sourceContourIdx: src._sourceContourIdx ?? sourceIdxs[0],
            _depth: src._depth, _bevel: src._bevel, _bevelSeg: src._bevelSeg,
            _baseX: src._baseX ?? src.mesh.position.x,
            _baseY: src._baseY ?? src.mesh.position.y,
            _baseZ: src._baseZ ?? src.mesh.position.z,
            tx: (src.tx||0)+5, ty: src.ty||0, tz: src.tz||0,
            rotY: src.rotY||0, scale: src.scale||1,
            _holeIdxs: src._holeIdxs ? [...src._holeIdxs] : [],
            _mergedSourceIdxs: newIdxs.length > 1 ? newIdxs : [],
          };

          sourceIdxs.forEach((srcIdx, i) => {
            const sc = State.contours[srcIdx] || srcC;
            const newContour = {
              shape: sc.shape, offX: sc.offX, offY: sc.offY,
              depth: sc.depth, parentIdx: -1,
              layer: sc.layer || '0', color: sc.color || src.color || '#dedcff',
              colorSource: sc.colorSource || 'default',
              hasEntityColor: !!sc.hasEntityColor,
              hasExplicitColor: !!sc.hasExplicitColor,
              flatMesh: null, outlineMesh: null,
              sel2D: false, extruded: true, piece: newPiece,
              depthOverride: null,
              _isFakeContour: true,
              _panelHidden: i !== 0,
            };
            State.contours.push(newContour);
          });

          const newHoleIdxs = [];
          (src._holeIdxs || []).forEach(hIdx => {
            const h = State.contours[hIdx];
            if (!h || h._deleted) return;
            const newParentIdx = idxMap.get(h.parentIdx);
            if (newParentIdx == null) return;
            const newHoleIdx = State.contours.length;
            newHoleIdxs.push(newHoleIdx);
            State.contours.push({
              shape: h.shape, offX: h.offX, offY: h.offY,
              depth: h.depth, parentIdx: newParentIdx,
              layer: h.layer || '0', color: h.color || '#dedcff',
              colorSource: h.colorSource || 'default',
              hasEntityColor: !!h.hasEntityColor,
              hasExplicitColor: !!h.hasExplicitColor,
              flatMesh: null, outlineMesh: null,
              sel2D: false, extruded: true, piece: null,
              depthOverride: null,
              _isFakeContour: true,
              _panelHidden: true,
            });
          });
          newPiece._holeIdxs = newHoleIdxs;
          State.pieces.push(newPiece);
          TransformModule.restoreTransform(newMesh, newPiece);
          PanelUI.renderList(); PanelUI.updateButtons(); PanelUI.updateModeBadge();
          History.push(State);
          Utils.toast(`Duplicado: ${newPiece.name}`, 'ok');
          break;
        }

        case 'deletePiece': {
          // Delete debe actuar sobre el/los contornos seleccionados, no sobre
          // selectedPieceIdx solamente. selectedPieceIdx puede quedar apuntando a
          // la pieza exterior cuando se hace click cerca de un interior de letra.
          const selectedContourIdxs = [...State.selectedIdxs].filter(i => {
            const c = State.contours[i];
            return c && !c._deleted && c.extruded;
          });

          function pieceForContourIdx(idx) {
            const c = State.contours[idx];
            if (c?.piece) return c.piece;
            return State.pieces.find(p => p && (
              p.contourIdx === idx ||
              p._sourceContourIdx === idx ||
              (Array.isArray(p._mergedSourceIdxs) && p._mergedSourceIdxs.includes(idx))
            )) || null;
          }

          const targets = [];
          selectedContourIdxs.forEach(idx => {
            const p = pieceForContourIdx(idx);
            if (p && !targets.some(t => t.p === p)) targets.push({ p, preferredIdx: idx });
          });

          // Fallback legacy: si no había selectedIdxs útiles, usar la pieza activa.
          if (!targets.length && State.selectedPieceIdx !== null) {
            const p = State.pieces[State.selectedPieceIdx];
            if (p) targets.push({ p, preferredIdx: State.contours.findIndex(c => c.piece === p) });
          }

          if (!targets.length) break;

          const deletedPieces = new Set(targets.map(t => t.p));
          const affectedIdxs = new Set();

          targets.forEach(({ p, preferredIdx }) => {
            const linkedIdxs = State.contours
              .map((c, i) => c && c.piece === p ? i : -1)
              .filter(i => i !== -1);
            const mainIdx = preferredIdx !== -1 ? preferredIdx : State.contours.findIndex(c => c && c.piece === p);
            linkedIdxs.forEach(i => affectedIdxs.add(i));
            if (mainIdx !== -1) affectedIdxs.add(mainIdx);

            Viewport.remove3D(p.mesh);

            linkedIdxs.forEach(idx => {
              const c = State.contours[idx];
              if (!c) return;

              // Contorno original 2D: se conserva y vuelve a quedar disponible.
              // Esto elimina la extrusión, no el contorno fuente.
              if (c.flatMesh) {
                c.extruded = false;
                c.piece = null;
                c._panelHidden = false;
                c.sel2D = false;
                c.flatMesh.visible = true;
                if (c.outlineMesh) c.outlineMesh.visible = true;
              } else {
                // Contorno ficticio creado por una extrusión sobre 3D: se marca
                // eliminado sin desplazar índices internos.
                c._deleted = true;
                c._panelHidden = true;
                c.piece = null;
              }
            });

            // Si se elimina una pieza exterior, sus huecos absorbidos vuelven al 2D.
            // Si se elimina sólo un interior con pieza propia, no se toca el exterior.
            State.contours.forEach((h, hIdx) => {
              if (!h || !h.flatMesh) return;
              if (h.extruded && h.piece === null && linkedIdxs.includes(h.parentIdx)) {
                h.extruded = false;
                h.sel2D = false;
                h.flatMesh.visible = true;
                if (h.outlineMesh) h.outlineMesh.visible = true;
                affectedIdxs.add(hIdx);
              }
            });
          });

          State.pieces = State.pieces.filter(p => !deletedPieces.has(p));
          State.selectedPieceIdx = null;
          State.selectedIdxs.clear();
          State.selectedFaces.clear();

          State.groups.forEach(g => {
            g.memberIdxs = g.memberIdxs.filter(i => !affectedIdxs.has(i));
          });
          State.groups = State.groups.filter(g => g.memberIdxs.length > 0);

          TransformModule.deselect(); TransformModule.hidePanel();
          PanelUI.refreshContourVisuals(); PanelUI.renderList();
          PanelUI.updateButtons(); PanelUI.updateModeBadge(); PanelUI.updateColorPanel();
          History.push(State);
          ProjectTabs.syncActiveFromState();
          Utils.toast(targets.length === 1 ? 'Extrusión eliminada.' : `${targets.length} extrusiones eliminadas.`);
          break;
        }

        case 'toggleVis': {
          if (State.selectedPieceIdx === null) break;
          const p = State.pieces[State.selectedPieceIdx];
          p.mesh.visible = !p.mesh.visible;
          _hiddenMeshes[p.mesh.visible ? 'delete' : 'add'](p.mesh);
          History.push(State);
          ProjectTabs.syncActiveFromState();
          Utils.toast(p.mesh.visible ? `${p.name} visible.` : `${p.name} oculta.`);
          break;
        }

        case 'isolate': {
          if (State.selectedPieceIdx === null) break;
          const target = State.pieces[State.selectedPieceIdx];
          const allHidden = State.pieces.filter(p => p !== target && !p.mesh.visible).length === State.pieces.length - 1;
          State.pieces.forEach(p => {
            p.mesh.visible = allHidden ? true : (p === target);
          });
          History.push(State);
          ProjectTabs.syncActiveFromState();
          Utils.toast(allHidden ? 'Todas visibles.' : `Aislando ${target.name}.`);
          break;
        }

        case 'undo': {
          const snap = History.undo();
          if (snap) { restoreSnapshot(snap); ProjectTabs.syncActiveFromState(); Utils.toast('Deshecho.'); }
          break;
        }
        case 'redo': {
          const snap = History.redo();
          if (snap) { restoreSnapshot(snap); ProjectTabs.syncActiveFromState(); Utils.toast('Rehecho.'); }
          break;
        }

        case 'group': {
          // Agrupar todos los contornos seleccionados (2D y 3D, excepto absorbidos)
          const toGroup = [...State.selectedIdxs].filter(i => {
            const c = State.contours[i];
            return Utils.isVisibleContour(c);
          });
          if (toGroup.length < 2) { Utils.toast('Seleccioná 2 o más elementos para agrupar.'); break; }
          // Quitar de grupos existentes
          State.groups.forEach(g => {
            g.memberIdxs = g.memberIdxs.filter(i => !toGroup.includes(i));
          });
          State.groups = State.groups.filter(g => g.memberIdxs.length > 0);
          const newGroup = {
            id: State._nextGroupId++,
            name: `Grupo ${State._nextGroupId - 1}`,
            collapsed: false,
            memberIdxs: toGroup,
          };
          State.groups.push(newGroup);
          History.push(State);
          PanelUI.renderList();
          Utils.toast(`Grupo creado con ${toGroup.length} elementos.`, 'ok');
          break;
        }

        case 'ungroup': {
          // Desagrupar: encontrar grupos que tengan algún miembro seleccionado
          const toRemove = new Set();
          State.groups.forEach(g => {
            if (g.memberIdxs.some(i => State.selectedIdxs.has(i))) {
              toRemove.add(g.id);
            }
          });
