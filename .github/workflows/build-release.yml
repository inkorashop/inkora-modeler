name: Build & Publish Installer

# Se dispara al subir un tag "v*" (ej: v1.0.1), o manualmente desde la
# pestaña Actions de GitHub (workflow_dispatch) sin necesidad de tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    # electron-builder necesita Windows real para generar y firmar el
    # instalador NSIS correctamente (no es cross-compilable de forma confiable).
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: electron
        run: npm install

      - name: Leer version del paquete
        id: package
        working-directory: electron
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Compilar instalador
        working-directory: electron
        run: npx electron-builder --win nsis --publish never

      - name: Publicar release completo
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: INKORA 3D Modeler v${{ steps.package.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            electron/dist/INKORA-3D-Modeler-Setup.exe
            electron/dist/INKORA-3D-Modeler-Setup.exe.blockmap
            electron/dist/latest.yml
