name: Build & Publish Installer

# Se dispara al subir un tag "v*" (ej: v1.0.1), o manualmente desde la
# pestaña Actions de GitHub (workflow_dispatch) sin necesidad de tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    # electron-builder necesita Windows real para generar y firmar el
    # instalador NSIS correctamente (no es cross-compilable de forma confiable).
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: electron
        run: npm install

      - name: Leer version del paquete
        id: package
        working-directory: electron
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Compilar instalador
        working-directory: electron
        run: npx electron-builder --win nsis --publish never

      - name: Publicar release completo
        working-directory: electron
        shell: pwsh
        run: |
          $version = '${{ steps.package.outputs.version }}'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } else {
            '${{ steps.package.outputs.tag }}'
          }
          $repo = $env:GITHUB_REPOSITORY
          $required = @(
            'INKORA-3D-Modeler-Setup.exe',
            'INKORA-3D-Modeler-Setup.exe.blockmap',
            'latest.yml'
          )

          $releaseTags = @(
            gh release list --repo $repo --limit 100 --json tagName --jq '.[].tagName'
          )
          if ($LASTEXITCODE -ne 0) {
            throw 'No se pudo consultar la lista de releases.'
          }

          if ($releaseTags -notcontains $tag) {
            gh release create $tag `
              --repo $repo `
              --target $env:GITHUB_SHA `
              --title "INKORA 3D Modeler v$version" `
              --generate-notes
            if ($LASTEXITCODE -ne 0) {
              throw "No se pudo crear el release $tag."
            }
          }

          gh release upload $tag `
            'dist/INKORA-3D-Modeler-Setup.exe' `
            'dist/INKORA-3D-Modeler-Setup.exe.blockmap' `
            'dist/latest.yml' `
            --repo $repo `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "No se pudieron publicar los artefactos de $tag."
          }

          $published = @(
            gh release view $tag --repo $repo --json assets --jq '.assets[].name'
          )
          $missing = @($required | Where-Object { $published -notcontains $_ })
          if ($missing.Count) {
            throw "Faltan artefactos publicados: $($missing -join ', ')"
          }
          Write-Host "Release $tag completo: $($required -join ', ')"
        env:
          GH_TOKEN: ${{ github.token }}
