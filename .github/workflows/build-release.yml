name: Build & Publish Installer

# Se dispara al subir un tag "v*" (ej: v1.0.1), o manualmente desde la
# pestaña Actions de GitHub (workflow_dispatch) sin necesidad de tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    # electron-builder necesita Windows real para generar y firmar el
    # instalador NSIS correctamente (no es cross-compilable de forma confiable).
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: electron
        run: npm install

      - name: Compilar y publicar instalador a GitHub Releases
        working-directory: electron
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
