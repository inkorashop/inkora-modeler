        // que equivale al XY del DXF/modelo.
        const forward = cam.getWorldDirection(new THREE.Vector3());
        forward.y = 0;

        if (forward.lengthSq() < 1e-8) {
          forward.set(0, 0, -1);
        } else {
          forward.normalize();
        }

        const right = new THREE.Vector3()
          .crossVectors(forward, new THREE.Vector3(0,1,0))
          .normalize();

        const panScale = s.sph.radius * 0.0008;

        s.target.addScaledVector(right, -dx * panScale);
        s.target.addScaledVector(forward, dy * panScale);

        // Seguridad extra: evita que el target suba/baje.
        s.target.y = 0;

        apply();
      }

      s.lastX=e.clientX;s.lastY=e.clientY;
    });

    window.addEventListener('mouseup',e=>{
      if(!s.rotating&&!s.panning){ s.dragged=false; return; }
      s.rotating=false;s.panning=false;
      s.dragged=false;
      // FIX CURSOR: al soltar, restaurar según si hay algo bajo el mouse
      el.style.cursor=_hoveredMesh?'pointer':'default';
    });

    el.addEventListener('wheel',e=>{
      // Zoom lineal: cada rueda suma/resta una cantidad fija.
      // Ya no se achica el paso cuando la cámara está cerca.
      s.sph.radius = Math.max(
        MIN_ZOOM_RADIUS,
        Math.min(MAX_ZOOM_RADIUS, s.sph.radius + e.deltaY * ZOOM_STEP)
      );

      apply();
      e.preventDefault();
    },{passive:false});

    el.addEventListener('contextmenu',e=>e.preventDefault());
    s.update=()=>{};
    return s;
  }

  return {
    init,add2D,clear2D,add3D,remove3D,clearAll,focusAll,
    setEmissive,clearEmissive,onClickMesh,onHoverMesh,getScene,getCamera,getRenderer,
    group2D:()=>group2D, group3D:()=>group3D,
    applyHighlight: _applyHighlight,
  };
})();


/* ══════════════════════════════════════════════════════
   MÓDULO 3 — GEOMETRÍA
   EXTENSIÓN: CSG, texturas UV, parámetros por pieza, LOD.
   ══════════════════════════════════════════════════════ */
const GeoModule = (() => {
  // Contador global de piezas. Solo se usa para ordenar render sin cambiar
  // la geometria importada.
  let _pieceCounter = 0;
  function resetCounter() { _pieceCounter = 0; }

  function makeFlat(shape,offX,offY,color='#555566'){
    const geo=new THREE.ShapeGeometry(shape);
    const idx = _pieceCounter++;
    const mat=new THREE.MeshBasicMaterial({
      color:new THREE.Color(color),
      side:THREE.DoubleSide,
      transparent:true,
      opacity:0,
      depthWrite:false,
    });
    mat.colorWrite = false;

    const mesh=new THREE.Mesh(geo,mat);
    mesh.renderOrder = idx + 1;
    mesh.rotation.x=-Math.PI/2;
    mesh.position.set(-offX,0.05,offY);
    return mesh;
  }

  function makeOutline(shape,offX,offY,color='#dedcff'){
    const pts=shape.getPoints(128).map(p=>new THREE.Vector3(p.x-offX,0.08,-(p.y-offY)));
    pts.push(pts[0].clone());

    const geo=new THREE.BufferGeometry().setFromPoints(pts);

    const mat=new THREE.LineBasicMaterial({
      color:new THREE.Color(color),
      transparent:true,
      opacity:0.95,
      depthTest:false,
      depthWrite:false,
    });

    const line = new THREE.Line(geo,mat);
    line.renderOrder = 9999;
    return line;
  }
  function extrude(shape,offX,offY,{depth=3,bevel=0,bevelSeg=3,color='#c8c8d0',extraShapes=[]}={}){
    const isNeg    = depth < 0;
    const absDepth = Math.abs(depth) || 0.1;

    // Clamp bevel: nunca permitir valores negativos ni mayores que media profundidad.
    const maxBevel = Math.max(0, absDepth / 2 - 0.001);
    const safeBevel = Math.min(Math.max(bevel, 0), maxBevel);
    const extrudeOpts = {
      steps: 1,
      depth: absDepth,
      bevelEnabled: safeBevel > 0,
      bevelThickness: safeBevel,
      bevelSize: safeBevel * 0.75,
      bevelSegments: bevelSeg,
    };

    const allShapes = extraShapes.length > 0 ? [shape, ...extraShapes] : [shape];
    const geo = new THREE.ExtrudeGeometry(allShapes, extrudeOpts);
    geo.computeVertexNormals();
    _pieceCounter++;

    // FrontSide: las normales de ExtrudeGeometry apuntan hacia afuera.
    // DoubleSide causaba que la cara trasera del propio objeto se viera
    // a través de la delantera (self-transparency) desde ciertos ángulos.
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(color),
      metalness: 0.1,
      roughness: 0.55,
      side: THREE.FrontSide,
      transparent: false,
      opacity: 1,
      polygonOffset: true,
      polygonOffsetFactor: -2,
      polygonOffsetUnits: -2,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow    = true;
    mesh.receiveShadow = true;

    // ExtrudeGeometry extruye en +Z local [0 → absDepth].
    // rotation.x = -PI/2 mapea: Z_local → Y_world, Y_local → -Z_world.
    // → la pieza ocupa Y_world ∈ [0, absDepth] con mesh.position.y = 0.
    //
    // Para depth NEGATIVO queremos que la pieza quede por DEBAJO del plano Y=0.
    // Solución: rotar el mesh 180° en Z (voltear la extrusión) y bajar position.y
    // en absDepth para que la cara superior quede en Y=0.
    mesh.rotation.x = -Math.PI / 2;
    if (isNeg) {
      mesh.position.set(-offX, -absDepth, offY);    // cara sup. en Y=0, cuerpo hacia -Y
    } else {
      mesh.position.set(-offX, 0, offY);
    }

    // ── Líneas de contorno en la cara superior ──
    // En espacio LOCAL del mesh, la cara superior siempre está en Z = absDepth
    // (independientemente de si la extrusión es positiva o negativa, porque
    //  la geometría siempre va de 0 a absDepth en Z local antes de rotar).
    const outlineMat = new THREE.LineBasicMaterial({
      color: 0x222222,
      depthTest: true,
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -1,
      polygonOffsetUnits: -1,
    });

    function makeClosedLine(points, z) {
      if (!points.length) return null;
      const verts = [];
      points.forEach(p => verts.push(p.x, p.y, z));
      verts.push(points[0].x, points[0].y, z);
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      return new THREE.Line(g, outlineMat);
    }

    function addShapeOutline(sh) {
      const capZs = [absDepth + 0.05, -0.05];
      const pts  = sh.getPoints(96);
      capZs.forEach(z => {
        const line = makeClosedLine(pts, z);
        if (line) mesh.add(line);
      });
      sh.holes.forEach(hole => {
        const hpts = hole.getPoints(96);
        capZs.forEach(z => {
          const hline = makeClosedLine(hpts, z);
          if (hline) mesh.add(hline);
        });
      });
    }
    allShapes.forEach(sh => addShapeOutline(sh));

    return mesh;
  }
  return {makeFlat,makeOutline,extrude,resetCounter};
})();


/* ══════════════════════════════════════════════════════
   MÓDULO 4 — EXPORTACIÓN 3MF  (v10 — Geometría Sólida)
   Spec: 3D Manufacturing Format Core 1.3 +
         Materials and Properties Extension 1.2

   Estrategia (causa raíz resuelta):
   ─────────────────────────────────────────────────────
   • En lugar de exportar la geometría de render de Three.js
     (que tiene vértices duplicados y bordes non-manifold),
     se RECONSTRUYE cada pieza desde sus datos fuente:
     shape 2D + profundidad + posición.

   • Reconstrucción manifold garantizada:
     1. Se triangula el shape 2D con earcut (incluido en Three.js)
     2. Se generan las caras laterales con vértices COMPARTIDOS
        entre cara superior, cara inferior y laterales.
     3. Todos los vértices de la malla final son únicos y cada
        arista pertenece exactamente a dos triángulos → manifold.

   • Detección de apilado:
     - Piezas cuya base (minZ en 3MF) ≈ tope (maxZ) de otra
       se marcan como "apiladas" y se exportan con un offset Z
       exacto (sin EPS anti-zfight que existía solo para render).

   • Piezas al mismo nivel → objetos separados → multicolor OK.

   • Corrección de ejes: Three.js Y-up → 3MF Z-up.
     x'=x, y'=-z, z'=y  (sin inversión de winding)
   ══════════════════════════════════════════════════════ */
const Exporter = (() => {

  /* ── hexFromPiece ───────────────────────────────────────────────────────
     Lee el color verdadero de la pieza desde State.
  ─────────────────────────────────────────────────────────────────────── */
  function hexFromPiece(piece) {
    const raw = (piece.color || '#c8c8d0').replace('#', '');
    return raw.length === 6 ? raw : 'c8c8d0';
  }

  /* ── buildManifoldMesh ──────────────────────────────────────────────────
     Construye una malla 3D manifold perfecta a partir de un THREE.Shape
     y una profundidad, en espacio 3MF (Z-up).

     La malla tiene:
       - Cara inferior (Z = baseZ): triángulos CCW vistos desde -Z
       - Cara superior (Z = baseZ + depth): triángulos CCW vistos desde +Z
       - Caras laterales: quads (2 triángulos cada uno) que conectan
         el perímetro inferior con el superior.

     Todos los vértices del perímetro son COMPARTIDOS entre cara superior,
     cara inferior y laterales → garantiza manifold (cada arista tiene
     exactamente 2 triángulos adyacentes).

     Parámetros (en espacio Three.js world, se convierten a 3MF aquí):
       shape  : THREE.Shape
       baseY  : Y world mínimo de la pieza (= Z 3MF mínimo)
       topY   : Y world máximo (= baseY + depth)
       offX   : offset X del mesh en world-space
       offZ   : offset Z del mesh en world-space (= -offY de la shape)
       extraShapes: [THREE.Shape] para islas internas (como en ExtrudeGeometry)

     Retorna: { vertices: Float32Array, indices: Uint32Array }
     en espacio 3MF listo para serializar.
  ─────────────────────────────────────────────────────────────────────── */
  function buildManifoldMesh(shape, baseY, topY, offX, offZ, extraShapes = []) {
    const depth3mf = topY - baseY;   // altura en mm, positiva
    const baseZ3mf = baseY;           // Z 3MF de la cara inferior
    const topZ3mf  = topY;            // Z 3MF de la cara superior

    const allShapes = [shape, ...extraShapes];

    // ── 1. Recopilar puntos del perímetro exterior + huecos ──────────────
    // Usamos getPoints() de Three.js para discretizar el shape (ya resuelve
    // curvas de Bézier en segmentos lineales con buena resolución).
    const CURVE_SEGS = 64; // segmentos por curva (alta resolución)

    // Extraer contornos de todos los shapes (exterior + holes de cada uno)
    const contours = []; // [{pts:[{x,y}], isHole:bool}]

    allShapes.forEach(sh => {
      // Contorno exterior del shape
      const outerPts = sh.getPoints(CURVE_SEGS);
      contours.push({ pts: outerPts, isHole: false });

      // Huecos del shape (caritas de letras como A, O, etc.)
      sh.holes.forEach(hole => {
        const holePts = hole.getPoints(CURVE_SEGS);
        contours.push({ pts: holePts, isHole: true });
      });
    });

    // ── 2. Triangular la cara 2D usando ShapeUtils de Three.js ──────────
    // Three.js incluye earcut internamente vía THREE.ShapeUtils.triangulateShape
    // que acepta el shape directamente y maneja huecos correctamente.
    // Resultado: array de triángulos [[v0,v1,v2], ...] con índices en el
    // array plano de puntos que ThreeJS genera internamente.

    // Usamos la API de ShapeGeometry para obtener la triangulación
    // sin crear un mesh de render completo.
    const allShapesForGeo = allShapes;
    const tempGeo = new THREE.ShapeGeometry(allShapesForGeo);

    // ShapeGeometry genera una geometría indexada. Extraemos posición e índices.
    const pos2D = tempGeo.attributes.position;
    const idx2D = tempGeo.index;

    const nVerts2D = pos2D.count;
    const nTris2D  = idx2D ? idx2D.count / 3 : Math.floor(nVerts2D / 3);
    function triIndex(t, corner) {
      return idx2D ? idx2D.getX(t * 3 + corner) : (t * 3 + corner);
    }

    // ── 3. Construir la malla 3D manifold ────────────────────────────────
    //
    // Layout de vértices:
    //   [0 .. nVerts2D-1]           : cara inferior (Z = baseZ3mf)
    //   [nVerts2D .. 2*nVerts2D-1]  : cara superior (Z = topZ3mf)
    //
    // Las caras laterales usan los mismos vértices (compartidos).
    //
    // Conversión de coordenadas Three.js → 3MF:
    //   Vertex 2D en shape: (x_shape, y_shape)
    //   En world-space Three.js: x_world = x_shape - offX
    //                            z_world = -(y_shape) + offZ  (tras rotation.x=-PI/2)
    //   En 3MF (Z-up):           x_3mf = x_world = x_shape - offX
    //                            y_3mf = -z_world = y_shape - offZ  [nota: se simplifica]
    //                            z_3mf = baseZ o topZ

    const totalVerts = nVerts2D * 2;
    const verts = new Float32Array(totalVerts * 3);

    // Cara inferior (índices 0..nVerts2D-1)
    // Cara superior (índices nVerts2D..2*nVerts2D-1)
    for (let i = 0; i < nVerts2D; i++) {
      const sx = pos2D.getX(i); // coordenada X del shape
      const sy = pos2D.getY(i); // coordenada Y del shape

      // Se guardan las coordenadas locales del shape (sin transformar).
      // El offset de posición y la conversión Y-up → Z-up se aplican
      // después, en applyWorldTransformTo3MF, usando matrixWorld del
      // mesh (más preciso que recalcular offX/offZ a mano aquí).

      // Cara inferior: z_3mf = baseZ3mf
      verts[(i)        * 3 + 0] = sx;
      verts[(i)        * 3 + 1] = sy;
      verts[(i)        * 3 + 2] = 0; // z local; se transforma luego

      // Cara superior: z_3mf = topZ3mf (= depth en coord locales)
      verts[(i + nVerts2D) * 3 + 0] = sx;
      verts[(i + nVerts2D) * 3 + 1] = sy;
      verts[(i + nVerts2D) * 3 + 2] = depth3mf; // z local; se transforma luego
    }

    // ── 4. Generar triángulos ────────────────────────────────────────────
    // Cara inferior + cara superior + laterales
    // Estimación conservadora de triángulos
    const approxPerimeterPts = contours.reduce((s, c) => s + c.pts.length, 0);
    const maxTris = nTris2D * 2 + approxPerimeterPts * 2 + 100;
    const indices = [];

    // ── 4a. Cara inferior ── (winding CW vista desde abajo = CCW desde +Z en 3MF)
    // ShapeGeometry genera triángulos CCW vistos desde +Z.
    // La cara inferior debe ser CCW vista desde -Z (abajo), es decir,
    // hay que invertir el winding → (v0, v2, v1).
    for (let t = 0; t < nTris2D; t++) {
      const v0 = triIndex(t, 0);
      const v1 = triIndex(t, 1);
      const v2 = triIndex(t, 2);
      indices.push(v0, v2, v1); // invertido
    }

    // ── 4b. Cara superior ── (misma orientación que ShapeGeometry: CCW desde +Z)
    for (let t = 0; t < nTris2D; t++) {
      const v0 = triIndex(t, 0) + nVerts2D;
      const v1 = triIndex(t, 1) + nVerts2D;
      const v2 = triIndex(t, 2) + nVerts2D;
      indices.push(v0, v1, v2);
    }

    // ── 4c. Caras laterales ──────────────────────────────────────────────
    // Para generar las laterales necesitamos el perímetro en orden.
    // THREE.ShapeUtils.extractContours no existe en r128; usamos
    // ShapeGeometry con otra estrategia: extraer los puntos del shape
    // y generar las laterales manualmente.
    //
    // Necesitamos hacer un índice: shape_point → vertex_index_en_ShapeGeometry.
    // ShapeGeometry en r128 genera los vértices en el mismo orden que
    // Shape.extractPoints(). Usamos eso para mapear.
    const extractedPts = shape.extractPoints(CURVE_SEGS);
    // extractedPts = { shape: [{x,y}], holes: [[{x,y}], ...] }

    // Función para encontrar el índice más cercano en pos2D dado un punto 2D
    // (tolerancia de matching para índices)
    function findVertIdx(px, py, startHint = 0) {
      // Búsqueda exacta (los puntos deben coincidir por ser generados igual)
      for (let i = 0; i < nVerts2D; i++) {
        const dx = pos2D.getX(i) - px;
        const dy = pos2D.getY(i) - py;
        if (dx * dx + dy * dy < 1e-8) return i;
      }
      // Fallback: punto más cercano
      let minD = Infinity, minI = 0;
      for (let i = 0; i < nVerts2D; i++) {
        const dx = pos2D.getX(i) - px;
        const dy = pos2D.getY(i) - py;
        const d = dx * dx + dy * dy;
        if (d < minD) { minD = d; minI = i; }
      }
      return minI;
    }

    // Generar caras laterales para un contorno (exterior o hueco)
    // isHole: si true, se invierte el winding de las laterales para que las normales
    // apunten hacia el interior del hueco (correcto para manifold).
    function addLateralFaces(pts, isHole) {
      const n = pts.length;
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        const p0 = pts[i];
        const p1 = pts[j];

        // Buscar índices en la geometría de ShapeGeometry
        const bot0 = findVertIdx(p0.x, p0.y);
        const bot1 = findVertIdx(p1.x, p1.y);
        const top0 = bot0 + nVerts2D;
        const top1 = bot1 + nVerts2D;

        if (!isHole) {
          // Cara exterior: normal apunta hacia afuera
          // Quad: bot0, bot1, top1, top0
          indices.push(bot0, bot1, top1);
          indices.push(bot0, top1, top0);
        } else {
          // Cara de hueco: normal apunta hacia adentro
          indices.push(bot0, top1, bot1);
          indices.push(bot0, top0, top1);
        }
      }
    }

    // Exterior del shape principal
    addLateralFaces(extractedPts.shape, false);
    // Huecos del shape principal
    extractedPts.holes.forEach(holePts => addLateralFaces(holePts, true));

    // Extrashapes (islas internas): exterior e huecos de cada una
    extraShapes.forEach(sh => {
      const shPts = sh.extractPoints(CURVE_SEGS);
      addLateralFaces(shPts.shape, false);
      shPts.holes.forEach(holePts => addLateralFaces(holePts, true));
    });

    tempGeo.dispose();

    return {
      localVerts: verts,      // en coord locales del shape (Z=0..depth)
      indices: new Uint32Array(indices),
      nVerts: totalVerts,
      nTris: indices.length / 3,
    };
  }

  /* ── applyWorldTransformTo3MF ───────────────────────────────────────────
     Toma los vértices locales del shape y aplica la transformación
     del mesh (matrixWorld) para obtener coordenadas world-space,
     luego convierte a espacio 3MF (Y-up → Z-up).

     Esto es más preciso que recalcular manualmente los offsets,
     ya que respeta transforms del usuario (tx, ty, tz, rotY, scale).
  ─────────────────────────────────────────────────────────────────────── */
  function applyWorldTransformTo3MF(localVerts, mesh, nVerts) {
    mesh.updateMatrixWorld(true);
    const m = mesh.matrixWorld;

    const out = new Float32Array(nVerts * 3);
    for (let i = 0; i < nVerts; i++) {
      // Vértice local del shape: (x_shape, y_shape, z_local)
      // z_local = 0 para cara inferior, depth para superior
      const lx = localVerts[i * 3 + 0];
      const ly = localVerts[i * 3 + 1];
      const lz = localVerts[i * 3 + 2];

      // La ShapeGeometry usa coords (x_shape, y_shape, 0).
      // GeoModule.extrude hace rotation.x = -PI/2 y position = (-offX, baseY, offY).
      // La ExtrudeGeometry extruye en +Z local [0..depth].
      // Entonces: local (x, y, z) → tras rotation.x=-PI/2 → world (x, -z·sin(PI/2)+baseY·0 ... )
      //
      // En lugar de recalcular, aplicamos la matrixWorld directamente.
      // pero la matrixWorld fue calculada para la geometría de ExtrudeGeometry,
      // que tiene: local x=x_shape, local y=y_shape, local z=z_depth.
      // rotation.x = -PI/2 transforma: Y_world = -Z_local, Z_world = Y_local
      //
      // Entonces: aplicar matrixWorld a (lx, ly, lz):
      const wx = m.elements[0]*lx + m.elements[4]*ly + m.elements[8]*lz  + m.elements[12];
      const wy = m.elements[1]*lx + m.elements[5]*ly + m.elements[9]*lz  + m.elements[13];
      const wz = m.elements[2]*lx + m.elements[6]*ly + m.elements[10]*lz + m.elements[14];

      // Convertir Three.js Y-up → 3MF Z-up: x'=x, y'=-z, z'=y
      out[i * 3 + 0] =  wx;
      out[i * 3 + 1] = -wz;
      out[i * 3 + 2] =  wy;
    }
    return out;
  }

  /* ── liftToFloor ────────────────────────────────────────────────────────
     Desplaza todos los grupos de vértices para que el Z mínimo = 0.
  ─────────────────────────────────────────────────────────────────────── */
  function liftToFloor(vertsArray, nVertsArray) {
    let minZ = Infinity;
    vertsArray.forEach((v, i) => {
      for (let j = 0; j < nVertsArray[i]; j++) {
        const z = v[j * 3 + 2];
        if (z < minZ) minZ = z;
      }
    });
    if (!isFinite(minZ) || Math.abs(minZ) < 1e-5) return;
    vertsArray.forEach((v, i) => {
      for (let j = 0; j < nVertsArray[i]; j++) {
        v[j * 3 + 2] -= minZ;
      }
    });
  }

  /* ── getPieceSourceData ─────────────────────────────────────────────────
     Extrae datos fuente serializables para exportar desde los contornos lógicos,
     no desde overlays/picking ni geometría visual accidental.
  ─────────────────────────────────────────────────────────────────────── */
  function getPieceSourceData(piece) {
    const contour = State.contours[piece.contourIdx] || State.contours.find(c => c.piece === piece && !c._deleted);
    if (!contour) return null;

    const sourceIdxs = (piece._mergedSourceIdxs && piece._mergedSourceIdxs.length)
      ? piece._mergedSourceIdxs.filter(i => State.contours[i] && !State.contours[i]._deleted)
      : [State.contours.indexOf(contour)];

    function shapeWithLiveHoles(srcIdx) {
      const src = State.contours[srcIdx] || contour;
      const sh = WindingUtils.makeShapeCCW(src.shape);
      (piece._holeIdxs || []).forEach(hIdx => {
        const h = State.contours[hIdx];
        if (h && h.parentIdx === srcIdx && !h._deleted) sh.holes.push(WindingUtils.makeHoleCW(h.shape));
      });
      return sh;
    }

    const validSourceIdxs = sourceIdxs.length ? sourceIdxs : [State.contours.indexOf(contour)];
    const shape = shapeWithLiveHoles(validSourceIdxs[0]);
    const extraShapes = validSourceIdxs.slice(1).map(shapeWithLiveHoles);

    return {
      shape,
      extraShapes,
      mesh: piece.mesh,
      depth: piece._depth,
      bevel: piece._bevel || 0,
    };
  }

  /* ── collectRenderGeometry ─────────────────────────────────────────────
     Fallback para piezas con bisel: conserva el bisel visual, fusiona vértices
     y elimina triángulos degenerados/duplicados sin cerrar agujeros a ciegas.
  ─────────────────────────────────────────────────────────────────────── */
  function collectRenderGeometry(piece) {
    piece.mesh.updateMatrixWorld(true);
    const geo = piece.mesh.geometry.clone();
    geo.applyMatrix4(piece.mesh.matrixWorld);
    const merged = mergeVerticesManual(geo, 5e-4);

    const pos    = merged.attributes.position;
    const idxBuf = merged.index;
    const nVerts = pos.count;
    const nTris  = idxBuf ? idxBuf.count / 3 : nVerts / 3;

    const verts = new Float32Array(nVerts * 3);
    for (let i = 0; i < nVerts; i++) {
      verts[i * 3 + 0] =  pos.getX(i);
      verts[i * 3 + 1] = -pos.getZ(i);
      verts[i * 3 + 2] =  pos.getY(i);
    }

    const indices = new Uint32Array(nTris * 3);
    if (idxBuf) {
      for (let t = 0; t < nTris; t++) {
        indices[t * 3 + 0] = idxBuf.getX(t * 3 + 0);
        indices[t * 3 + 1] = idxBuf.getX(t * 3 + 1);
        indices[t * 3 + 2] = idxBuf.getX(t * 3 + 2);
      }
    } else {
      for (let t = 0; t < nTris; t++) {
        indices[t * 3 + 0] = t * 3 + 0;
        indices[t * 3 + 1] = t * 3 + 1;
        indices[t * 3 + 2] = t * 3 + 2;
      }
    }
    merged.dispose(); geo.dispose();
    return cleanMeshTriangles(verts, indices);
  }

  /* ── collectManifoldGeometry ────────────────────────────────────────────
     Exporta desde datos fuente cuando no hay bisel; si hay bisel, usa fallback
     de render porque el bisel real requiere triangulación lateral adicional.
  ─────────────────────────────────────────────────────────────────────── */
  function collectManifoldGeometry(piece) {
    const src = getPieceSourceData(piece);
    if (!src) return collectRenderGeometry(piece);

    // Sin bisel: reconstrucción sólida desde shape + holes + extraShapes.
    if (Math.abs(src.bevel || 0) < 1e-6) {
      const absDepth = Math.abs(src.depth || 0.1);
      const local = buildManifoldMesh(src.shape, 0, absDepth, 0, 0, src.extraShapes || []);
      const verts = applyWorldTransformTo3MF(local.localVerts, src.mesh, local.nVerts);
      return cleanMeshTriangles(verts, local.indices);
    }

    // Con bisel: conserva geometría biselada renderizada, pero sin reparación agresiva.
    return collectRenderGeometry(piece);
  }

  /* ── mergeVerticesManual ────────────────────────────────────────────────
     Implementación propia de mergeVertices para cuando
     THREE.BufferGeometryUtils no está disponible.
     Fusiona vértices cuya distancia es < tolerance.
  ─────────────────────────────────────────────────────────────────────── */
  function mergeVerticesManual(geo, tolerance = 0.001) {
    // Convertir a no-indexada primero
    const flat = geo.index ? geo.toNonIndexed() : geo.clone();
    const src  = flat.attributes.position;
    const count = src.count;

    // Mapa: key → índice canónico en newVerts
    const keyMap = new Map();
    const newVerts = [];
    const newIndices = [];

    const inv = 1 / tolerance;
    for (let i = 0; i < count; i++) {
      const x = src.getX(i), y = src.getY(i), z = src.getZ(i);
      const kx = Math.round(x * inv);
      const ky = Math.round(y * inv);
      const kz = Math.round(z * inv);
      const key = `${kx},${ky},${kz}`;
      if (!keyMap.has(key)) {
        keyMap.set(key, newVerts.length / 3);
        newVerts.push(x, y, z);
      }
      newIndices.push(keyMap.get(key));
    }

    flat.dispose();
    const result = new THREE.BufferGeometry();
    result.setAttribute('position', new THREE.Float32BufferAttribute(newVerts, 3));
    result.setIndex(newIndices);
    return result;
  }

  function cleanMeshTriangles(srcVerts, srcIndices) {
    const verts = Array.from(srcVerts);
    const cleanTris = [];
    const seen = new Set();

    function area2(a, b, c) {
      const ax = verts[a*3], ay = verts[a*3+1], az = verts[a*3+2];
      const bx = verts[b*3], by = verts[b*3+1], bz = verts[b*3+2];
      const cx = verts[c*3], cy = verts[c*3+1], cz = verts[c*3+2];
      const ux = bx - ax, uy = by - ay, uz = bz - az;
      const vx = cx - ax, vy = cy - ay, vz = cz - az;
      const nx = uy*vz - uz*vy;
      const ny = uz*vx - ux*vz;
      const nz = ux*vy - uy*vx;
      return nx*nx + ny*ny + nz*nz;
    }

    for (let i = 0; i < srcIndices.length; i += 3) {
      const a = srcIndices[i], b = srcIndices[i + 1], c = srcIndices[i + 2];
      if (a === b || b === c || c === a) continue;
      if (area2(a, b, c) < 1e-12) continue;
      const key = [a, b, c].sort((x, y) => x - y).join(',');
      if (seen.has(key)) continue;
      seen.add(key);
      cleanTris.push(a, b, c);
    }

    return {
      verts: new Float32Array(verts),
      indices: new Uint32Array(cleanTris),
      nVerts: verts.length / 3,
      nTris: cleanTris.length / 3,
    };
  }

  /* ── serializeObject ────────────────────────────────────────────────────
     Genera el XML 3MF para una pieza (colorgroup + object).
  ─────────────────────────────────────────────────────────────────────── */
  function serializeObject(objId, cgId, hex, name, verts, indices, nVerts, nTris) {
    let vertsXML = '';
    for (let i = 0; i < nVerts; i++) {
      const x = verts[i * 3 + 0].toFixed(4);
      const y = verts[i * 3 + 1].toFixed(4);
      const z = verts[i * 3 + 2].toFixed(4);
      vertsXML += `<vertex x="${x}" y="${y}" z="${z}"/>`;
    }

    let trisXML = '';
    for (let t = 0; t < nTris; t++) {
      const v1 = indices[t * 3 + 0];
      const v2 = indices[t * 3 + 1];
      const v3 = indices[t * 3 + 2];
      trisXML += `<triangle v1="${v1}" v2="${v2}" v3="${v3}"/>`;
    }

    const safeName = name
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    return (
      `<m:colorgroup id="${cgId}"><m:color color="#${hex}ff"/></m:colorgroup>\n    ` +
      `<object id="${objId}" name="${safeName}" type="model" pid="${cgId}" pindex="0">` +
        `<mesh>` +
          `<vertices>${vertsXML}</vertices>` +
          `<triangles>${trisXML}</triangles>` +
        `</mesh>` +
      `</object>\n    `
    );
  }

  /* ── exportMeshes ─────────────────────────────────────────────────────
     Punto de entrada principal.
  ─────────────────────────────────────────────────────────────────────── */
  async function exportMeshes(pieces, filename = 'inkora-model') {
    if (!pieces.length) throw new Error('No hay piezas 3D para exportar');

    Utils.toast('Construyendo geometría sólida…', '', 60000);

    // 1. Recolectar geometría manifold para cada pieza
    const allGeoms = pieces.map(p => {
      try {
        return collectManifoldGeometry(p);
      } catch(e) {
        console.error('Error en pieza', p.name, e);
        return null;
      }
    });

    // 2. Bajar todo al plano Z=0
    const validGeoms  = allGeoms.map((g, i) => g);
    const validVerts  = validGeoms.map(g => g ? g.verts  : new Float32Array(0));
    const validNVerts = validGeoms.map(g => g ? g.nVerts : 0);
    liftToFloor(validVerts, validNVerts);

    // 3. Serializar como 3MF
    Utils.toast('Generando 3MF…', '', 60000);
    const zip = new JSZip();
    let allResources = '', buildItems = '';
    let idCounter = 10;

    pieces.forEach((piece, i) => {
      const g = allGeoms[i];
      if (!g || g.nTris === 0) return;

      const objId = idCounter;
      const cgId  = idCounter + 1;
      idCounter  += 2;

      const hex  = hexFromPiece(piece);
      const name = piece.name || `Pieza ${i + 1}`;

      allResources += serializeObject(objId, cgId, hex, name, g.verts, g.indices, g.nVerts, g.nTris);
      buildItems   += `<item objectid="${objId}"/>\n    `;
    });

    if (!buildItems.trim()) {
      throw new Error('No se pudo generar geometría para ninguna pieza.');
    }

    const modelXML = `<?xml version="1.0" encoding="UTF-8"?>
<model unit="millimeter" xml:lang="en-US"
  xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02"
  xmlns:m="http://schemas.microsoft.com/3dmanufacturing/material/2015/02">
  <metadata name="Application">INKORA 3D Modeler v9</metadata>
  <metadata name="CreationDate">${new Date().toISOString().slice(0, 10)}</metadata>
  <resources>
    ${allResources.trim()}
  </resources>
  <build>
    ${buildItems.trim()}
  </build>
</model>`;

    zip.file('[Content_Types].xml',
      `<?xml version="1.0" encoding="UTF-8"?>` +
      `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
        `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
        `<Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/>` +
      `</Types>`
    );
    zip.file('_rels/.rels',
      `<?xml version="1.0" encoding="UTF-8"?>` +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
        `<Relationship Target="/3D/3dmodel.model" Id="r1" ` +
          `Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/>` +
      `</Relationships>`
    );
    zip.file('3D/3dmodel.model', modelXML);

    const blob = await zip.generateAsync({ type: 'blob' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename + '.3mf'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  return { exportMeshes };
})();


/* ══════════════════════════════════════════════════════
   MÓDULO 5 — HISTORIAL (UNDO / REDO)
   Estrategia: snapshot completo del estado lógico antes
   de cada operación destructiva. Dado que las geometrías
   Three.js no son serializables, guardamos los datos
   fuente (shape, offX, offY, color, depth, bevel) y
   reconstruimos la escena completa al restaurar.

   Operaciones que generan snapshot:
     - Cargar DXF (loadDXF)
     - Extruir selección (btn-extrude)
     - Cambiar color de pieza (piece-color-picker)
     - Limpiar escena (btn-clear)

   EXTENSIÓN: snapshot incremental (diff), persistencia en
   IndexedDB, integración con backend, límite configurable.
   ══════════════════════════════════════════════════════ */
const History = (() => {
  const MAX = 60;          // máximo de snapshots en memoria
  let stack = [];          // [snapshot_0 ... snapshot_N]  (pasado → presente)
  let cursor = -1;         // índice del snapshot activo
  let _onChange = null;    // callback para actualizar botones

  /* ── Snapshot ────────────────────────────────────────
     Captura el estado lógico completo de la escena.
     No guarda refs a objetos Three.js — sólo datos planos.
  ─────────────────────────────────────────────────────── */
  function snapshot(state) {
    return {
      filename: state.filename,
      groups: state.groups.map(g => ({ ...g, memberIdxs: [...g.memberIdxs] })),
      _nextGroupId: state._nextGroupId,
      contours: state.contours.map(c => ({
        // Referencia a la shape original (objeto Three.Shape inmutable en uso)
        shape:   c.shape,
        offX:    c.offX,
        offY:    c.offY,
        depth:   c.depth,
        parentIdx: c.parentIdx,
        layer:   c.layer || '0',
        color:   c.color || '#dedcff',
        sel2D:   c.sel2D,
        extruded: c.extruded,
        depthOverride: c.depthOverride ?? null,  // profundidad individual por contorno
        // Guardar si el contorno fue absorbido como hueco de otra pieza.
        absorbed: c.extruded && c.piece === null && !c._isFakeContour,
        // Flag de contorno ficticio (creado al extruir sobre pieza 3D)
        isFakeContour: !!c._isFakeContour,
        panelHidden: !!c._panelHidden,
        deleted: !!c._deleted,
        linkedPieceIdx: c.piece && c.piece.contourIdx !== state.contours.indexOf(c) ? c.piece.contourIdx : null,
        // datos de la pieza extruida, si existe
        pieceData: c.piece && c.piece.contourIdx === state.contours.indexOf(c) ? {
          name:     c.piece.name,
          color:    c.piece.color,
          depth:    c.piece._depth,
          bevel:    c.piece._bevel,
          bevelSeg: c.piece._bevelSeg,
          holeIdxs: c.piece._holeIdxs || [],
          mergedSourceIdxs: c.piece._mergedSourceIdxs || [],
          sourceContourIdx: c.piece._sourceContourIdx ?? null,
          visible: c.piece.mesh ? c.piece.mesh.visible !== false : true,
          // Transform por pieza (serializable)
          tx:    c.piece.tx    || 0,
          ty:    c.piece.ty    || 0,
          tz:    c.piece.tz    || 0,
          rotY:  c.piece.rotY  || 0,
          scale: c.piece.scale || 1,
          // Posición base (asignada por GeoModule, antes del transform del usuario)
          baseX: c.piece._baseX || 0,
          baseY: c.piece._baseY || 0,
          baseZ: c.piece._baseZ || 0,
        } : null,
      })),
    };
  }

  /* ── push ────────────────────────────────────────────
     Llamar ANTES de cada operación destructiva.
     Descarta el futuro si el cursor no está al final.
  ─────────────────────────────────────────────────────── */
  function push(state) {
    // Descartar redo-branch
    if (cursor < stack.length - 1) stack.splice(cursor + 1);
    stack.push(snapshot(state));
    if (stack.length > MAX) stack.shift();
    cursor = stack.length - 1;
    _onChange && _onChange();
  }

  /* ── undo / redo ─────────────────────────────────────
     Retornan el snapshot destino, o null si no es posible.
     El caller es responsable de reconstruir la escena.
  ─────────────────────────────────────────────────────── */
  function undo() {
    if (cursor <= 0) return null;
    cursor--;
    _onChange && _onChange();
    return stack[cursor];
  }
  function redo() {
    if (cursor >= stack.length - 1) return null;
    cursor++;
    _onChange && _onChange();
    return stack[cursor];
  }

  function canUndo() { return cursor > 0; }
  function canRedo() { return cursor < stack.length - 1; }
  function label()   {
    if (stack.length === 0) return '— / —';
    // Muestra: pasos_atrás_disponibles / pasos_adelante_disponibles
    return `↩${cursor} ↪${stack.length - 1 - cursor}`;
  }
  function onChange(cb) { _onChange = cb; }

  /* ── clear ───────────────────────────────────────────
     Llamar al cargar un DXF nuevo (reset total).
  ─────────────────────────────────────────────────────── */
  function clear() { stack = []; cursor = -1; _onChange && _onChange(); }

  return { push, undo, redo, canUndo, canRedo, label, onChange, clear };
})();


/* ══════════════════════════════════════════════════════
   MÓDULO 6 — TRANSFORMACIONES POR PIEZA
   Gizmo visual 3D (handles de traslación y escala) +
   inputs numéricos en el panel.

   Cada pieza tiene: tx, ty, tz (mm), rotY (grados), scale.
   El gizmo es un overlay Three.js sobre el mesh seleccionado:
   - Modo Mover : tres flechas coloreadas (X=rojo, Y=verde, Z=azul)
   - Modo Escalar: cubo central + handles en esquinas

   El transform se aplica como position + scale en el mesh;
   al exportar, matrixWorld ya incluye estos valores.

   EXTENSIÓN: rotación en X y Z, snap a grilla, alineación
   entre piezas, operaciones de espejo, multi-selección.
   ══════════════════════════════════════════════════════ */
const TransformModule = (() => {
  /* ── Estado interno ──────────────────────────────── */
  let _activeMesh   = null;   // mesh actualmente transformado
  let _activePiece  = null;   // referencia al piece object
  let _scene        = null;
  let _camera       = null;
  let _canvas       = null;
  let _renderer     = null;

  /* ── init ────────────────────────────────────────── */
  function init(scene, camera, canvas, renderer) {
    _scene = scene; _camera = camera; _canvas = canvas; _renderer = renderer;
  }

  /* ── Seleccionar / deseleccionar ─────────────────── */
  function select(mesh, piece) {
    _activeMesh  = mesh;
    _activePiece = piece;
  }

  function deselect() { select(null, null); }

  /* ── Aplicar transform almacenado al mesh ────────── */
  function _applyToPieceMesh(mesh, piece) {
    mesh.position.x = (piece._baseX || 0) + (piece.tx || 0);
    mesh.position.y = (piece._baseY || 0) + (piece.ty || 0);
    mesh.position.z = (piece._baseZ || 0) + (piece.tz || 0);
    mesh.rotation.y = ((piece.rotY || 0) * Math.PI) / 180;
    const s = piece.scale || 1;
    mesh.scale.set(s, s, s);
  }

  function restoreTransform(mesh, piece) {
    if (piece._baseX === undefined) piece._baseX = mesh.position.x;
    if (piece._baseY === undefined) piece._baseY = mesh.position.y;
    if (piece._baseZ === undefined) piece._baseZ = mesh.position.z;
    _applyToPieceMesh(mesh, piece);
  }

  /* ── Sincronizar inputs del panel con pieza activa ── */
  function syncPanel() {
    // Panel de transform eliminado; se conserva como no-op para selección/restauración.
  }

  function hidePanel() {
    // Panel de transform eliminado.
  }

  return {
    init, select, deselect,
    restoreTransform, syncPanel, hidePanel,
  };
})();



/* ══════════════════════════════════════════════════════
   ESTADO CENTRAL
   EXTENSIÓN: localStorage, undo/redo, backend sync.
   ══════════════════════════════════════════════════════ */
const State = {
  filename:null,
  contours:[],        // {shape,offX,offY,flatMesh,outlineMesh,sel2D,extruded,piece}
  pieces:[],          // {mesh,name,color,contourIdx}
  selectedPieceIdx:null,        // legacy: índice de la ÚLTIMA pieza activa (para gizmo/transform)
  selectedIdxs: new Set(),      // Set<contourIdx> — selección múltiple unificada (2D y 3D)
  selectedFaces: new Map(),     // contourIdx -> 'top' | 'bottom' para extruir desde la cara visible
  groups:[],                    // [{id,name,collapsed,memberIdxs:[contourIdx,...]}]
  _nextGroupId:1,
  extrudeMode:'separate',
  colorTargetIdxs:null,
  reset(){
    this.filename=null;
    this.contours=[];
    this.pieces=[];
    this.selectedPieceIdx=null;
    this.selectedIdxs=new Set();
    this.selectedFaces=new Map();
    this.groups=[];
    this._nextGroupId=1;
    this.colorTargetIdxs=null;
  },
};

function safeSelectionFace(c) {
  if (!c || !c.extruded) return 'top';
  try {
    if (typeof viewFaceForContour === 'function') {
      return viewFaceForContour(c) === 'bottom' ? 'bottom' : 'top';
    }
  } catch (_) {}
  return 'top';
}


/* ══════════════════════════════════════════════════════
   MÓDULO 7 — UI DEL PANEL
   Selección unificada (2D + 3D), grupos, multi-select,
   Ctrl+click, Shift+click, renombrar, Ctrl+G/Ctrl+U.
   EXTENSIÓN: drag&drop para reordenar, búsqueda.
   ══════════════════════════════════════════════════════ */
const PanelUI = (() => {
  const NEUTRAL='#44445a', SEL='#7c6cff';

  // Índice del último contorno tocado (para Shift+click de rango)
  let _lastTouchedIdx = -1;

  // ── Selección unificada ────────────────────────────────────────────────────
  // Toda selección pasa por estas funciones. selectedIdxs guarda índices de
  // contornos (2D y 3D). selectedPieceIdx sigue siendo el índice de la pieza
  // activa para el gizmo (solo se actualiza cuando hay exactamente 1 3D sel.).

  function _selectOne(idx, additive, rangeFrom, face = 'top') {
    if (!additive && !rangeFrom) {
      // Selección simple: limpiar todo y seleccionar solo este
      _clearAllSelection();
    }
    if (rangeFrom !== undefined && rangeFrom !== null && rangeFrom !== -1) {
      // Rango: seleccionar desde rangeFrom hasta idx
      const a = Math.min(rangeFrom, idx), b = Math.max(rangeFrom, idx);
      // Solo contornos visibles y no absorbidos
      for (let i = a; i <= b; i++) {
        const c = State.contours[i];
        if (!Utils.isVisibleContour(c)) continue;
        State.selectedIdxs.add(i);
        State.selectedFaces.set(i, face);
        if (!c.extruded) c.sel2D = true;
      }
    } else {
      const c = State.contours[idx];
      if (!Utils.isVisibleContour(c)) return;
      if (additive && State.selectedIdxs.has(idx)) {
        // Toggle off
        State.selectedIdxs.delete(idx);
        State.selectedFaces.delete(idx);
        if (!c.extruded) c.sel2D = false;
      } else {
        State.selectedIdxs.add(idx);
        State.selectedFaces.set(idx, face);
        if (!c.extruded) c.sel2D = true;
      }
    }
    _lastTouchedIdx = idx;
    _syncPieceSelection();
  }

  function _clearAllSelection() {
    State.selectedIdxs.clear();
    State.selectedFaces.clear();
    State.contours.forEach(c => { c.sel2D = false; });
    Viewport.clearEmissive(Viewport.group3D());
    State.selectedPieceIdx = null;
    TransformModule.deselect();
    TransformModule.hidePanel();
  }

  function _syncPieceSelection() {
    // Actualizar emissive en piezas 3D
    Viewport.clearEmissive(Viewport.group3D());
    const sel3D = [];
    State.selectedIdxs.forEach(idx => {
      const c = State.contours[idx];
      if (c && c.extruded && c.piece) {
        sel3D.push({ idx, c });
        Viewport.setEmissive(c.piece.mesh, 0xffffff, 1);
      }
    });
    // Gizmo + transform panel: solo si hay exactamente 1 pieza 3D seleccionada
    if (sel3D.length === 1) {
      const { idx, c } = sel3D[0];
      State.selectedPieceIdx = State.pieces.indexOf(c.piece);
      const piece = c.piece;
      if (piece._baseX === undefined) { piece._baseX = piece.mesh.position.x; piece._baseY = piece.mesh.position.y; piece._baseZ = piece.mesh.position.z; }
      TransformModule.select(piece.mesh, piece);
      TransformModule.syncPanel();
    } else {
      State.selectedPieceIdx = sel3D.length > 0 ? State.pieces.indexOf(sel3D[sel3D.length-1].c.piece) : null;
      TransformModule.deselect();
      TransformModule.hidePanel();
    }
    // Actualizar botón extruir según selección actual
    updateButtons();
  }

  function refreshContourVisuals(){
    State.contours.forEach((c, idx) => {
      if(!c.flatMesh)return;
      const mat=c.flatMesh.material;

      if(c.extruded){
        c.flatMesh.visible=false;
        if(c.outlineMesh)c.outlineMesh.visible=false;
      } else if(!Utils.isVisibleContour(c)){
        c.flatMesh.visible=false;
        if(c.outlineMesh){
          c.outlineMesh.visible=true;
          c.outlineMesh.material.color.set(c.color || '#dedcff');
          c.outlineMesh.material.opacity=0.75;
          c.outlineMesh.material.depthTest=false;
          c.outlineMesh.material.depthWrite=false;
          c.outlineMesh.renderOrder=9999;
        }
      } else if(c.sel2D){
        mat.color.set(SEL);
        mat.opacity=0.22;
        mat.colorWrite=true;
        mat.depthWrite=false;
        c.flatMesh.visible=true;

        if(c.outlineMesh){
          c.outlineMesh.visible=true;
          c.outlineMesh.material.color.set(0xffffff);
          c.outlineMesh.material.opacity=1;
          c.outlineMesh.material.depthTest=false;
          c.outlineMesh.material.depthWrite=false;
          c.outlineMesh.renderOrder=9999;
        }
      } else {
        mat.color.set(c.color || NEUTRAL);
        mat.opacity=0;
        mat.colorWrite=false;
        mat.depthWrite=false;
        c.flatMesh.visible=true;

        if(c.outlineMesh){
          c.outlineMesh.visible=true;
          c.outlineMesh.material.color.set(c.color || '#dedcff');
          c.outlineMesh.material.opacity=0.95;
          c.outlineMesh.material.depthTest=false;
          c.outlineMesh.material.depthWrite=false;
          c.outlineMesh.renderOrder=9999;
        }
      }
    });
    Viewport.group3D().traverse(o => {
      if (!o.isLine || o.userData?._pickContourIdx == null || !o.material) return;
      const idx = o.userData._pickContourIdx;
      const selectedFace = State.selectedFaces.get(idx) || 'top';
      const lineFace = o.userData._pickFace || 'top';
      const selected = State.selectedIdxs.has(idx) && selectedFace === lineFace;
      o.material.color.set(selected ? 0xffffff : 0x222222);
      o.material.opacity = selected ? 1 : 0.95;
      o.material.depthTest = !selected;
      o.renderOrder = selected ? 10002 : 10000;
    });
  }

  /* ── renderList ──────────────────────────────────────────────────────
     Reconstrucción completa del árbol de lista. Soporta grupos con
     expand/collapse. Los contornos no agrupados van al final.
     EXTENSIÓN: patch incremental cuando grupos no cambian.
  ─────────────────────────────────────────────────────────────────────── */
  function renderList(){
    const wrap      = document.getElementById('pieces-wrap');
    const empty     = document.getElementById('empty-state');
    const count     = document.getElementById('pieces-count');
    const selAllRow = document.getElementById('sel-all-row');

    // Guardar posición de scroll antes de reconstruir el DOM
    const scrollTop = wrap.scrollTop;

    const visibleCount = State.contours.filter((c, i) => Utils.isPanelContour(c, i)).length;
    if (!visibleCount) {
      empty.style.display = 'flex';
      count.textContent = '(0)';
      selAllRow.style.display = 'none';
      [...wrap.children].forEach(ch => { if (ch !== empty) ch.remove(); });
      return;
    }

    empty.style.display = 'none';
    count.textContent   = `(${visibleCount})`;
    selAllRow.style.display = 'flex';

    // Reconstrucción completa (grupos cambian con frecuencia)
    [...wrap.children].forEach(ch => { if (ch !== empty) ch.remove(); });

    // Índices agrupados
    const groupedIdxs = new Set(State.groups.flatMap(g => g.memberIdxs));

    // 1. Grupos primero
    State.groups.forEach(group => {
      wrap.appendChild(_buildGroup(group));
    });

    // 2. Contornos no agrupados
    State.contours.forEach((c, idx) => {
      if (groupedIdxs.has(idx)) return; // ya está en un grupo
      if (!Utils.isPanelContour(c, idx)) return;
      wrap.appendChild(_buildItem(c, idx, false));
    });

    updateSelCount(); updateHUD(); updateButtons();

    // Restaurar posición de scroll (evita que el panel salte al reconstruir el DOM)
    wrap.scrollTop = scrollTop;
  }

  /* ── Construir un grupo ──────────────────────────────────────────────── */
  function _buildGroup(group) {
    const wrapper = document.createElement('div');
    wrapper.dataset.groupId = group.id;

    // ── Cabecera del grupo ──
    const header = document.createElement('div');
    header.className = 'group-item' + (group._selGroup ? ' sel-group' : '');

    const arrow = document.createElement('span');
    arrow.className = 'group-arrow' + (!group.collapsed ? ' open' : '');
    arrow.textContent = '▶';

    const nameEl = document.createElement('span');
    nameEl.className = 'group-name';
    nameEl.textContent = group.name;

    const countEl = document.createElement('span');
    countEl.className = 'group-count';
    countEl.textContent = `(${group.memberIdxs.filter(i => Utils.isPanelContour(State.contours[i], i)).length})`;

    header.append(arrow, nameEl, countEl);
    wrapper.appendChild(header);

    // ── Hijos ──
    const children = document.createElement('div');
    children.className = 'group-children' + (!group.collapsed ? ' open' : '');
    group.memberIdxs.forEach(idx => {
      const c = State.contours[idx];
      if (!Utils.isPanelContour(c, idx)) return;
      children.appendChild(_buildItem(c, idx, true));
    });
    wrapper.appendChild(children);

    // ── Click en cabecera: toggle collapse o seleccionar grupo ──
    header.addEventListener('click', e => {
      if (e.target.tagName === 'INPUT') return;
      const isCtrl = e.ctrlKey || e.metaKey;
      if (isCtrl) {
        // Ctrl+click en grupo: toggle selección de todos sus miembros
        const visibleMembers = group.memberIdxs.filter(i => Utils.isVisibleContour(State.contours[i]));
        const allSel = visibleMembers.length > 0 && visibleMembers.every(i => State.selectedIdxs.has(i));
        if (allSel) {
          visibleMembers.forEach(i => { State.selectedIdxs.delete(i); State.selectedFaces.delete(i); const c=State.contours[i]; if(c&&!c.extruded)c.sel2D=false; });
        } else {
          visibleMembers.forEach(i => {
            const c=State.contours[i]; if(!Utils.isVisibleContour(c))return;
            State.selectedIdxs.add(i); State.selectedFaces.set(i, safeSelectionFace(c)); if(!c.extruded)c.sel2D=true;
          });
        }
        _lastTouchedIdx = visibleMembers[visibleMembers.length - 1] ?? -1;
        _syncPieceSelection();
      } else {
        // Click simple: seleccionar todo el grupo y toggle collapse
        _clearAllSelection();
        const visibleMembers = group.memberIdxs.filter(i => Utils.isVisibleContour(State.contours[i]));
        visibleMembers.forEach(i => {
          const c=State.contours[i]; if(!Utils.isVisibleContour(c))return;
          State.selectedIdxs.add(i); State.selectedFaces.set(i, safeSelectionFace(c)); if(!c.extruded)c.sel2D=true;
        });
        _lastTouchedIdx = visibleMembers[visibleMembers.length - 1] ?? -1;
        _syncPieceSelection();
        // Toggle collapse si el click fue en la flecha
        if (e.target === arrow || e.target.classList.contains('group-arrow')) {
          group.collapsed = !group.collapsed;
        }
      }
      refreshContourVisuals();
      renderList();
      updateModeBadge();
      updateColorPanel();
    });

    // ── Doble click: renombrar grupo ──
    header.addEventListener('dblclick', e => {
      e.stopPropagation();
      const prev = group.name;
      const inp = document.createElement('input');
      inp.className = 'group-name-input';
      inp.value = prev; inp.maxLength = 40;
      nameEl.replaceWith(inp);
      inp.focus(); inp.select();
      function commit() {
        const next = inp.value.trim() || prev;
        group.name = next;
        const span = document.createElement('span');
        span.className = 'group-name'; span.textContent = next;
        inp.replaceWith(span);
        if (next !== prev) History.push(State);
      }
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
        if (e.key === 'Escape') { inp.value = prev; inp.blur(); }
      });
      inp.addEventListener('blur', commit);
    });

    return wrapper;
  }

  /* Construye un nodo DOM para un contorno.
     Soporta: click simple, Ctrl+click, Shift+click, doble click rename.
  */
  function _buildItem(c, idx, inGroup) {
    const item = document.createElement('div');
    item.className  = 'piece-item' + (inGroup ? ' in-group' : '');
    item.dataset.idx = idx;

    const row1 = document.createElement('div');
    row1.className = 'p-row1';

    // Swatch + hidden color input (solo para piezas 3D)
    const swatchWrap = document.createElement('div');
    swatchWrap.style.cssText = 'position:relative;flex-shrink:0;display:flex;align-items:center;';
    const swatch = document.createElement('div');
    swatch.className = 'p-swatch';
    swatch.title = 'Cambiar color';
    swatchWrap.append(swatch);

    const name = document.createElement('div');
    name.className = 'p-name';
    const dims = document.createElement('span');
    dims.className = 'p-dims';
    const tag = document.createElement('span');
    tag.className = 'p-tag';
    row1.append(swatchWrap, name, dims, tag);
    item.appendChild(row1);

    // ── Color picker inline en el swatch ──
    swatchWrap.addEventListener('click', e => {
      e.stopPropagation();
      const i = parseInt(item.dataset.idx, 10);
      const ct = State.contours[i];
      if (!ct || !ct.extruded || !ct.piece) return;
      PanelUI.openColorPopoverFor(i, e.clientX, e.clientY);
    });

    // ── Click: selección unificada (simple / Ctrl / Shift) ──
    // Usamos un timer para no interferir con el doble click sobre el nombre
    let _clickTimer = null;
    item.addEventListener('click', e => {
      if (e.target.tagName === 'INPUT') return;
      // Si el click fue sobre el nombre, esperar brevemente por un posible dblclick
      const nameEl = item.querySelector('.p-name');
      const onName = nameEl && nameEl.contains(e.target);
      clearTimeout(_clickTimer);
      _clickTimer = setTimeout(() => {
        const i = parseInt(item.dataset.idx, 10);
        const ct = State.contours[i];
        if (!Utils.isVisibleContour(ct)) return;
        _selectOne(i, e.ctrlKey || e.metaKey, e.shiftKey ? _lastTouchedIdx : undefined);
        refreshContourVisuals();
        renderList();
        updateModeBadge();
        updateColorPanel();
      }, onName ? 220 : 0);
    });

    // ── Doble click en el nombre: renombrar ──
    item.addEventListener('dblclick', e => {
      // Solo activar si el doble click fue sobre el texto del nombre
      const nameEl = item.querySelector('.p-name');
      if (!nameEl || !nameEl.contains(e.target)) return;
      clearTimeout(_clickTimer); // cancelar el click simple pendiente
      e.stopPropagation();
      const i  = parseInt(item.dataset.idx, 10);
      const ct = State.contours[i];
      if (!ct || nameEl.tagName === 'INPUT') return;
      const is3D = ct.extruded && ct.piece;
      const prev = is3D ? ct.piece.name : nameEl.textContent;
      const inp  = document.createElement('input');
      inp.className = 'p-name-input';
      inp.value = prev; inp.maxLength = 40;
      nameEl.replaceWith(inp);
      inp.focus(); inp.select();
      function commit() {
        const next = inp.value.trim() || prev;
        const span = document.createElement('div');
        span.className = 'p-name'; span.textContent = next;
        inp.replaceWith(span);
        if (next === prev) return;
        // Aplicar nombre a TODOS los seleccionados del mismo tipo
        if (is3D) {
          // Renombrar todas las piezas 3D seleccionadas con nombre secuencial
          const sel3D = [...State.selectedIdxs].filter(si => {
            const sc = State.contours[si]; return sc && sc.extruded && sc.piece;
          });
          if (sel3D.length === 1) {
            ct.piece.name = next;
          } else {
            sel3D.forEach((si, n) => {
              State.contours[si].piece.name = sel3D.length > 1 ? `${next} ${n + 1}` : next;
            });
          }
          const pIdx = State.pieces.indexOf(ct.piece);
          if (pIdx !== -1 && State.selectedPieceIdx === pIdx) {
            const tpn = document.getElementById('transform-piece-name');
            if (tpn) tpn.textContent = ct.piece.name;
          }
        }
        renderList();
        History.push(State);
      }
      inp.addEventListener('keydown', ev => {
        if (ev.key === 'Enter')  { ev.preventDefault(); inp.blur(); }
        if (ev.key === 'Escape') { inp.value = prev; inp.blur(); }
      });
      inp.addEventListener('blur', commit);
    });

    _patchItem(item, c, idx);
    return item;
  }

  /* ── _patchItem ───────────────────────────────────────────────────────
     Actualiza sólo los atributos visuales de una fila ya existente.
     Llamado en cada renderList() cuando el conteo no cambió.
  ────────────────────────────────────────────────────────────────────── */
  function _patchItem(item, c, idx) {
    const isSel = State.selectedIdxs.has(idx);
    // Clases de estado
    const wantSel2D    = !c.extruded && c.sel2D;
    const wantSel3D    = c.extruded && isSel;
    const wantExtruded = c.extruded;
    if (wantSel2D    !== item.classList.contains('sel-2d'))   item.classList.toggle('sel-2d', wantSel2D);
    if (wantSel3D    !== item.classList.contains('sel-3d'))   item.classList.toggle('sel-3d', wantSel3D);
    if (wantExtruded !== item.classList.contains('extruded')) item.classList.toggle('extruded', wantExtruded);

    // Swatch color
    const swatch = item.querySelector('.p-swatch');
    const wantBg = c.extruded ? (c.piece?.color || '#c8c8d0') : (c.sel2D ? SEL : (c.color || NEUTRAL));
    if (swatch && swatch.style.background !== wantBg) swatch.style.background = wantBg;

    // Sincronizar valor del color input inline y mostrar/ocultar según tipo
    const colorInp = item.querySelector('input[type="color"]');
    if (colorInp) {
      if (c.extruded && c.piece) {
        colorInp.value = c.piece.color || '#c8c8d0';
        colorInp.style.display = '';
        colorInp.style.cursor = 'pointer';
      } else {
        colorInp.style.display = 'none'; // no tiene sentido en 2D
      }
    }

    // Nombre — no tocar si hay un input de rename activo
    const nameEl    = item.querySelector('.p-name, .p-name-input');
    const isEditing = nameEl && nameEl.tagName === 'INPUT';
    if (!isEditing) {
      const wantName = c.extruded ? (c.piece?.name ?? '—') : `Contorno ${String(idx + 1).padStart(2, '0')}`;
      if (nameEl && nameEl.textContent !== wantName) nameEl.textContent = wantName;
    }

    // Dimensiones reales (solo 3D) — calcula el bounding box del mesh
    // incluyendo transform del usuario. Se recomputa cada vez que renderList
    // es llamado (escala puede haber cambiado).
    // EXTENSIÓN: mostrar también posición X/Z, área estimada de cara.
    const dimsEl = item.querySelector('.p-dims');
    if (dimsEl) {
      if (c.extruded && c.piece?.mesh) {
        const box  = new THREE.Box3().setFromObject(c.piece.mesh);
        const size = box.getSize(new THREE.Vector3());
        // Three.js extruye en Y, la malla está rotada -90° X,
        // así que el eje de extrusión queda en Y del world.
        const w = size.x.toFixed(1), d = size.z.toFixed(1), h = size.y.toFixed(1);
        const txt = `${w}×${d}×${h}`;
        if (dimsEl.textContent !== txt) dimsEl.textContent = txt;
        dimsEl.style.display = '';
      } else {
        dimsEl.style.display = 'none';
      }
    }

    // Tag
    const tagEl  = item.querySelector('.p-tag');
    const wantTag = c.extruded ? '3D' : '2D';
    if (tagEl && tagEl.textContent !== wantTag) tagEl.textContent = wantTag;
    if (tagEl) tagEl.classList.toggle('is-3d', c.extruded);

    // Actualizar índice (puede haber cambiado en undo/redo)
    item.dataset.idx = idx;
  }

  function toggleSel(idx){
    // Legacy: usado por la tecla 'E' de extrude; funciona igual que antes
    const c=State.contours[idx];
    if(c.extruded)return;
    c.sel2D=!c.sel2D;
    if(c.sel2D) { State.selectedIdxs.add(idx); State.selectedFaces.set(idx, 'top'); }
    else { State.selectedIdxs.delete(idx); State.selectedFaces.delete(idx); }
    refreshContourVisuals();renderList();
  }
  function selectAll(){
    State.contours.forEach((c,i)=>{
      if(!Utils.isPanelContour(c, i))return;
      if(!c.extruded)c.sel2D=true;
      State.selectedIdxs.add(i);
      State.selectedFaces.set(i, safeSelectionFace(c));
    });
    _syncPieceSelection();
    refreshContourVisuals();renderList();
  }
  function selectNone(){
    _clearAllSelection();
    refreshContourVisuals();renderList();
  }

  function updateSelCount(){
    const n2D = State.contours.filter(c=>Utils.isVisibleContour(c)&&c.sel2D&&!c.extruded).length;
    const n3D = State.selectedIdxs.size - n2D;
    const n   = State.selectedIdxs.size;
    document.getElementById('sel-count-label').textContent=`${n} seleccionado${n!==1?'s':''}`;
    const badge=document.getElementById('sel-badge');
    if(n>0){badge.style.display='inline';badge.textContent=`${n} sel.`;}
    else badge.style.display='none';
  }
  function updateHUD(){
    document.getElementById('h-pieces').textContent=State.contours.filter((c, i) => Utils.isPanelContour(c, i)).length;
    document.getElementById('h-sel').textContent=State.contours.filter(c=>Utils.isVisibleContour(c)&&c.sel2D&&!c.extruded).length;
    document.getElementById('h-3d').textContent=State.pieces.length;
  }
  function updateButtons(){
    const has2D = State.contours.some(c => c.sel2D && !c.extruded);
    const has3D = [...State.selectedIdxs].some(idx => { const c = State.contours[idx]; return c && c.extruded && c.piece; });
    document.getElementById('btn-extrude').disabled = !has2D && !has3D;
    document.getElementById('btn-export').disabled=!State.pieces.length;
    document.getElementById('btn-clear').disabled=!State.contours.length;
  }
  function updateModeBadge(){
    const badge=document.getElementById('mode-badge');
    const hint=document.getElementById('sel-hint');
    const n2D=State.contours.filter(c=>Utils.isVisibleContour(c)&&c.sel2D&&!c.extruded).length;
    const nTotal=State.selectedIdxs.size;
    if(!State.contours.some(Utils.isVisibleContour)){badge.textContent='Sin geometría';badge.className='';hint.textContent='';return;}
    if(n2D>0){badge.textContent=`${n2D} contorno(s) seleccionado(s)`;badge.className='selecting';hint.textContent='Ajustá la profundidad en el panel y presioná Extruir';}
    else if(nTotal>0){badge.textContent=`${nTotal} pieza(s) seleccionada(s)`;badge.className='selecting';hint.textContent='';}
    else{badge.textContent='Click en silueta o lista para seleccionar';badge.className='';hint.textContent='';}
  }
  function updateColorPanel(){ /* sección eliminada — color se cambia inline en cada item */ }

  /* ── highlightRow ──────────────────────────────────────────────────────
     Se llama en cada mousemove sobre el viewport — debe ser rápida.
     En vez de querySelectorAll (busca en todo el DOM), usa dataset.idx
     para localizar directamente la fila del contorno activo.
     Guarda el índice anterior para quitar la clase solo de esa fila.
  ─────────────────────────────────────────────────────────────────────── */
  let _lastHoverIdx = -1;
  function highlightRow(hit){
    let idx = -1;
    if (hit) {
      if (hit.is3D) {
        const pIdx = State.pieces.findIndex(p => p.mesh === hit.mesh);
        if (pIdx !== -1) idx = State.contours.findIndex(c => c.piece === State.pieces[pIdx]);
      } else {
        idx = State.contours.findIndex(c => c.flatMesh === hit.mesh || c.outlineMesh === hit.mesh);
      }
    }
    if (idx === _lastHoverIdx) return; // sin cambio → no tocar el DOM

    // Quitar hover del anterior
    if (_lastHoverIdx !== -1) {
      const prev = document.querySelector(`.piece-item[data-idx="${_lastHoverIdx}"]`);
      if (prev) prev.classList.remove('vp-hover');
    }
    // Poner hover en el nuevo
    if (idx !== -1) {
      const next = document.querySelector(`.piece-item[data-idx="${idx}"]`);
      if (next) next.classList.add('vp-hover');
    }
    _lastHoverIdx = idx;
  }

  function scrollToItem(idx) {
    if (idx == null || idx < 0) return;
    const el = document.querySelector(`.piece-item[data-idx="${idx}"]`);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function selectedColorTargets() {
    const source = State.colorTargetIdxs || State.selectedIdxs;
    return [...source]
      .map(i => ({ idx: i, c: State.contours[i] }))
      .filter(({ c }) => c && c.extruded && c.piece);
  }

  function applyColorToSelection(hex, pushHistory = false) {
    const targets = selectedColorTargets();
    if (!targets.length) return false;
    targets.forEach(({ c }) => {
      c.piece.color = hex;
      c.piece.mesh.material.color.set(hex);
      c.piece.mesh.userData._highlightOrigColor = new THREE.Color(hex).getHex();
      c.piece.mesh.material.emissive?.set(0x000000);
      c.piece.mesh.material.emissiveIntensity = 0;
      if (pushHistory && c.piece.mesh.userData._selected) Viewport.applyHighlight(c.piece.mesh, 'select');
    });
    renderList();
    if (pushHistory) {
      State.colorTargetIdxs = null;
      History.push(State);
    }
    return true;
  }

  function openColorPopoverAt(x, y) {
    State.colorTargetIdxs = null;
    const targets = selectedColorTargets();
    if (!targets.length) {
      Utils.toast('Seleccioná una pieza 3D para cambiar color.', 'err');
      return;
    }
    const pop = document.getElementById('color-popover');
    pop.dataset.color = targets[0].c.piece.color || '#c8c8d0';
    pop.style.display = 'block';
    const pad = 8;
    const w = pop.offsetWidth || 200;
    const h = pop.offsetHeight || 172;
    pop.style.left = `${Math.min(window.innerWidth - w - pad, Math.max(pad, x))}px`;
    pop.style.top = `${Math.min(window.innerHeight - h - pad, Math.max(pad, y))}px`;
    window.dispatchEvent(new CustomEvent('inkora-open-color-popover'));
  }

  function openColorPopoverFor(idx, x, y) {
    const targets = new Set([idx]);
    State.selectedIdxs.forEach(si => {
      const sc = State.contours[si];
      if (sc && sc.extruded && sc.piece) targets.add(si);
    });
    State.colorTargetIdxs = targets;
    const c = State.contours[idx];
    const pop = document.getElementById('color-popover');
    pop.dataset.color = c?.piece?.color || '#c8c8d0';
    pop.style.display = 'block';
    const pad = 8;
    const w = pop.offsetWidth || 200;
    const h = pop.offsetHeight || 172;
    pop.style.left = `${Math.min(window.innerWidth - w - pad, Math.max(pad, x))}px`;
    pop.style.top = `${Math.min(window.innerHeight - h - pad, Math.max(pad, y))}px`;
    window.dispatchEvent(new CustomEvent('inkora-open-color-popover'));
  }

  return {
    renderList, refreshContourVisuals, toggleSel, selectAll, selectNone,
    updateButtons, updateModeBadge, updateColorPanel, updateHUD, highlightRow,
    selectOne: _selectOne,
    clearAllSelection: _clearAllSelection,
    _syncPieceSelection,
    scrollToItem,
    applyColorToSelection, openColorPopoverAt, openColorPopoverFor,
  };
})();


/* ══════════════════════════════════════════════════════
   CONTROLADOR PRINCIPAL
   EXTENSIÓN: sistema de comandos, shortcuts, undo/redo.
   ══════════════════════════════════════════════════════ */
(function App(){
  Viewport.init();
  TransformModule.init(Viewport.getScene(), Viewport.getCamera(), document.getElementById('viewport'), Viewport.getRenderer());
  const _lastMouse = { x: Math.round(window.innerWidth / 2), y: Math.round(window.innerHeight / 2) };
  document.addEventListener('mousemove', e => {
    _lastMouse.x = e.clientX;
    _lastMouse.y = e.clientY;
  });

  function pointInPolygon(pt, poly) {
    return Utils.pointInPolygon(pt.x, pt.y, poly);
  }

  function contourArea(c) {
    const box = new THREE.Box2().setFromPoints(c.shape.getPoints(48));
    const size = box.getSize(new THREE.Vector2());
    return size.x * size.y;
  }

  function viewFaceForContour(c) {
    if (!c || !c.extruded || !c.piece?.mesh) return 'top';
    const camera = Viewport.getCamera?.();
    if (!camera) return 'top';
    c.piece.mesh.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(c.piece.mesh);
    if (box.isEmpty()) return 'top';
    const centerY = (box.min.y + box.max.y) / 2;
    const camPos = new THREE.Vector3();
    camera.getWorldPosition(camPos);
    return camPos.y < centerY ? 'bottom' : 'top';
  }

  function faceFromHit(hit, c) {
    if (hit?.capFace) return hit.capFace;
    if (!hit?.point || !c?.piece?.mesh) return viewFaceForContour(c);
    const piece = c.piece;
    const local = piece.mesh.worldToLocal(hit.point.clone());
    const absDepth = Math.abs(piece._depth || 0.1);
    return Math.abs(local.z) < Math.abs(local.z - absDepth) ? 'bottom' : 'top';
  }

  function pickContourOnMergedPiece(hit) {
    if (hit?.contourIdx != null) return hit.contourIdx;
    const piece = State.pieces.find(p => p.mesh === hit?.mesh);
    if (!piece || !piece._mergedSourceIdxs?.length || !hit.point) return -1;
    const local = piece.mesh.worldToLocal(hit.point.clone());
    const pt = new THREE.Vector2(local.x, local.y);
    const candidates = piece._mergedSourceIdxs
      .map(idx => ({ idx, c: State.contours[idx] }))
      .filter(({ c }) => c && c.piece === piece && pointInPolygon(pt, c.shape.getPoints(96)));
    if (!candidates.length) return -1;
    candidates.sort((a, b) => contourArea(a.c) - contourArea(b.c));
    return candidates[0].idx;
  }

  function addMergedContourPickLines(mesh, items, depth) {
    const absDepth = Math.abs(depth) || 0.1;
    const lineMat = new THREE.LineBasicMaterial({
      color: 0x222222,
      transparent: true,
      opacity: 0.95,
      depthTest: true,
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -1,
      polygonOffsetUnits: -1,
    });
    const areaMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0,
      colorWrite: false,
      depthTest: false,
      depthWrite: false,
      side: THREE.DoubleSide,
    });
    function addLine(points, z, idx, face) {
      if (!points.length) return;
      const verts = [];
      points.forEach(p => verts.push(p.x, p.y, z));
      verts.push(points[0].x, points[0].y, z);
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      const line = new THREE.Line(g, lineMat.clone());
      line.renderOrder = 10000;
      line.userData._pickContourIdx = idx;
      line.userData._pickMesh = mesh;
      line.userData._pickArea = 0;
      line.userData._pickFace = face;
      mesh.add(line);
    }
    function addArea(shape, z, idx, face) {
      const g = new THREE.ShapeGeometry(shape);
      g.translate(0, 0, z);
      const area = new THREE.Mesh(g, areaMat);
      area.renderOrder = 9999;
      area.userData._pickContourIdx = idx;
      area.userData._pickMesh = mesh;
      area.userData._pickFace = face;
      const box = new THREE.Box2().setFromPoints(shape.getPoints(48));
      const size = box.getSize(new THREE.Vector2());
      area.userData._pickArea = size.x * size.y;
      mesh.add(area);
    }
    items.forEach(item => {
      const pts = item.c.shape.getPoints(128);
      addArea(item.c.shape, absDepth + 0.16, item.cIdx, 'top');
      addArea(item.c.shape, -0.16, item.cIdx, 'bottom');
      addLine(pts, absDepth + 0.12, item.cIdx, 'top');
      addLine(pts, -0.12, item.cIdx, 'bottom');
    });
  }

  function setExtrudeMode(mode, notify = false) {
    State.extrudeMode = mode === 'merged' ? 'merged' : 'separate';
    document.querySelectorAll('.extrude-mode-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === State.extrudeMode);
    });
    if (notify) {
      Utils.toast(State.extrudeMode === 'merged' ? 'Extrusión: objeto unido.' : 'Extrusión: objetos separados.', 'ok', 1400);
    }
  }

  /* ── History UI ─────────────────────────────────────── */
  const btnUndo  = document.getElementById('btn-undo');
  const btnRedo  = document.getElementById('btn-redo');
  const histLabel= document.getElementById('history-label');

  function updateHistoryUI() {
    btnUndo.disabled  = !History.canUndo();
    btnRedo.disabled  = !History.canRedo();
    histLabel.textContent = History.label();
  }
  History.onChange(updateHistoryUI);

  /* ── restoreSnapshot ─────────────────────────────────
     Reconstruye la escena completa desde un snapshot.
     Borra todo, luego re-crea flatMesh, outlineMesh y
     meshes 3D extruidos según los datos guardados.
  ──────────────────────────────────────────────────────── */
  function restoreSnapshot(snap) {
    if (!snap) return;
    TransformModule.deselect(); TransformModule.hidePanel();
    Viewport.clearAll();
    State.reset();
    GeoModule.resetCounter();
    State.filename = snap.filename;

    const NEUTRAL_COLOR = '#44445a';
    const pieceByContourIdx = new Map();
    function shapeWithSnapshotHoles(srcIdx, pd) {
      const src = snap.contours[srcIdx];
      const sh = WindingUtils.makeShapeCCW(src.shape);
      (pd.holeIdxs || []).forEach(hIdx => {
        const hContour = snap.contours[hIdx];
        if (hContour && hContour.parentIdx === srcIdx) {
          sh.holes.push(WindingUtils.makeHoleCW(hContour.shape));
        }
      });
      return sh;
    }
    snap.contours.forEach((sc, i) => {
      // Contornos ficticios (de extrusión 3D sobre 3D): no tienen mesh 2D propio
      if (sc.isFakeContour) {
        const contour = {
          shape: sc.shape, offX: sc.offX, offY: sc.offY,
          depth: sc.depth, parentIdx: sc.parentIdx,
          layer: sc.layer || '0', color: sc.color || '#dedcff',
          flatMesh: null, outlineMesh: null,
          sel2D: false, extruded: true, piece: null,
          depthOverride: sc.depthOverride ?? null,
          _isFakeContour: true,
          _panelHidden: !!sc.panelHidden,
          _deleted: !!sc.deleted,
        };
        State.contours.push(contour);

        if (sc.pieceData) {
          const pd = sc.pieceData;
          const sourceIdxs = pd.mergedSourceIdxs && pd.mergedSourceIdxs.length ? pd.mergedSourceIdxs : [i];
          const compositeShape = shapeWithSnapshotHoles(sourceIdxs[0], pd);
          const mergedExtraShapes = sourceIdxs.slice(1).map(srcIdx => shapeWithSnapshotHoles(srcIdx, pd));
          const mesh = GeoModule.extrude(compositeShape, sc.offX, sc.offY, {
            depth: pd.depth, bevel: pd.bevel, bevelSeg: pd.bevelSeg, color: pd.color,
            extraShapes: mergedExtraShapes,
          });
          if (sourceIdxs.length > 1) {
            addMergedContourPickLines(mesh, sourceIdxs.map(srcIdx => ({
              cIdx: srcIdx,
              c: { shape: snap.contours[srcIdx].shape },
            })), pd.depth);
          }
          // Restaurar posición base (encima de la pieza original)
          mesh.position.x = pd.baseX !== undefined ? pd.baseX : mesh.position.x;
          mesh.position.y = pd.baseY !== undefined ? pd.baseY : mesh.position.y;
          mesh.position.z = pd.baseZ !== undefined ? pd.baseZ : mesh.position.z;
          Viewport.add3D(mesh);
          const piece = {
            mesh, name: pd.name, color: pd.color,
            contourIdx: i,
            _depth: pd.depth, _bevel: pd.bevel, _bevelSeg: pd.bevelSeg,
            _holeIdxs: pd.holeIdxs || [],
            _mergedSourceIdxs: pd.mergedSourceIdxs || [],
            _sourceContourIdx: pd.sourceContourIdx ?? null,
            tx: pd.tx || 0, ty: pd.ty || 0, tz: pd.tz || 0,
            rotY: pd.rotY || 0, scale: pd.scale || 1,
            _baseX: pd.baseX !== undefined ? pd.baseX : mesh.position.x,
            _baseY: pd.baseY !== undefined ? pd.baseY : mesh.position.y,
            _baseZ: pd.baseZ !== undefined ? pd.baseZ : mesh.position.z,
          };
          State.pieces.push(piece);
          pieceByContourIdx.set(i, piece);
          contour.piece = piece;
          TransformModule.restoreTransform(mesh, piece);
          mesh.visible = pd.visible !== false;
        }
        return;
      }

      // Color del flatMesh: si está extruido usamos el color de la pieza guardado,
      // si no, el color neutral estándar (igual que PanelUI.refreshContourVisuals)
      const flatColor = sc.color || (sc.extruded && sc.pieceData ? sc.pieceData.color : NEUTRAL_COLOR);
      const flatMesh    = GeoModule.makeFlat(sc.shape, sc.offX, sc.offY, flatColor);
      const outlineMesh = GeoModule.makeOutline(sc.shape, sc.offX, sc.offY, flatColor);
      Viewport.add2D(flatMesh);
      Viewport.add2D(outlineMesh);

      const contour = {
        shape: sc.shape, offX: sc.offX, offY: sc.offY,
        depth: sc.depth, parentIdx: sc.parentIdx,
        layer: sc.layer || '0', color: sc.color || '#dedcff',
        flatMesh, outlineMesh,
        sel2D: sc.sel2D, extruded: sc.extruded, piece: null,
        depthOverride: sc.depthOverride ?? null,
        _panelHidden: !!sc.panelHidden,
        _deleted: !!sc.deleted,
      };
      State.contours.push(contour);

      if (sc.extruded && sc.pieceData) {
        const pd = sc.pieceData;
        // Reconstruir compositeShape con los mismos holes que al extruir originalmente
        const sourceIdxs = pd.mergedSourceIdxs && pd.mergedSourceIdxs.length ? pd.mergedSourceIdxs : [i];
        const compositeShape = shapeWithSnapshotHoles(sourceIdxs[0], pd);
        const mergedExtraShapes = sourceIdxs.slice(1).map(srcIdx => shapeWithSnapshotHoles(srcIdx, pd));
        const mesh = GeoModule.extrude(compositeShape, sc.offX, sc.offY, {
          depth: pd.depth, bevel: pd.bevel, bevelSeg: pd.bevelSeg, color: pd.color,
          extraShapes: mergedExtraShapes,
        });
        if (sourceIdxs.length > 1) {
          addMergedContourPickLines(mesh, sourceIdxs.map(srcIdx => ({
            cIdx: srcIdx,
            c: { shape: snap.contours[srcIdx].shape },
          })), pd.depth);
        }
        Viewport.add3D(mesh);
        const piece = {
          mesh, name: pd.name, color: pd.color,
          contourIdx: i,
          _depth: pd.depth, _bevel: pd.bevel, _bevelSeg: pd.bevelSeg,
          _holeIdxs: pd.holeIdxs || [],
          _mergedSourceIdxs: pd.mergedSourceIdxs || [],
          _sourceContourIdx: pd.sourceContourIdx ?? null,
          // Restaurar transform guardado en snapshot
          tx: pd.tx || 0, ty: pd.ty || 0, tz: pd.tz || 0,
          rotY: pd.rotY || 0, scale: pd.scale || 1,
          // Posición base restaurada del snapshot (posición sin transform del usuario)
          _baseX: pd.baseX !== undefined ? pd.baseX : mesh.position.x,
          _baseY: pd.baseY !== undefined ? pd.baseY : mesh.position.y,
          _baseZ: pd.baseZ !== undefined ? pd.baseZ : mesh.position.z,
        };
        State.pieces.push(piece);
        pieceByContourIdx.set(i, piece);
        contour.piece = piece;
        // _baseX/_baseZ = posición que asignó GeoModule (antes de cualquier offset del usuario)
        TransformModule.restoreTransform(mesh, piece);
        mesh.visible = pd.visible !== false;
      } else if (sc.absorbed) {
        // Contorno absorbido como hueco de otra pieza: no genera mesh propio.
        contour.extruded = true;
        contour.piece    = null;
      }
    });

    snap.contours.forEach((sc, i) => {
      if (sc.linkedPieceIdx == null) return;
      const contour = State.contours[i];
      const piece = pieceByContourIdx.get(sc.linkedPieceIdx);
      if (!contour || !piece) return;
      contour.extruded = true;
      contour.sel2D = false;
      contour.piece = piece;
      contour._panelHidden = !!sc.panelHidden;
      if (contour.flatMesh) contour.flatMesh.visible = false;
      if (contour.outlineMesh) contour.outlineMesh.visible = false;
    });

    State.selectedPieceIdx = null;
